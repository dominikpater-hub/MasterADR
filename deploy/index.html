wartych tablicach\"). Dotyczy towarów klasy 1, 4.1, 5.2 (samoreaktywne, nadtlenki organiczne typu B, C, D, E, F), które mają właściwości wybuchowe. Ograniczenia zawarte w przepisach CV3 i CV15.","q":{"mcq":{"prompt":"Ograniczenie masy ładunku na jednostkę transportową zawierają przepisy:","options":["CV2 i CV28","CV3 i CV15","S1 i S3"],"correct":"CV3 i CV15"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-cv3-cv15@adr-2025"},{"id":"b4-cysterna-wielokomorowa","block":4,"topic":"Oznakowanie pojazdu w praktyce","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.3.2.1.3","source":"kompendium","page":21,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Dla numerów UN 1202, UN 1203, UN 1223, UN 1268, UN 1863 można oznakować cysternę wielokomorowa tak, jakby wiozła jeden produkt — najniebezpieczniejszy z przewożonych.","q":{"mcq":{"prompt":"Cysternę wielokomorowa z UN 1202 i UN 1203 można oznakować:","options":["Osobno każda komore","Jak jeden produkt — najniebezpieczniejszy z przewożonych","Bez tablic"],"correct":"Jak jeden produkt — najniebezpieczniejszy z przewożonych"},"scenario":{"prompt":"Cysterna wielokomorowa: olej napędowy (UN 1202) i benzyna (UN 1203). Jakie oznakowanie?","options":["Dwie różne tablice","Tablica dla benzyny — najniebezpieczniejszej","Tablica dla oleju"],"correct":"Tablica dla benzyny — najniebezpieczniejszej"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-cysterna-wielokomorowa@adr-2025"},{"id":"b4-dokument-jezyk","block":4,"topic":"Praca z dokumentem","kind":"fact","scope":"podstawowy","adrRef":"ADR 5.4.1.4.1","source":"kompendium","page":12,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","fill"],"why":"Dokument przewozowy sporządza się w języku kraju nadania, a w transporcie międzynarodowym również w języku angielskim lub niemieckim lub francuskim. Dokument przewozowy należy przechowywać 3 miesiące.","q":{"mcq":{"prompt":"W transporcie międzynarodowym dokument przewozowy sporządza się dodatkowo w języku:","options":["Tylko angielskim","Angielskim lub niemieckim lub francuskim","Dowolnym"],"correct":"Angielskim lub niemieckim lub francuskim"},"fill":{"prompt":"Dokument przewozowy należy przechowywać ___ miesiące.","correct":"3","hint":"liczba"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-dokument-jezyk@adr-2025"},{"id":"b4-dokument-kto","block":4,"topic":"Praca z dokumentem","kind":"fact","scope":"podstawowy","adrRef":"ADR 5.4.1","source":"kompendium","page":12,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Za dokument przewozowy odpowiedzialny jest NADAWCA. Dokument powinien być sporządzony w języku kraju nadania, a w transporcie międzynarodowym również w języku angielskim lub niemieckim lub francuskim. Nie musi być sporządzony pismem maszynowym ani wydrukowany.","q":{"mcq":{"prompt":"Kto odpowiada za dokument przewozowy?","options":["Przewoźnik","Nadawca","Kierowca"],"correct":"Nadawca"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-dokument-kto@adr-2025"},{"id":"b4-dokument-zapisy","block":4,"topic":"Praca z dokumentem","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.4.1.1","source":"kompendium","page":12,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match"],"why":"Zapisy specjalne w dokumencie: \"Przewóz zgodny z 1.1.4.2.1\" — przewóz multimodalny; \"ODPAD\" po numerze UN; \"próżny DPPL, 8\" — próżne opakowania z numerem nalepki; \"GORĄCY\" gdy nazwa nie zawiera PODWYŻSZONA TEMPERATURA lub STOPIONY; \"ZAGRAŻAJĄCY ŚRODOWISKU\" gdy spełnia kryteria (nie stosuje się do UN 3077 i UN 3082).","q":{"match":{"prompt":"Dopasuj zapis w dokumencie do sytuacji:","pairs":{"Przewóz zgodny z 1.1.4.2.1":"przewóz multimodalny","próżny DPPL, 8":"próżne opakowanie","GORĄCY":"materiał w podwyższonej temperaturze"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-dokument-zapisy@adr-2025"},{"id":"b4-dokument-zawartosc","block":4,"topic":"Praca z dokumentem","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.4.1.1.1","source":"kompendium","page":12,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["order","scenario"],"why":"Kolejność zapisu w dokumencie przewozowym: numer UN, prawidłowa nazwa przewozowa, numery nalepek, grupa pakowania (GP), kod tunelu. Przykład: UN 1203 Benzyna Silnikowa zagrażający środowisku, 3, II, (D/E).","q":{"order":{"prompt":"Ulóz kolejność zapisu w dokumencie przewozowym:","items":["Numery nalepek","Numer UN","Prawidłowa nazwa przewozowa","Grupa pakowania"],"correct":["Numer UN","Prawidłowa nazwa przewozowa","Numery nalepek","Grupa pakowania"]},"scenario":{"prompt":"W dokumencie: UN 1580 CHLOROPIKRYNA 6.1 GP I. Co to mówi kierowcy?","options":["Materiał zapalny, małe zagrożenie","Materiał trujący, silnie (I grupa pakowania)","Gaz duszący"],"correct":"Materiał trujący, silnie (I grupa pakowania)"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-dokument-zawartosc@adr-2025"},{"id":"b4-duze-ryzyko-cel","block":4,"topic":"Towary dużego ryzyka","kind":"fact","scope":"podstawowy","adrRef":"ADR 1.10","source":"kompendium","page":25,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Ochrona towarów ma na celu zminimalizowanie ryzyka kradzieży oraz użycia ich niezgodnie z przeznaczeniem. W szczególności zapobieżenie kradzieży pojazdów, kradzieży towarów, zamachom na zaparkowane pojazdy.","q":{"mcq":{"prompt":"Celem ochrony towarów dużego ryzyka (dział 1.10) jest:","options":["Ochrona przed pozarem","Minimalizacja ryzyka kradzieży i użycia niezgodnie z przeznaczeniem","Ochrona środowiska"],"correct":"Minimalizacja ryzyka kradzieży i użycia niezgodnie z przeznaczeniem"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-duze-ryzyko-cel@adr-2025"},{"id":"b4-duze-ryzyko-progi","block":4,"topic":"Towary dużego ryzyka","kind":"ref","scope":"podstawowy","adrRef":"ADR 1.10.3.1","source":"kompendium","page":26,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","mcq"],"why":"Progi towarów dużego ryzyka: klasa 1 (1.1, 1.2, 1.3) — każda ilość w sztukach; gazy palne nietrujące (F, FC) — cysterna 3000 l; gazy trujące (T, TF, TC, TO, TFC, TOC) — każda ilość; klasa 3 GP I i II — cysterna 3000 l; klasa 6.1 GP I — każda ilość; klasa 8 GP I — cysterna 3000 l.","q":{"match":{"prompt":"Dopasuj towar do progu dużego ryzyka (cysterna):","pairs":{"Gazy palne nietrujące (F, FC)":"3000 l","Materiały zapalne ciekłe GP I i II":"3000 l","Materiały żrące GP I":"3000 l"}},"mcq":{"prompt":"Materiały trujące I grupy pakowania (6.1) są towarem dużego ryzyka w ilości:","options":["Powyżej 3000 l","Każda ilość","Powyżej 1000 kg"],"correct":"Każda ilość"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-duze-ryzyko-progi@adr-2025"},{"id":"b4-gasnice-liczba","block":4,"topic":"Dobór gaśnic","kind":"skill","scope":"podstawowy","adrRef":"ADR 8.1.4","source":"kompendium","page":16,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Minimalna liczba gaśnic na jednostce transportowej wynosi 2 — niezależnie od dopuszczalnej masy całkowitej. Jedna gaśnica 12 kg NIE wystarczy: zawsze muszą być co najmniej dwie.","q":{"mcq":{"prompt":"Minimalna liczba gaśnic na jednostce transportowej z towarem ADR wynosi:","options":["1","2","3"],"correct":"2"},"scenario":{"prompt":"Masz jedna gaśnice 12 kg na zestawie 40 t. Czy to spełnia wymóg?","options":["Tak, pojemność się zgadza","Nie — muszą być minimum 2 gaśnice","Tak, jeśli ma aktualny przegląd"],"correct":"Nie — muszą być minimum 2 gaśnice"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-gasnice-liczba@adr-2025"},{"id":"b4-gasnice-pojemnosc","block":4,"topic":"Dobór gaśnic","kind":"skill","scope":"podstawowy","adrRef":"ADR 8.1.4","source":"kompendium","page":16,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","match","scenario"],"why":"Minimalna całkowita pojemność gaśnic wg dopuszczalnej masy całkowitej jednostki transportowej: do 3,5 t = 4 kg; powyżej 3,5 do 7,5 t = 8 kg; powyżej 7,5 t = 12 kg. Gaśnice muszą być typu ABC.","q":{"mcq":{"prompt":"Min. łączna pojemność gaśnic dla jednostki powyżej 7,5 t:","options":["4 kg","8 kg","12 kg"],"correct":"12 kg"},"match":{"prompt":"Dopasuj masę jednostki do min. łącznej pojemności gaśnic:","pairs":{"do 3,5 t":"4 kg","3,5-7,5 t":"8 kg","powyżej 7,5 t":"12 kg"}},"scenario":{"prompt":"Zestaw 40 t z towarem ADR. Min. łączna pojemność gaśnic:","options":["8 kg","12 kg","6 kg"],"correct":"12 kg"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-gasnice-pojemnosc@adr-2025"},{"id":"b4-gasnice-rozklad","block":4,"topic":"Dobór gaśnic","kind":"fact","scope":"podstawowy","adrRef":"ADR 8.1.4.1","source":"kompendium","page":16,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","mcq"],"why":"Rozkład gaśnic: co najmniej jedna gaśnica do gaszenia pożaru silnika lub kabiny o minimalnej pojemności 2 kg (dla każdej kategorii masy). Wymagana gaśnica dodatkowa: min. 2 kg dla jednostki do 3,5 t; min. 6 kg dla jednostki powyżej 3,5 t.","q":{"match":{"prompt":"Dopasuj masę jednostki do min. pojemności gaśnicy DODATKOWEJ:","pairs":{"do 3,5 t":"2 kg","powyżej 3,5 t":"6 kg"}},"mcq":{"prompt":"Gaśnica do gaszenia pożaru silnika lub kabiny musi mieć min. pojemność:","options":["2 kg","6 kg","12 kg"],"correct":"2 kg"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-gasnice-rozklad@adr-2025"},{"id":"b4-gasnice-s3","block":4,"topic":"Dobór gaśnic","kind":"skill","scope":"podstawowy","adrRef":"ADR przepis S3","source":"kompendium","page":16,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Zgodnie z przepisem S3 dla towarów klasy 6.2 (zakaźne) niezależnie od DMC pojazdu wystarczy gaśnica 2 kg typu ABC, a latarka może być o dowolnej konstrukcji.","q":{"mcq":{"prompt":"Dla towarów klasy 6.2 (zakaźne) wg przepisu S3 wystarczy gaśnica:","options":["2 kg ABC niezależnie od DMC","12 kg","6 kg"],"correct":"2 kg ABC niezależnie od DMC"},"scenario":{"prompt":"Wieziesz odpady medyczne (6.2) zestawem 20 t. Ile gaśnicy potrzebujesz wg S3?","options":["12 kg jak dla każdego zestawu","Wystarczy 2 kg ABC","8 kg"],"correct":"Wystarczy 2 kg ABC"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-gasnice-s3@adr-2025"},{"id":"b4-instrukcje-forma","block":4,"topic":"Praca z dokumentem","kind":"fact","scope":"podstawowy","adrRef":"ADR 5.4.3","source":"kompendium","page":13,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","match"],"why":"Instrukcje pisemne zawierają: sprzet ochrony ogólnej i indywidualnej, czynności w razie wypadku lub awarii, charakterystyke zagrożeń, wzory nalepek. Muszą być dostępne w języku zrozumiałym dla załogi, przechowywane w kabinie kierowcy w łatwo dostepnym miejscu, wydrukowane W KOLORZE. Po zakończeniu transportu powinny pozostać w pojeździe. Wymagane tylko na \"otwartych tablicach\".","q":{"mcq":{"prompt":"Instrukcje pisemne muszą być wydrukowane:","options":["Czarno-bialo","W kolorze","Dowolnie"],"correct":"W kolorze"},"match":{"prompt":"Dopasuj zawartość instrukcji pisemnej:","pairs":{"Sprzet ochrony":"wyposażenie 8.1.5","Czynności w razie wypadku":"procedura awaryjna","Wzory nalepek":"charakterystyka zagrożeń"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-instrukcje-forma@adr-2025"},{"id":"b4-instrukcje-kto","block":4,"topic":"Praca z dokumentem","kind":"fact","scope":"podstawowy","adrRef":"ADR 5.4.3","source":"kompendium","page":13,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Za instrukcje pisemne odpowiedzialny jest PRZEWOŹNIK. Instrukcje są zgodne ze wzorem zawartym w umowie ADR i uniwersalne — dla każdego produktu takie same. Należy się z nimi zapoznać przed rozpoczęciem transportu.","q":{"mcq":{"prompt":"Kto odpowiada za instrukcje pisemne?","options":["Nadawca","PRZEWOŹNIK","Kierowca"],"correct":"PRZEWOŹNIK"},"scenario":{"prompt":"Instrukcje pisemne dla przewozu benzyny i dla przewozu kwasu są:","options":["Różne","Takie same — wzór uniwersalny","Zależne od nadawcy"],"correct":"Takie same — wzór uniwersalny"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-instrukcje-kto@adr-2025"},{"id":"b4-kontener-cysterna","block":4,"topic":"Oznakowanie pojazdu w praktyce","kind":"fact","scope":"podstawowy","adrRef":"ADR 5.3.1.3","source":"kompendium","page":21,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Kontener-cysterna powinien być oznakowany nalepkami ostrzegawczymi z 4 stron.","q":{"mcq":{"prompt":"Kontener-cysterna oznakowany jest nalepkami z:","options":["2 stron","3 stron","4 stron"],"correct":"4 stron"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-kontener-cysterna@adr-2025"},{"id":"b4-kontrola","block":4,"topic":"Towary dużego ryzyka","kind":"fact","scope":"podstawowy","adrRef":"art. 99 ustawy","source":"kompendium","page":26,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Kontrola przewozu zgodnie z art. 99 ustawy o transporcie towarów niebezpiecznych może być przeprowadzana na drogach i parkingach przez: inspektorów Inspekcji Transportu Drogowego, funkcjonariuszy Policji, Straży Granicznej, Służb Celnych oraz żołnierzy Żandarmerii Wojskowej (w zakresie przewozu wykonywanego przez siły zbrojne).","q":{"mcq":{"prompt":"Kto NIE może kontrolować przewozu ADR na drodze?","options":["ITD","Straż Pożarna","Policja"],"correct":"Straż Pożarna"},"scenario":{"prompt":"Żandarmeria Wojskowa może kontrolować Twój przewóz ADR:","options":["Zawsze","Tylko w zakresie przewozu wykonywanego przez siły zbrojne","Nigdy"],"correct":"Tylko w zakresie przewozu wykonywanego przez siły zbrojne"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-kontrola@adr-2025"},{"id":"b4-ladunek-calkowity","block":4,"topic":"Decyzja o załadunku","kind":"ref","scope":"podstawowy","adrRef":"ADR 1.2.1","source":"kompendium","page":24,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Ładunek całkowity oznacza ładunek pochodzący od jednego nadawcy, mającego wyłączne prawo do używania pojazdu lub kontenera wielkiego, a wszystkie czynności załadunkowe i rozładunkowe wykonywane są zgodnie z instrukcjami nadawcy lub odbiorcy. W odniesieniu do materiałów promieniotwórczych odpowiednim określeniem jest \"używanie wyłączne\".","q":{"mcq":{"prompt":"W odniesieniu do materiałów promieniotwórczych \"ładunek całkowity\" nazywa się:","options":["Przewóz dedykowany","Używanie wyłączne","Transport zamknięty"],"correct":"Używanie wyłączne"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-ladunek-calkowity@adr-2025"},{"id":"b4-lopata-oslona","block":4,"topic":"Dobór wyposażenia","kind":"skill","scope":"podstawowy","adrRef":"ADR 8.1.5.3","source":"kompendium","page":16,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Łopata, osłona otworów kanalizacyjnych i pojemnik do zbierania pozostałości są wymagane TYLKO dla nalepek 3, 4.1, 4.3, 8 lub 9. Niezależnie od ilości członków załogi — tylko 1 sztuka w pojeździe.","q":{"mcq":{"prompt":"Łopata, osłona kanalizacji i pojemnik wymagane są przy nalepkach:","options":["2.3 i 6.1","3, 4.1, 4.3, 8 lub 9","Wszystkich"],"correct":"3, 4.1, 4.3, 8 lub 9"},"scenario":{"prompt":"Załoga 2 osoby, przewóz klasy 3. Ile łopat?","options":["Dwie","Jedna — niezależnie od liczby załogi","Żadna"],"correct":"Jedna — niezależnie od liczby załogi"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-lopata-oslona@adr-2025"},{"id":"b4-maska-ucieczkowa","block":4,"topic":"Dobór wyposażenia","kind":"skill","scope":"podstawowy","adrRef":"ADR 8.1.5.3","source":"kompendium","page":16,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Maska ucieczkowa dla KAŻDEGO członka załogi pojazdu powinna być przewożona w jednostce transportowej w przypadku nalepek ostrzegawczych 2.3 lub 6.1.","q":{"mcq":{"prompt":"Maska ucieczkowa wymagana jest przy nalepkach:","options":["3 i 8","2.3 lub 6.1","4.1 i 9"],"correct":"2.3 lub 6.1"},"scenario":{"prompt":"Przewozisz gaz trujący (2.3), załoga 2 osoby. Ile masek ucieczkowych?","options":["Jedna","Dwie — na każdego członka załogi","Żadna"],"correct":"Dwie — na każdego członka załogi"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-maska-ucieczkowa@adr-2025"},{"id":"b4-nadzor-parkingi","block":4,"topic":"Ruch drogowy i postoj","kind":"fact","scope":"podstawowy","adrRef":"ADR 8.4 / S1(6), S14-S24","source":"kompendium","page":22,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","order"],"why":"Pojazdy przewożące towary niebezpieczne w ilościach podanych w przepisach specjalnych S1(6) i S14 do S24 powinny być nadzorowane lub mogą być zaparkowane bez nadzoru na parkingach strzeżonych lub strzeżonych miejscach na terenie przedsiębiorstwa. W razie braku takich warunków: (a) parking nadzorowany przez personel poinformowany o właściwościach ładunku i miejscu pobytu kierowcy; (b) parking gdzie pojazd nie jest narażony na uszkodzenie; (c) miejsce na otwartym terenie, oddzielone od głównych dróg i budynków mieszkalnych.","q":{"mcq":{"prompt":"Pojazd z towarami wg S1(6) i S14-S24 może być zaparkowany bez nadzoru:","options":["Na każdym parkingu","Na parkingu strzeżonym lub strzeżonym miejscu na terenie przedsiębiorstwa","Tylko przy drodze"],"correct":"Na parkingu strzeżonym lub strzeżonym miejscu na terenie przedsiębiorstwa"},"order":{"prompt":"Ulóz alternatywy postoju wg kolejności z przepisów (a, b, c):","items":["Otwarty teren z dala od dróg i budynków","Parking nadzorowany przez poinformowany personel","Parking gdzie pojazd nie jest narażony na uszkodzenie"],"correct":["Parking nadzorowany przez poinformowany personel","Parking gdzie pojazd nie jest narażony na uszkodzenie","Otwarty teren z dala od dróg i budynków"]}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-nadzor-parkingi@adr-2025"},{"id":"b4-oznakowanie-luzem-cysterna","block":4,"topic":"Oznakowanie pojazdu w praktyce","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.3.1 / 5.3.2","source":"kompendium","page":21,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Jednostki przewożące towary LUZEM lub W CYSTERNIE powinny być oznakowane tablicami Z NUMERAMI z przodu i tyłu jednostki transportowej oraz nalepkami z TRZECH stron — z obu boków oraz z tyłu.","q":{"mcq":{"prompt":"Pojazd przewożący towar luzem lub w cysternie oznakowuje się nalepkami:","options":["Z dwóch stron","Z trzech stron — oba boki i tył","Z czterech stron"],"correct":"Z trzech stron — oba boki i tył"},"scenario":{"prompt":"Cysterna z olejem napędowym. Gdzie tablice z numerami?","options":["Tylko z przodu","Z przodu i tyłu jednostki","Na bokach"],"correct":"Z przodu i tyłu jednostki"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-oznakowanie-luzem-cysterna@adr-2025"},{"id":"b4-oznakowanie-sztuki-pojazd","block":4,"topic":"Oznakowanie pojazdu w praktyce","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.3.2","source":"kompendium","page":21,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Jednostki przewożące towary niebezpieczne w SZTUKACH PRZESYŁKI (np. butle gazowe, DPPL, kanistry, BIG-BAGi) powinny być oznakowane WYŁĄCZNIE tablicami BEZ numerów z przodu i tyłu pojazdu. NIE stosujemy w takim przypadku nalepek.","q":{"mcq":{"prompt":"Pojazd przewożący towary w sztukach przesyłki oznakowuje się:","options":["Tablicami z numerami","Tablicami bez numerów z przodu i tyłu","Nalepkami z trzech stron"],"correct":"Tablicami bez numerów z przodu i tyłu"},"scenario":{"prompt":"Wieziesz kanistry z farba (sztuki przesyłki). Czy umieszczasz nalepki na pojeździe?","options":["Tak, z obu boków","Nie — przy sztukach przesyłki nalepek nie stosujemy","Tak, z tyłu"],"correct":"Nie — przy sztukach przesyłki nalepek nie stosujemy"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-oznakowanie-sztuki-pojazd@adr-2025"},{"id":"b4-oznakowanie-wariant2","block":4,"topic":"Oznakowanie pojazdu w praktyce","kind":"fact","scope":"podstawowy","adrRef":"ADR 5.3.2.1.2","source":"kompendium","page":21,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Drugi sposób oznakowania jednostki przewożącej jeden ładunek luzem lub w cysternie: tablice BEZ numerów z przodu i tyłu pojazdu oraz tablice Z NUMERAMI na obu bokach. Nalepki ostrzegawcze muszą być umieszczone z obu boków i z tyłu pojazdu.","q":{"mcq":{"prompt":"W wariancie drugim oznakowania cysterny tablice z numerami umieszcza się:","options":["Z przodu i tyłu","Na obu bokach","Tylko z tyłu"],"correct":"Na obu bokach"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-oznakowanie-wariant2@adr-2025"},{"id":"b4-pasazerowie","block":4,"topic":"Ruch drogowy i postoj","kind":"fact","scope":"podstawowy","adrRef":"ADR 8.3.1","source":"kompendium","page":13,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"W pojeździe \"na pełnym ADR\" nie wolno przewozić pasażerów, a jedynie członków załogi. Każdy członek załogi musi mieć dokument tożsamości.","q":{"mcq":{"prompt":"Kogo wolno przewozić w pojeździe na pełnym ADR?","options":["Dowolnych pasażerów","Tylko członków załogi","Pasażerów za zgoda nadawcy"],"correct":"Tylko członków załogi"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-pasazerowie@adr-2025"},{"id":"b4-plan-ochrony-wymogi","block":4,"topic":"Towary dużego ryzyka","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.10","source":"kompendium","page":26,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Zapamiętaj: plan ochrony WYMAGA legitymowania kierowcy i wykazu osób. NIE WYMAGA specjalnego znakowania przesyłek lub pojazdów, nadzoru GPS ani konwojenta.","q":{"mcq":{"prompt":"Plan ochrony towarów dużego ryzyka NIE wymaga:","options":["Legitymowania kierowcy","Nadzoru GPS i konwojenta","Wykazu osób"],"correct":"Nadzoru GPS i konwojenta"},"scenario":{"prompt":"Przewozisz towar dużego ryzyka. Czy pojazd musi mieć GPS?","options":["Tak, obowiazkowo","Nie — plan ochrony nie wymaga GPS","Tylko przy klasie 1"],"correct":"Nie — plan ochrony nie wymaga GPS"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-plan-ochrony-wymogi@adr-2025"},{"id":"b4-plan-ochrony","block":4,"topic":"Towary dużego ryzyka","kind":"fact","scope":"podstawowy","adrRef":"ADR 1.10.3.2","source":"kompendium","page":25,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","match"],"why":"Plan ochrony zawiera m.in.: szczegółowy podział obowiązków i wykaz osób, wykaz towarów niebezpiecznych podlegających ochronie, opis czynności i ocenę zagrożeń, plan szkolenia i procedury postępowania, procedury powiadamiania, procedury oceny i testowania planów, działania zapewniające ochronę fizyczna informacji, działania ograniczające dostęp do informacji.","q":{"mcq":{"prompt":"Plan ochrony towarów dużego ryzyka musi zawierać m.in.:","options":["Trasę przejazdu","Wykaz osób i wykaz towarów podlegających ochronie","Numer rejestracyjny"],"correct":"Wykaz osób i wykaz towarów podlegających ochronie"},"match":{"prompt":"Dopasuj element planu ochrony:","pairs":{"Wykaz osób":"podział obowiązków","Plan szkolenia":"procedury postępowania","Ochrona informacji":"ograniczenie dostepu"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-plan-ochrony@adr-2025"},{"id":"b4-plyn-do-oczu","block":4,"topic":"Dobór wyposażenia","kind":"skill","scope":"podstawowy","adrRef":"ADR 8.1.5.2","source":"kompendium","page":16,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Płyn do płukania oczu NIE jest wymagany przy nalepkach 1, 1.4, 1.5, 1.6, 2.1, 2.2 i 2.3. Płyn to tylko 1 sztuka w pojeździe, niezależnie od ilości członków załogi.","q":{"mcq":{"prompt":"Ile płynu do płukania oczu musi być w pojeździe?","options":["Jedna sztuka niezależnie od liczby załogi","Po jednej na każdego członka załogi","Dwie sztuki"],"correct":"Jedna sztuka niezależnie od liczby załogi"},"scenario":{"prompt":"Przewozisz gazy palne (2.1). Czy potrzebujesz płynu do płukania oczu?","options":["Tak, zawsze","Nie — przy nalepkach 2.1 nie jest wymagany","Tylko przy cysternie"],"correct":"Nie — przy nalepkach 2.1 nie jest wymagany"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-plyn-do-oczu@adr-2025"},{"id":"b4-predkosc","block":4,"topic":"Ruch drogowy i postoj","kind":"skill","scope":"podstawowy","adrRef":"przepisy krajowe","source":"kompendium","page":22,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Dla przewozu towarów niebezpiecznych NIE obowiązuje podwyższenie prędkości w terenie zabudowanym. Maksymalnie 50 km/h.","q":{"mcq":{"prompt":"Maksymalna prędkość pojazdu z towarem ADR w terenie zabudowanym:","options":["50 km/h","60 km/h","70 km/h"],"correct":"50 km/h"},"scenario":{"prompt":"Teren zabudowany, znak dopuszcza 60 km/h. Wieziesz ADR. Ile możesz jechać?","options":["60 km/h","50 km/h — podwyższenie nie obowiązuje przy ADR","70 km/h"],"correct":"50 km/h — podwyższenie nie obowiązuje przy ADR"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-predkosc@adr-2025"},{"id":"b4-segregacja-zakazy","block":4,"topic":"Decyzja o załadunku","kind":"skill","scope":"podstawowy","adrRef":"ADR 7.5.2.1","source":"kompendium","page":25,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Zakazy ładowania razem do jednego pojazdu lub kontenera zawarte są w przepisie 7.5.2.1. W uproszczeniu dotyczą towarów klasy 1 (wybuchowe), 4.1 + 1 (samoreaktywne) oraz 5.2 + 1 (nadtlenki organiczne) o właściwościach wybuchowych.","q":{"mcq":{"prompt":"Zakazy ładowania razem dotyczą w uproszczeniu:","options":["Wszystkich klas","Klasy 1, 4.1+1 i 5.2+1 o właściwościach wybuchowych","Tylko klas 6 i 8"],"correct":"Klasy 1, 4.1+1 i 5.2+1 o właściwościach wybuchowych"},"scenario":{"prompt":"Chcesz załadować razem klasę 3 i klasę 8. Czy wolno?","options":["Nie, zawsze zabronione","Tak — ładowanie razem tych klas jest dozwolone","Tylko w cysternie"],"correct":"Tak — ładowanie razem tych klas jest dozwolone"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-segregacja-zakazy@adr-2025"},{"id":"b4-sprawozdanie-roczne","block":4,"topic":"Praca z dokumentem","kind":"ref","scope":"podstawowy","adrRef":"ADR 1.8.3.6","source":"kompendium","page":15,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","fill"],"why":"Każda firma ładująca, przewożąca, rozładowująca towary niebezpieczne musi wyznaczyć doradcę DGSA. Sporządza on sprawozdanie roczne do ITD, składane do 28 lutego za poprzedni rok. Za niezłożenie sprawozdania kara wynosi 5000 PLN.","q":{"mcq":{"prompt":"Do kiedy składa się sprawozdanie roczne do ITD?","options":["Do 31 stycznia","Do 28 lutego","Do 31 marca"],"correct":"Do 28 lutego"},"fill":{"prompt":"Kara za niezłożenie sprawozdania rocznego wynosi ___ PLN.","correct":"5000","hint":"liczba"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-sprawozdanie-roczne@adr-2025"},{"id":"b4-swiadectwo-typy","block":4,"topic":"Praca z dokumentem","kind":"fact","scope":"podstawowy","adrRef":"ADR 9.1.1.2","source":"kompendium","page":15,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match"],"why":"Oznaczenia pojazdów wymagających świadectwa: EX/II i EX/III — przewóz klasy 1 (wybuchowe); FL i AT — cysterny; MEMU — mobilna jednostka do wytwarzania materiałów wybuchowych.","q":{"match":{"prompt":"Dopasuj oznaczenie pojazdu do zastosowania:","pairs":{"EX/II, EX/III":"przewóz klasy 1 (wybuchowe)","FL, AT":"cysterny","MEMU":"mobilna jednostka wytwarzania wybuchowych"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-swiadectwo-typy@adr-2025"},{"id":"b4-swiadectwo","block":4,"topic":"Praca z dokumentem","kind":"skill","scope":"podstawowy","adrRef":"ADR 9.1.3","source":"kompendium","page":15,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Świadectwo dopuszczenia (tzw. \"czerwony pasek\") wymagane jest przy przewozie towarów klasy 1 (pojazdy EX/II, EX/III) oraz w cysternach (pojazdy FL, AT) i MEMU. Potwierdza specjalna konstrukcje pojazdu. Wydawany w Polsce przez TDT na maksymalny okres JEDNEGO ROKU. Pojazdy przewożące sztuki przesyłki (poza wybuchowymi) i luzem NIE muszą mieć świadectwa — np. butle z gazem, DPPL, kanistry.","q":{"mcq":{"prompt":"Świadectwo dopuszczenia pojazdu wydawane jest na maksymalny okres:","options":["1 roku","5 lat","Bezterminowo"],"correct":"1 roku"},"scenario":{"prompt":"Przewozisz butle z gazem i kanistry (sztuki przesyłki). Czy pojazd potrzebuje \"czerwonego paska\"?","options":["Tak, zawsze przy ADR","Nie — sztuki przesyłki poza klasa 1 nie wymagaja świadectwa","Tylko powyżej 3,5 t"],"correct":"Nie — sztuki przesyłki poza klasa 1 nie wymagaja świadectwa"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-swiadectwo@adr-2025"},{"id":"b4-tunel-brak-kodu","block":4,"topic":"Decyzja o tunelu","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.9.5 / kol. 15","source":"kompendium","page":23,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Do tunelu kategorii E mogą wjeżdżać pojazdy z towarami, które w kolumnie 15 tabeli A mają \"(-)\" — czyli brak kodu tunelowego. Należą tu m.in. UN 2814, 2900, 2919, 3166, 3171, 3331, 3359, 3373, 3549.","q":{"mcq":{"prompt":"Kod tunelowy \"(-)\" w kolumnie 15 oznacza:","options":["Zakaz wszystkich tuneli","Brak ograniczeń — można wjechać do każdego tunelu","Tylko tunel A"],"correct":"Brak ograniczeń — można wjechać do każdego tunelu"},"scenario":{"prompt":"Wieziesz UN 3373 (kod tunelowy \"-\"). Tunel kategorii E — wjeżdżasz?","options":["Nie, zakaz","Tak — kod \"(-)\" pozwala na każdy tunel","Tylko z eskorta"],"correct":"Tak — kod \"(-)\" pozwala na każdy tunel"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-tunel-brak-kodu@adr-2025"},{"id":"b4-tunel-zachowanie","block":4,"topic":"Decyzja o tunelu","kind":"fact","scope":"podstawowy","adrRef":"ADR 8.6 / przepisy ruchu","source":"kompendium","page":23,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","match","scenario"],"why":"W tunelu ZAKAZUJE się: palenia, używania okularów przeciwsłonecznych, używania telefonu komórkowego i radia CB. W tunelu NALEŻY: stosować się do znaków i sygnałów, słuchać komunikatów radiowych, włączyć światła mijania.","q":{"mcq":{"prompt":"Czego NIE wolno robić w tunelu przewożąc ADR?","options":["Włączać świateł mijania","Używać okularów przeciwsłonecznych i telefonu","Słuchać komunikatów radiowych"],"correct":"Używać okularów przeciwsłonecznych i telefonu"},"match":{"prompt":"Dopasuj zachowanie w tunelu:","pairs":{"Palenie":"zakazane","Okulary przeciwsloneczne":"zakazane","Światła mijania":"nakazane","Komunikaty radiowe":"nakazane"}},"scenario":{"prompt":"Wjeżdżasz do tunelu z ADR. Co robisz ze światłami?","options":["Gaszę wszystkie","Włączam światła mijania","Włączam awaryjne"],"correct":"Włączam światła mijania"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-tunel-zachowanie@adr-2025"},{"id":"b4-tunele-kategorie","block":4,"topic":"Decyzja o tunelu","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.9.5","source":"kompendium","page":23,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Kategorie tuneli: A — bez ograniczeń (znak D-37, nieoznakowany), B, C, D, E — coraz bardziej restrykcyjne. Kod (B) = zagrażające wybuchem o bardzo dużym zasięgu; (C) = wybuch o dużym zasięgu lub działanie trujące o dużym zasięgu; (D) = jw. lub duży pożar; (E) = zakaz dla ilości ograniczonych powyżej 8 t brutto.","q":{"mcq":{"prompt":"Która kategoria tunelu jest najbardziej restrykcyjna?","options":["Kategoria A","Kategoria C","Kategoria E"],"correct":"Kategoria E"},"scenario":{"prompt":"Towar ma kod tunelowy (B). Przez które tunele możesz przejechać?","options":["Wszystkie","Tylko A (nieoznakowany / D-37)","A, B i C"],"correct":"Tylko A (nieoznakowany / D-37)"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-tunele-kategorie@adr-2025"},{"id":"b4-tunele-kod","block":4,"topic":"Decyzja o tunelu","kind":"fact","scope":"podstawowy","adrRef":"ADR 1.9.5 / kol. 15","source":"kompendium","page":23,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Kategoria tunelu podaje informacje, która umożliwia przewoźnikowi (kierowcy) precyzyjne określenie kategorii tunelu, przez które NIE jest dozwolony przewóz konkretnego towaru. Podana jest pod znakiem B-13a w postaci litery B, C, D lub E.","q":{"mcq":{"prompt":"Kategoria tunelu podana jest pod znakiem:","options":["B-13","B-13a","D-37"],"correct":"B-13a"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-tunele-kod@adr-2025"},{"id":"b4-wyposazenie-jednostka","block":4,"topic":"Dobór wyposażenia","kind":"fact","scope":"podstawowy","adrRef":"ADR 8.1.5","source":"kompendium","page":16,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","match"],"why":"Wyposażenie na jednostkę transportową: klin pod koła dla KAŻDEGO pojazdu (o rozmiarze odpowiednim do DMC i średnicy kol), dwa stojące znaki ostrzegawcze, płyn do płukania oczu.","q":{"mcq":{"prompt":"Ile stojących znaków ostrzegawczych wymaganych na jednostce transportowej?","options":["Jeden","Dwa","Cztery"],"correct":"Dwa"},"match":{"prompt":"Przypisz wyposażenie do zakresu:","pairs":{"Klin pod koła":"dla każdego pojazdu","Dwa znaki ostrzegawcze":"na jednostkę transportową"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-wyposazenie-jednostka@adr-2025"},{"id":"b4-wyposazenie-zaloga","block":4,"topic":"Dobór wyposażenia","kind":"fact","scope":"podstawowy","adrRef":"ADR 8.1.5.2","source":"kompendium","page":16,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","match"],"why":"Dla KAŻDEGO członka załogi pojazdu: kamizelka ostrzegawcza, przenosne urządzenie oświetleniowe (latarka), para rękawic ochronnych, ochrona oczu (okulary).","q":{"mcq":{"prompt":"Kamizelka ostrzegawcza, latarka, rękawice i okulary przypadają:","options":["Jedna sztuka na pojazd","Na każdego członka załogi","Tylko dla kierowcy"],"correct":"Na każdego członka załogi"},"match":{"prompt":"Przypisz wyposażenie do zakresu:","pairs":{"Kamizelka ostrzegawcza":"na każdego członka załogi","Płyn do płukania oczu":"jedna sztuka na pojazd","Klin pod koła":"dla każdego pojazdu"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-wyposazenie-zaloga@adr-2025"},{"id":"b4-znak-b13","block":4,"topic":"Ruch drogowy i postoj","kind":"skill","scope":"podstawowy","adrRef":"znaki drogowe PL","source":"kompendium","page":22,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Znak B-13 oznacza zakaz wjazdu dla pojazdów przewożących towary niebezpieczne klas: 1, gazy palne (2F), 3, 4.1, 4.2, 4.3, 5.1, 5.2 — czyli wszystkie nalepki z płomieniem.","q":{"mcq":{"prompt":"Znak B-13 dotyczy towarów:","options":["Zagrażających środowisku","Z nalepkami z płomieniem (1, 2F, 3, 4.1, 4.2, 4.3, 5.1, 5.2)","Trujacych"],"correct":"Z nalepkami z płomieniem (1, 2F, 3, 4.1, 4.2, 4.3, 5.1, 5.2)"},"scenario":{"prompt":"Wieziesz benzynę (klasa 3). Czy obowiązuje Cię znak B-13?","options":["Nie","Tak — klasa 3 ma nalepkę z płomieniem","Tylko w cysternie"],"correct":"Tak — klasa 3 ma nalepkę z płomieniem"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-znak-b13@adr-2025"},{"id":"b4-znak-b13a","block":4,"topic":"Ruch drogowy i postoj","kind":"skill","scope":"podstawowy","adrRef":"znaki drogowe PL","source":"kompendium","page":22,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Znak B-13a / C-3h oznacza zakaz wjazdu dla pojazdów przewożących towary niebezpieczne WSZYSTKICH KLAS oznakowanych tablicami pomarańczowymi.","q":{"mcq":{"prompt":"Znak B-13a zakazuje wjazdu pojazdom:","options":["Tylko z klasa 1","Wszystkich klas oznakowanych tablicami pomarańczowymi","Tylko cysternom"],"correct":"Wszystkich klas oznakowanych tablicami pomarańczowymi"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-znak-b13a@adr-2025"},{"id":"b4-znak-b14","block":4,"topic":"Ruch drogowy i postoj","kind":"skill","scope":"podstawowy","adrRef":"znaki drogowe PL","source":"kompendium","page":22,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Znak B-14 oznacza zakaz wjazdu ze szkodliwymi dla środowiska wodnego: gazy trujące, żrące, klasa 3, 4.3, 6.1, 6.2, 8, część klasy 9 + znak \"ryba\" (zagrażający środowisku).","q":{"mcq":{"prompt":"Znak B-14 dotyczy towarów:","options":["Z nalepkami z płomieniem","Szkodliwych dla środowiska wodnego","Wybuchowych"],"correct":"Szkodliwych dla środowiska wodnego"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-znak-b14@adr-2025"},{"id":"b4-znaki-pozostale","block":4,"topic":"Ruch drogowy i postoj","kind":"fact","scope":"podstawowy","adrRef":"znaki drogowe PL","source":"kompendium","page":22,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match"],"why":"D-37 — dozwolony wjazd z wszystkimi towarami niebezpiecznymi (tunel). C-17 — nakazany kierunek jazdy dla pojazdów przewożących towary niebezpieczne. T-23i, T-23j, T-23h — tabliczki precyzujące rodzaj towaru.","q":{"match":{"prompt":"Dopasuj znak do znaczenia:","pairs":{"B-13a":"zakaz — wszystkie klasy z tablicami","D-37":"dozwolony wjazd z wszystkimi towarami","C-17":"nakazany kierunek jazdy"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-znaki-pozostale@adr-2025"},{"id":"b5-dgsa-zdarzenie","block":5,"topic":"Powiadamianie służb","kind":"fact","scope":"podstawowy","adrRef":"ADR 1.8.5","source":"kompendium","page":27,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"O każdym zdarzeniu należy poinformować doradcę DGSA w firmie w celu oceny, czy nie jest wymagane sporządzenie raportu powypadkowego.","q":{"mcq":{"prompt":"Kogo należy poinformować o każdym zdarzeniu z towarem niebezpiecznym?","options":["Tylko policję","Doradcę DGSA w firmie","Nadawcę"],"correct":"Doradcę DGSA w firmie"},"scenario":{"prompt":"Doszło do kolizji z niewielkim wyciekiem. Kto ocenia czy potrzebny raport powypadkowy?","options":["Kierowca","Doradca DGSA","Policja"],"correct":"Doradca DGSA"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b5-dgsa-zdarzenie@adr-2025"},{"id":"b5-dokument-awaryjny","block":5,"topic":"Powiadamianie służb","kind":"fact","scope":"podstawowy","adrRef":"ADR 5.4.1","source":"kompendium","page":27,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Najważniejszym dokumentem w sytuacji awaryjnej jest DOKUMENT PRZEWOZOWY, ponieważ zawiera informacje na temat towaru i jego właściwości.","q":{"mcq":{"prompt":"Najważniejszy dokument w sytuacji awaryjnej to:","options":["Instrukcja pisemną","Dokument przewozowy","Świadectwo dopuszczenia"],"correct":"Dokument przewozowy"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b5-dokument-awaryjny@adr-2025"},{"id":"b5-fissile","block":5,"topic":"Wskazówki per klasa","kind":"ref","scope":"podstawowy","adrRef":"ADR 5.4.3.4 tabela","source":"kompendium","page":3,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Nalepka 7E (FISSILE — materiał rozszczepialny) oznacza zagrożenie reakcja łańcuchowa.","q":{"mcq":{"prompt":"Nalepka FISSILE (7E) oznacza zagrożenie:","options":["Napromieniowaniem zewnetrznym","Reakcja łańcuchowa","Poparzeniem"],"correct":"Reakcja łańcuchowa"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b5-fissile@adr-2025"},{"id":"b5-gasnica-parametry","block":5,"topic":"Gaszenie pożaru","kind":"skill","scope":"podstawowy","adrRef":"praktyka gaszenia","source":"kompendium","page":27,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","mcq"],"why":"Strumień proszku kierujemy w źródło płomieni od strony nawietrznej. Czas wyładowania gaśnicy 6 kg to około 10 s, a 2 kg to około 6 s. Zasięg gaśnic to około 4 m.","q":{"match":{"prompt":"Dopasuj gaśnice do czasu wyładowania:","pairs":{"Gaśnica 6 kg":"około 10 s","Gaśnica 2 kg":"około 6 s"}},"mcq":{"prompt":"Zasięg gaśnicy proszkowej wynosi około:","options":["1 m","4 m","10 m"],"correct":"4 m"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b5-gasnica-parametry@adr-2025"},{"id":"b5-gaszenie","block":5,"topic":"Gaszenie pożaru","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.4.3.4","source":"kompendium","page":27,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario","mcq"],"why":"Jeżeli jest to właściwe i bezpieczne, użyć gaśnic w celu ugaszenia małego lub będącego w fazie początkowej pożaru, obejmującego opony, hamulce lub przedział silnika. Członkowie załogi NIE powinni gasić pożaru obejmującego przedział ładunkowy. Nie gasimy ładunku.","q":{"scenario":{"prompt":"Zapalila się przestrzeń ładunkowa z towarem niebezpiecznym. Twoje działanie:","options":["Gaszę gaśnica pokladowa","Oddalam się i wzywam straż — nie gasimy ładunku","Otwieram ładunek"],"correct":"Oddalam się i wzywam straż — nie gasimy ładunku"},"mcq":{"prompt":"Gaśnica pokladowa kierowca może gasić:","options":["Pożar przestrzeni ladunkowej","Mały pożar opon, hamulców lub silnika","Każdy pożar"],"correct":"Mały pożar opon, hamulców lub silnika"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b5-gaszenie@adr-2025"},{"id":"b5-kolejnosc-informacji","block":5,"topic":"Powiadamianie służb","kind":"skill","scope":"podstawowy","adrRef":"procedury krajowe","source":"kompendium","page":27,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["order","scenario"],"why":"Kolejność przekazywanych informacji: miejsce zdarzenia, rodzaj zdarzenia (wypadek, kolizja, wyciek), skutki zdarzenia, liczba ofiar, rozmiar zdarzenia (ile pojazdów, osób), numery UN przewożonego towaru, sposób jego przewozu (luzem, cysterna), ilość towaru niebezpiecznego, czy nastąpiło jego uwolnienie.","q":{"order":{"prompt":"Ulóz kolejność informacji przekazywanych służbom:","items":["Numery UN przewożonego towaru","Miejsce zdarzenia","Rodzaj zdarzenia","Liczba ofiar"],"correct":["Miejsce zdarzenia","Rodzaj zdarzenia","Liczba ofiar","Numery UN przewożonego towaru"]},"scenario":{"prompt":"Dzwonisz po służby. Od czego zaczynasz?","options":["Od numeru UN","Od miejsca zdarzenia","Od marki pojazdu"],"correct":"Od miejsca zdarzenia"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b5-kolejnosc-informacji@adr-2025"},{"id":"b5-kolejnosc","block":5,"topic":"Reakcja po wypadku","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.4.3.4","source":"kompendium","page":2,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["order","scenario"],"why":"Czynności wg instrukcji pisemnej: zahamować pojazd, wyłączyć silnik i odłączyć akumulator wyłącznikiem głównym; unikać źródeł zapłonu (nie palić, nie używać e-papierosów, nie włączać urządzeń elektrycznych); powiadomić służby ratownicze; założyć kamizelkę i ustawić stojące znaki ostrzegawcze; zapewnić ratownikom dostęp do dokumentów; nie wchodzić na uwolnione materiały, pozostawać po stronie nawietrznej.","q":{"order":{"prompt":"Ulóz kolejność działań po wypadku wg instrukcji pisemnej:","items":["Powiadomić służby ratownicze","Zahamować pojazd, wyłączyć silnik, odłączyć akumulator","Założyć kamizelkę i ustawić znaki ostrzegawcze"],"correct":["Zahamować pojazd, wyłączyć silnik, odłączyć akumulator","Powiadomić służby ratownicze","Założyć kamizelkę i ustawić znaki ostrzegawcze"]},"scenario":{"prompt":"Wyciek z cysterny. Z której strony się ustawiasz?","options":["Po stronie nawietrznej","Po stronie zawietrznej","Bez znaczenia"],"correct":"Po stronie nawietrznej"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b5-kolejnosc@adr-2025"},{"id":"b5-mocowanie-kontrola","block":5,"topic":"Mocowanie ładunku","kind":"skill","scope":"podstawowy","adrRef":"ADR 7.5.7","source":"kompendium","page":40,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario","mcq"],"why":"Kierowca odpowiada za sprawdzenie zamocowania ładunku przed jazdą i po każdej przerwie, na której mogło dojść do przemieszczenia. Luźny pas, uszkodzona burta lub przesunięta paleta to podstawa do przerwania jazdy i poprawy mocowania.","q":{"scenario":{"prompt":"Po przerwie zauważasz, że jeden pas mocujący się poluzował. Co robisz?","options":["Jadę dalej, poprawię na rozładunku","Poprawiam mocowanie przed dalszą jazdą","Zdejmuję pas, skoro luźny"],"correct":"Poprawiam mocowanie przed dalszą jazdą"},"mcq":{"prompt":"Kiedy kierowca powinien sprawdzić zamocowanie ładunku?","options":["Tylko przy załadunku","Przed jazdą i po przerwach, na których mogło się przesunąć","Tylko gdy zatrzyma go kontrola"],"correct":"Przed jazdą i po przerwach, na których mogło się przesunąć"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b5-mocowanie-kontrola"},{"id":"b5-mocowanie-sila","block":5,"topic":"Mocowanie ładunku","kind":"fact","scope":"podstawowy","adrRef":"ADR 7.5.7.1","source":"kompendium","page":40,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Ładunek musi być zamocowany tak, by przy gwałtownym hamowaniu nie przesunął się i nie zagroził stabilności pojazdu. Siły w transporcie: do przodu ok. 0,8 masy ładunku (hamowanie), do tyłu i na boki ok. 0,5 masy. Dlatego mocowanie z przodu musi być najmocniejsze.","q":{"mcq":{"prompt":"W którą stronę działa największa siła na ładunek podczas jazdy?","options":["Do przodu (hamowanie) — ok. 0,8 masy","Do tyłu — ok. 0,8 masy","Na boki — ok. 1,0 masy"],"correct":"Do przodu (hamowanie) — ok. 0,8 masy"},"scenario":{"prompt":"Wieziesz palety, które mogą się przesunąć przy ostrym hamowaniu. Gdzie mocowanie musi być najsilniejsze?","options":["Z tyłu ładunku","Z przodu ładunku (kierunek hamowania)","Po bokach"],"correct":"Z przodu ładunku (kierunek hamowania)"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b5-mocowanie-sila"},{"id":"b5-mocowanie","block":5,"topic":"Mocowanie ładunku","kind":"skill","scope":"podstawowy","adrRef":"ADR 7.5.7","source":"kompendium","page":27,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","match"],"why":"Do mocowania ładunku używamy atestowanych pasów, burt przesuwanych, przegród nastawnych, mat antypoślizgowych, konstrukcji pojazdu (punkty kotwiczenia) lub wypełnienia pustych przestrzeni. Siła działająca na ładunek zmniejsza się wraz ze wzrostem promienia zakrętu. Ładunek ciekły w przypadku piętrowania należy umieszczać jak najniżej. Ładunek można piętrować tylko jeśli konstrukcja opakowania na to pozwala. Kąt pasa maksymalnie 45 stopni.","q":{"mcq":{"prompt":"Ładunek ciekły przy piętrowaniu należy umieszczać:","options":["Jak najwyzej","Jak najniżej","Na srodku"],"correct":"Jak najniżej"},"match":{"prompt":"Dopasuj element mocowania:","pairs":{"Atestowane pasy":"mocowanie ładunku","Maty antyposlizgowe":"zwiekszenie tarcia","Wypelnienie pustych przestrzeni":"zapobiega przesuwaniu"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b5-mocowanie@adr-2025"},{"id":"b5-numery-alarmowe","block":5,"topic":"Powiadamianie służb","kind":"fact","scope":"podstawowy","adrRef":"procedury krajowe","source":"kompendium","page":27,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Powiadamianie na numer 112 lub 999, 998 lub 997. Należy przekazać wszystkie dostępne informacje.","q":{"mcq":{"prompt":"Numery alarmowe przy zdarzeniu z towarem niebezpiecznym:","options":["Tylko 112","112 lub 999, 998, 997","Tylko 998"],"correct":"112 lub 999, 998, 997"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b5-numery-alarmowe@adr-2025"},{"id":"b5-oznakowanie-miejsca","block":5,"topic":"Reakcja po wypadku","kind":"fact","scope":"podstawowy","adrRef":"ADR 8.1.5 / 5.4.3.4","source":"kompendium","page":2,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Założyć kamizelkę ostrzegawcza i odpowiednio umieścić stojące znaki ostrzegawcze (dwa). Zapewnić przybylym ratownikom łatwy dostęp do dokumentów przewozowych.","q":{"mcq":{"prompt":"Czym zabezpieczasz miejsce zdarzenia z wyposażenia ADR?","options":["Jednym znakiem","Dwoma stojącymi znakami ostrzegawczymi","Tylko światłami"],"correct":"Dwoma stojącymi znakami ostrzegawczymi"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b5-oznakowanie-miejsca@adr-2025"},{"id":"b5-pierwsza-pomoc-kontakt","block":5,"topic":"Pierwsza pomoc","kind":"fact","scope":"podstawowy","adrRef":"ADR 5.4.3 (instrukcje pisemne)","source":"adr-2025","page":null,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Przy kontakcie substancji ze skórą lub oczami: natychmiast płukać miejsce duża ilością letniej wody przez co najmniej 15-20 minut, zdejmując skażoną odzież. NIE stosować środków neutralizujących. DO WERYFIKACJI: treść medyczna, przegląd ratownik/instruktor.","q":{"mcq":{"prompt":"Co zrobić przy kontakcie substancji niebezpiecznej ze skórą lub oczami?","options":["Płukać duża ilością letniej wody min. 15-20 minut","Przetrzeć sucha szmatka","Posmarować kremem neutralizujacym"],"correct":"Płukać duża ilością letniej wody min. 15-20 minut"},"scenario":{"prompt":"Substancją żrąca prysnęła kierowcy do oka. Pierwsza czynność?","options":["Natychmiast płukać oko letnią wodą, szeroko otwierając powiekę","Zamknąć oko i czekać na pogotowie","Przetrzeć oko i zneutralizować substancja zasadowa"],"correct":"Natychmiast płukać oko letnią wodą, szeroko otwierając powiekę"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b5-pierwsza-pomoc-kontakt"},{"id":"b5-pierwsza-pomoc-numer","block":5,"topic":"Pierwsza pomoc","kind":"fact","scope":"podstawowy","adrRef":"ADR 5.4.3","source":"kompendium","page":38,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","fill"],"why":"Numer alarmowy w całej Unii Europejskiej to 112. Zgłaszając wypadek z towarem niebezpiecznym, podaj: miejsce, numer UN i nalepki z tablicy, rodzaj zdarzenia, liczbę poszkodowanych. Instrukcje pisemne (te w kabinie) opisują pierwsze czynności dla każdej klasy zagrożenia.","q":{"mcq":{"prompt":"Jaki jest numer alarmowy w Unii Europejskiej?","options":["997","112","999"],"correct":"112"},"fill":{"prompt":"Wspólny numer alarmowy w UE to ___.","correct":"112","hint":"trzy cyfry"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b5-pierwsza-pomoc-numer"},{"id":"b5-pierwsza-pomoc-wdychanie","block":5,"topic":"Pierwsza pomoc","kind":"fact","scope":"podstawowy","adrRef":"ADR 5.4.3 (instrukcje pisemne)","source":"kompendium","page":38,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Przy wdychaniu par lub gazów: wyprowadzić poszkodowanego na świeże powietrze, na strefę nawietrzną (wiatr od pleców), zapewnić spokój i ciepło, wezwać pomoc. Nie wolno samemu wchodzić w strefę skażoną bez ochrony — ryzyko, że ratownik też straci przytomność. DO WERYFIKACJI: treść medyczna.","q":{"mcq":{"prompt":"Poszkodowany nawdychał się par substancji. Pierwsza czynność?","options":["Podać mu wodę do picia","Wyprowadzić na świeże powietrze, strefę nawietrzną","Położyć na wznak w kabinie"],"correct":"Wyprowadzić na świeże powietrze, strefę nawietrzną"},"scenario":{"prompt":"Widzisz osobę nieprzytomną w chmurze gazu. Co robisz najpierw?","options":["Wbiegam i wyciągam ją natychmiast","Nie wchodzę bez ochrony, wzywam służby i zabezpieczam teren","Czekam aż gaz się rozproszy"],"correct":"Nie wchodzę bez ochrony, wzywam służby i zabezpieczam teren"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b5-pierwsza-pomoc-wdychanie"},{"id":"b5-pierwsza-pomoc","block":5,"topic":"Reakcja po wypadku","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.4.3.4","source":"kompendium","page":2,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Zdjąć zanieczyszczone ubranie i użyte zanieczyszczone wyposażenie ochronne oraz usunąć je w sposób bezpieczny. Unikać wdychania oparów, dymu, pyłu i pary poprzez pozostawanie po stronie nawietrznej. Nie wchodzić na uwolnione materiały i nie dotykać ich.","q":{"mcq":{"prompt":"Co zrobić z zanieczyszczonym ubraniem po kontakcie z materiałem?","options":["Wyprać","Zdjąć i usunąć w sposób bezpieczny","Zostawić na sobie"],"correct":"Zdjąć i usunąć w sposób bezpieczny"},"scenario":{"prompt":"Uwolniony materiał na jezdni. Twoje zachowanie:","options":["Sprawdzam co to, dotykając","Nie wchodzę, nie dotykam, pozostaje po stronie nawietrznej","Rozgarniam łopata"],"correct":"Nie wchodzę, nie dotykam, pozostaje po stronie nawietrznej"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b5-pierwsza-pomoc@adr-2025"},{"id":"b5-wiele-zagrozen","block":5,"topic":"Wskazówki per klasa","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.4.3.4 uwaga 1","source":"kompendium","page":3,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"UWAGA 1 z instrukcji pisemnej: w przypadku towarów niebezpiecznych stwarzających więcej niż jedno zagrożenie oraz ładunków mieszanych, stosuje się KAŻDA z określonych dla nich wskazówek.","q":{"mcq":{"prompt":"Towar stwarza więcej niż jedno zagrożenie. Które wskazówki stosujesz?","options":["Tylko dla zagrożenia dominującego","KAŻDA z określonych wskazówek","Żadnych"],"correct":"KAŻDA z określonych wskazówek"},"scenario":{"prompt":"Ładunek mieszany: klasa 3 i klasa 6.1. Jakie wskazówki stosujesz?","options":["Tylko dla klasy 3","Obie — dla klasy 3 i 6.1","Wybieram jedna"],"correct":"Obie — dla klasy 3 i 6.1"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b5-wiele-zagrozen@adr-2025"},{"id":"b5-wskazowki-klasy","block":5,"topic":"Wskazówki per klasa","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.4.3.4 tabela","source":"kompendium","page":3,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match"],"why":"Wskazówki dodatkowe z instrukcji pisemnej: klasa 1 — schronić się i pozostać z dala od okien; 2.1/2.2/2.3 — schronić się, unikać zagłębień terenu; 5.1/5.2 — nie dopuszczać do zmieszania z materiałami zapalnymi lub palnymi (np. trocinami); 6.1 — użyć maski ucieczkowej; 7 — ograniczyć czas narażenia; 4.3 — uwolniony materiał utrzymywać w stanie suchym, pod przykryciem.","q":{"match":{"prompt":"Dopasuj klasę do wskazówki z instrukcji pisemnej:","pairs":{"Klasa 1":"schronić się, z dala od okien","Klasa 5.1":"nie mieszać z materiałami palnymi","Klasa 6.1":"użyć maski ucieczkowej","Klasa 7":"ograniczyć czas narażenia"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b5-wskazowki-klasy@adr-2025"},{"id":"b5-zajecia-praktyczne-info","block":5,"topic":"Reakcja po wypadku","kind":"ref","scope":"podstawowy","adrRef":"program kursu (Dz.U. 2021 poz. 2150)","source":"curriculum","page":null,"edition":"ADR 2025","status":"info","verifiedBy":"domo","formats":["mcq"],"why":"INFO: zajęcia praktyczne z pierwszej pomocy i gaszenia pożaru są obowiązkowa częścią kursu stacjonarnego ADR. Trening w aplikacji utrwala wiedzę, realny skill ćwiczy się na kursie z instruktorem.","q":{"mcq":{"prompt":"Gdzie ćwiczy się praktycznie gaszenie pożaru i pierwsza pomoc w ramach ADR?","options":["Na zajęciach praktycznych kursu stacjonarnego z instruktorem","Wyłącznie w aplikacji","Nie ma zajęć praktycznych w kursie ADR"],"correct":"Na zajęciach praktycznych kursu stacjonarnego z instruktorem"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b5-zajecia-praktyczne-info"},{"id":"b5-zrodla-zaplonu","block":5,"topic":"Reakcja po wypadku","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.4.3.4","source":"kompendium","page":2,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Unikać źródeł zapłonu, w szczególności nie palić, nie używać papierosów elektronicznych lub podobnych urządzeń oraz nie włączać żadnych urządzeń elektrycznych.","q":{"mcq":{"prompt":"Po wypadku z towarem niebezpiecznym NIE wolno:","options":["Zakładać kamizelki","Włączać urządzeń elektrycznych i używać e-papierosów","Powiadamiac służb"],"correct":"Włączać urządzeń elektrycznych i używać e-papierosów"},"scenario":{"prompt":"Wyciek benzyny. Chcesz oświetlić miejsce telefonem. Czy można?","options":["Tak","Nie — nie włączamy urządzeń elektrycznych","Tylko latarka z wyposażenia"],"correct":"Nie — nie włączamy urządzeń elektrycznych"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b5-zrodla-zaplonu@adr-2025"},{"id":"s-1132-oblicz-energia","block":1,"topic":"Wyłączenia w praktyce","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1.3.2","source":"kompendium","page":9,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["fill","scenario"],"why":"Limit 54 000 MJ to nie liczba do wykucia — to wynik mnożenia. Wartość energetyczna = litry paliwa razy wartość energetyczna tego paliwa (kol. z uwagi 1: olej napędowy 36 MJ/l, benzyna 32 MJ/l, LPG 24 MJ/l). Przykład graniczny: 1500 l oleju napędowego x 36 MJ/l = 54 000 MJ — dokładnie na limicie. Żeby sprawdzić, czy przewóz gazu/paliwa w zbiornikach przewożonych pojazdów mieści się w wyłączeniu dla gazów, liczysz iloczyn i porównujesz z 54 000 MJ.","q":{"fill":{"prompt":"Przewozisz pojazd ze zbiornikiem 1000 l oleju napędowego (36 MJ/l). Ile MJ wartości energetycznej? (litry x MJ/l)","correct":"36000","hint":"litry x MJ/l"},"scenario":{"prompt":"Zbiornik 1500 l oleju napędowego (36 MJ/l). Ile to MJ i czy mieści się w wyłączeniu dla gazów (limit 54 000 MJ)?","options":["54 000 MJ — dokładnie na limicie, mieści się","54 000 MJ — przekroczone, pelne ADR","36 000 MJ — z zapasem"],"correct":"54 000 MJ — dokładnie na limicie, mieści się"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-1132-oblicz-energia@adr-2025"},{"id":"s-1136-co-zostaje","block":1,"topic":"Wyliczenie 1000 punktów","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1.3.6","source":"kompendium","page":10,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","scenario"],"why":"Wyłączenie 1.1.3.6 nie zwalnia ze wszystkiego. ZOSTAJE: certyfikowane i oznakowane opakowania, gaśnica 2 kg ABC z data przeglądu, dokument przewozowy, szkolenie stanowiskowe. ODPADA: tablice pomarańczowe, zaświadczenie ADR, instrukcja pisemną, skrzynka ADR, znaki drogowe ADR, DGSA, zakaz pasażerów.","q":{"match":{"prompt":"Przewóz na zwolnieniu „1000 punktów” — co zostaje, a co odpada?","pairs":{"Gaśnica 2 kg ABC":"zostaje","Dokument przewozowy":"zostaje","Tablice pomarańczowe":"odpada","Zaświadczenie ADR":"odpada"}},"scenario":{"prompt":"Jedziesz na zwolnieniu „1000 punktów”. Kontrola pyta o instrukcję pisemną. Musisz ją mieć?","options":["Tak, zawsze","Nie — instrukcja odpada przy zwolnieniu „1000 punktów”","Tylko przy klasie 3"],"correct":"Nie — instrukcja odpada przy zwolnieniu „1000 punktów”"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-1136-co-zostaje@adr-2025"},{"id":"s-1136-gdzie-kategoria","block":1,"topic":"Wyliczenie 1000 punktów","kind":"skill","scope":"podstawowy","adrRef":"ADR kol. 15 Tabeli A","source":"kompendium","page":10,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Żeby policzyć punkty, najpierw musisz znać kategorię transportową towaru. Sprawdzasz ją w tabeli A, w kolumnie 15 (ta sama kolumna zawiera kod tunelowy w nawiasie).","q":{"scenario":{"prompt":"Chcesz policzyć punkty do zwolnienia „1000 punktów”. Skąd bierzesz kategorię transportową towaru?","options":["Z dokumentu przewozowego","Z tabeli A, kolumna 15","Z instrukcji pisemnej"],"correct":"Z tabeli A, kolumna 15"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-1136-gdzie-kategoria@adr-2025"},{"id":"s-1136-kat0-blokada","block":1,"topic":"Wyliczenie 1000 punktów","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1.3.6.3","source":"kompendium","page":11,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Kategoria 0 ma limit 0 — każda ilość oznacza pełny ADR. Nie ma znaczenia, ze suma punktów z pozostałych towarów jest niska. Kategoria 0 blokuje wyłączenie całkowicie.","q":{"scenario":{"prompt":"Ładunek: 5 kg towaru kategorii 0 + 50 l kategorii 3 (razem 50 punktów). Czy przysługuje wyłączenie „1000 punktów”?","options":["Tak, 50 punktów to mało","Nie — kategoria 0 zawsze oznacza pełny ADR","Tak, jeśli kategoria 0 nie przekracza 20 kg"],"correct":"Nie — kategoria 0 zawsze oznacza pełny ADR"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-1136-kat0-blokada@adr-2025"},{"id":"s-1136-kat1-wyjatek-oblicz","block":1,"topic":"Wyliczenie 1000 punktów","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1.3.6.3","source":"kompendium","page":11,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["fill","scenario"],"why":"UN 1017 (chlor) należy do wyjątku kategorii 1: limit 50 kg, mnożnik x20 zamiast x50. 20 kg x 20 = 400 punktów.","q":{"fill":{"prompt":"Wieziesz 20 kg UN 1017 (wyjątek kategorii 1, mnożnik x20). Ile punktów?","correct":"400","hint":"ilość x mnożnik wyjątku"},"scenario":{"prompt":"UN 1005 i UN 1017 w kategorii 1 mają mnożnik:","options":["x50 jak cała kategoria 1","x20 — wyjątek","x3"],"correct":"x20 — wyjątek"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-1136-kat1-wyjatek-oblicz@adr-2025"},{"id":"s-1136-kat4-zero","block":1,"topic":"Wyliczenie 1000 punktów","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1.3.6.3","source":"kompendium","page":11,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["fill","scenario"],"why":"Kategoria 4 ma mnożnik 0 — nie dolicza się do sumy niezależnie od ilości. 500 kg kąt. 4 = 0 punktów. Liczy się tylko 100 l kąt. 3 = 100 punktów.","q":{"fill":{"prompt":"Ładunek: 500 kg kategorii 4 + 100 l kategorii 3. Ile punktów?","correct":"100","hint":"uwaga na mnożnik kąt. 4"},"scenario":{"prompt":"Wieziesz 2 tony towaru kategorii 4. Ile to punktów?","options":["2000","0 — kategoria 4 ma mnożnik zero","666"],"correct":"0 — kategoria 4 ma mnożnik zero"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-1136-kat4-zero@adr-2025"},{"id":"s-1136-mnozniki-tabela","block":1,"topic":"Wyliczenie 1000 punktów","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1.3.6.4","source":"kompendium","page":11,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match"],"why":"Podstawa liczenia punktów: ilość x mnożnik kategorii. Kąt. 1 = x50, kąt. 2 = x3, kąt. 3 = x1, kąt. 4 = x0. Suma nie może przekroczyć 1000.","q":{"match":{"prompt":"Dopasuj kategorię transportową do mnożnika:","pairs":{"Kategoria 1":"x50","Kategoria 2":"x3","Kategoria 3":"x1","Kategoria 4":"x0"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-1136-mnozniki-tabela@adr-2025"},{"id":"s-1136-oblicz-1","block":1,"topic":"Wyliczenie 1000 punktów","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1.3.6","source":"kompendium","page":11,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["fill"],"why":"Kategoria 2 ma mnożnik x3. 100 l x 3 = 300 punktów. Wynik poniżej 1000 — wyłączenie przysługuje.","q":{"fill":{"prompt":"Wieziesz 100 l towaru kategorii transportowej 2. Ile punktów?","correct":"300","hint":"ilość x mnożnik"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-1136-oblicz-1@adr-2025"},{"id":"s-1136-oblicz-2","block":1,"topic":"Wyliczenie 1000 punktów","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1.3.6","source":"kompendium","page":11,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["fill"],"why":"Sumujemy iloczyny: 50 l kąt. 2 = 50 x 3 = 150. 200 kg kąt. 3 = 200 x 1 = 200. Razem 350 punktów. Wyłączenie przysługuje.","q":{"fill":{"prompt":"Ładunek: 50 l kategorii 2 + 200 kg kategorii 3. Ile punktów łącznie?","correct":"350","hint":"zsumuj iloczyny"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-1136-oblicz-2@adr-2025"},{"id":"s-1136-oblicz-3","block":1,"topic":"Wyliczenie 1000 punktów","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1.3.6","source":"kompendium","page":11,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["fill","scenario"],"why":"300 l kąt. 2 = 300 x 3 = 900 punktów. Dołożenie 200 kg kąt. 3 (x1 = 200) daje 1100 — przekroczenie 1000. Wyłączenie nie przysługuje, jedziesz na pełnym ADR.","q":{"fill":{"prompt":"Ładunek: 300 l kategorii 2 + 200 kg kategorii 3. Ile punktów?","correct":"1100","hint":"liczba"},"scenario":{"prompt":"Wyszło 1100 punktów. Co to oznacza?","options":["Zwolnienie „1000 punktów” przysługuje","Przekroczone 1000 — pełny ADR","Trzeba podzielić ładunek na dwa kursy"],"correct":"Przekroczone 1000 — pełny ADR"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-1136-oblicz-3@adr-2025"},{"id":"s-2025-baterie-sodowe","block":2,"topic":"Zmiany ADR 2025","kind":"skill","scope":"podstawowy","adrRef":"ADR 2025 UN 3551/3552","source":"research","page":null,"edition":"ADR 2025","status":"ext-2025","verifiedBy":"domo","formats":["match","scenario"],"why":"ZMIANA ADR 2025: wprowadzono baterie sodowo-jonowe — UN 3551 (z elektrolitem organicznym) i UN 3552 (zapakowane z urządzeniem lub w urządzeniu). Kod klasyfikacyjny M4 obejmuje teraz baterie litowe i sodowo-jonowe. Kompendium ADR 2023 tego nie zawiera.","q":{"match":{"prompt":"Dopasuj numer UN (ADR 2025):","pairs":{"UN 3551":"baterie sodowo-jonowe z elektrolitem organicznym","UN 3552":"baterie sodowo-jonowe w urządzeniu lub z urządzeniem"}},"scenario":{"prompt":"Wieziesz baterie sodowo-jonowe. Która klasa i numer UN (ADR 2025)?","options":["Klasa 9, UN 3480 jak litowe","Klasa 9, UN 3551","Nie podlega ADR"],"correct":"Klasa 9, UN 3551"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-2025-baterie-sodowe"},{"id":"s-2025-dokument-kabina","block":4,"topic":"Zmiany ADR 2025","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.4.1 (2025)","source":"research","page":null,"edition":"ADR 2025","status":"ext-2025","verifiedBy":"domo","formats":["scenario"],"why":"ZMIANA ADR 2025: od 1 lipca 2025 dokumenty przewozowe muszą znajdować się w kabinie kierowcy. Wcześniej dopuszczalne było inne umiejscowienie. Kompendium ADR 2023 tego nie zawiera.","q":{"scenario":{"prompt":"Kontrola pyta o dokument przewozowy. Został w biurze przewoźnika. Zgodnie z ADR 2025:","options":["To dopuszczalne, wystarczy przesłać skan","Naruszenie — od lipca 2025 dokument musi być w kabinie","Zależy od klasy towaru"],"correct":"Naruszenie — od lipca 2025 dokument musi być w kabinie"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-2025-dokument-kabina"},{"id":"s-2025-lq-szkolenie","block":1,"topic":"Zmiany ADR 2025","kind":"skill","scope":"podstawowy","adrRef":"ADR 8.2.3 (2025)","source":"research","page":null,"edition":"ADR 2025","status":"ext-2025","verifiedBy":"domo","formats":["scenario"],"why":"ZMIANA ADR 2025: doprecyzowano wymóg szkolenia załogi przewożącej towary w ilościach ograniczonych (LQ). Mimo złagodzenia przepisów dla LQ, szkolenie stanowiskowe pozostaje wymagane i powinno być udokumentowane. Kompendium ADR 2023 tego nie precyzuje.","q":{"scenario":{"prompt":"Wieziesz towary w ilościach ograniczonych (LQ). Czy potrzebujesz szkolenia?","options":["Nie, LQ jest całkowicie zwolnione","Tak — szkolenie stanowiskowe, wymóg doprecyzowany w ADR 2025","Tak, pełny kurs ADR"],"correct":"Tak — szkolenie stanowiskowe, wymóg doprecyzowany w ADR 2025"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-2025-lq-szkolenie"},{"id":"s-2025-pojazdy-baterie","block":2,"topic":"Zmiany ADR 2025","kind":"skill","scope":"podstawowy","adrRef":"ADR 2025 UN 3556-3558","source":"research","page":null,"edition":"ADR 2025","status":"ext-2025","verifiedBy":"domo","formats":["match"],"why":"ZMIANA ADR 2025: wprowadzono osobne numery dla pojazdów napędzanych bateriami — UN 3556 (litowo-jonowa), UN 3557 (litowo-metalowa), UN 3558 (sodowo-jonowa). Stosuje się nową instrukcję pakowania P912. Kompendium ADR 2023 tego nie zawiera.","q":{"match":{"prompt":"Dopasuj numer UN do pojazdu (ADR 2025):","pairs":{"UN 3556":"pojazd z bateria litowo-jonowa","UN 3557":"pojazd z bateria litowo-metalowa","UN 3558":"pojazd z bateria sodowo-jonowa"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-2025-pojazdy-baterie"},{"id":"s-butle-po-gazach","block":1,"topic":"Wyłączenia w praktyce","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1.3.6.3","source":"kompendium","page":11,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Wszystkie butle po gazach należą do kategorii transportowej 4 — mnożnik 0, bez ograniczeń ilościowych. Może je przewozić kierowca bez zaświadczenia ADR. Uwaga: butle pozostają oznakowane jak w stanie ładownym.","q":{"scenario":{"prompt":"Wieziesz 30 pustych butli po propanie. Potrzebujesz zaświadczenia ADR?","options":["Tak, powyżej 20 butli","Nie — wszystkie butle po gazach to kategoria 4, bez ograniczeń","Tylko jeśli są nieoczyszczone"],"correct":"Nie — wszystkie butle po gazach to kategoria 4, bez ograniczeń"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-butle-po-gazach@adr-2025"},{"id":"s-co-nie-podlega-adr","block":2,"topic":"Klasy zagrożeń","kind":"skill","scope":"podstawowy","adrRef":"ADR 3.3 SP 188","source":"kompendium","page":4,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","scenario"],"why":"Nie podlegają ADR: akumulatory i ogniwa litowe zawarte w urządzeniach wg przepisu 188, pojazdy poddane fumigacji, czynniki chłodzące jak UN 1845 suchy lód. Uwaga: mimo ze nie podlegają ADR, nadal stwarzają zagrożenie — fumigacja i suchy lód grozą uduszeniem.","q":{"match":{"prompt":"Dopasuj status:","pairs":{"Baterie litowe w urządzeniu (przepis 188)":"nie podlega ADR","Suchy lód UN 1845":"nie podlega ADR","Jednostka po fumigacji":"nie podlega ADR"}},"scenario":{"prompt":"Wieziesz suchy lód jako czynnik chłodzący. Nie podlega ADR — czy zagrożenie znika?","options":["Tak, brak ADR = brak zagrożenia","Nie — nadal grozi uduszeniem, wymaga przewietrzania","Tylko powyżej 100 kg"],"correct":"Nie — nadal grozi uduszeniem, wymaga przewietrzania"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-co-nie-podlega-adr@adr-2025"},{"id":"s-cv28-zywnosc-decyzja","block":4,"topic":"Decyzja o załadunku","kind":"skill","scope":"podstawowy","adrRef":"ADR 7.5.4 / CV28","source":"kompendium","page":24,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario","match"],"why":"Gdy w kolumnie 18 tabeli A jest przepis CV28, towar trzeba oddzielić od żywności i karmy. Sposoby: ciągle przegrody, sztuki bez nalepek 6.1/6.2/9 jako bufor, wolna przestrzeń min. 0,8 m, albo całkowite przykrycie (plandeka, pokrywa).","q":{"scenario":{"prompt":"Wieziesz towar z przepisem CV28 i artykuły spozywcze. Nie masz przegrody. Co robisz?","options":["Ładuje razem, CV28 to zalecenie","Zostawiam min. 0,8 m wolnej przestrzeni albo przykrywam całkowicie","Odmawiam przewozu"],"correct":"Zostawiam min. 0,8 m wolnej przestrzeni albo przykrywam całkowicie"},"match":{"prompt":"Sposoby oddzielenia od żywności (CV28):","pairs":{"Wolna przestrzeń":"min. 0,8 m","Ciągle przegrody":"wysokość jak sztuki przesyłek","Przykrycie":"plandeka lub pokrywa"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-cv28-zywnosc-decyzja@adr-2025"},{"id":"s-cysterna-wielokomorowa-decyzja","block":4,"topic":"Oznakowanie pojazdu w praktyce","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.3.2.1.3","source":"kompendium","page":21,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Dla UN 1202, 1203, 1223, 1268 i 1863 można oznakować cysternę wielokomorowa tak, jakby wiozła jeden produkt — ten najniebezpieczniejszy z przewożonych. Benzyna (UN 1203, numer 33) jest niebezpieczniejsza niż olej napędowy (UN 1202, numer 30).","q":{"scenario":{"prompt":"Cysterna wielokomorowa: olej napędowy (UN 1202) i benzyna (UN 1203). Jaka tablica?","options":["Dwie różne tablice na komorach","33/1203 — najniebezpieczniejszy z przewożonych","30/1202"],"correct":"33/1203 — najniebezpieczniejszy z przewożonych"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-cysterna-wielokomorowa-decyzja@adr-2025"},{"id":"s-data-opakowania","block":2,"topic":"Odczyt opakowania","kind":"skill","scope":"podstawowy","adrRef":"ADR 4.1.1.15","source":"kompendium","page":7,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Data produkcji na opakowaniu zapisana jest jako miesiąc i rok, np. 07 21 = lipiec 2021. Opakowanie można używać 5 lat od daty produkcji, czyli do lipca 2026. Po 2,5 roku (styczen 2024) powinno być przeprowadzone badanie.","q":{"scenario":{"prompt":"Na DPPL widzisz oznaczenie 07 21. Do kiedy możesz go używać?","options":["Do lipca 2023","Do lipca 2026 (5 lat od produkcji)","Bezterminowo"],"correct":"Do lipca 2026 (5 lat od produkcji)"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-data-opakowania@adr-2025"},{"id":"s-dgsa-czy-potrzebny","block":1,"topic":"Podstawy prawne","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.8.3","source":"kompendium","page":1,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Doradcę DGSA powinna wyznaczyć KAŻDA firma pakująca, ładująca, transportująca lub rozładowująca towary niebezpieczne — nie tylko przewoźnicy. Kara za niewyznaczenie: 5000 PLN. DGSA sprawdza szkolenia, sporządza sprawozdanie roczne i raport powypadkowy.","q":{"scenario":{"prompt":"Jednoosobowa firma transportową, wozisz tylko paliwo w cysternie. Potrzebujesz DGSA?","options":["Nie, to za mała firma","Tak — każda firma transportująca towary niebezpieczne musi wyznaczyć doradcę","Tylko jeśli zatrudniasz kierowców"],"correct":"Tak — każda firma transportująca towary niebezpieczne musi wyznaczyć doradcę"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-dgsa-czy-potrzebny@adr-2025"},{"id":"s-dokument-1136-punkty","block":4,"topic":"Praca z dokumentem","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.4.1.1.10","source":"kompendium","page":12,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Przy zastosowaniu zwolnienia 1.1.3.6 należy w dokumencie umieścić zapis o całkowitej ilości towaru dla kategorii transportowej oraz o \"punktach\" (wartości obliczonej), np. kategoria transportową 2 — 100 l — 300 punktów.","q":{"scenario":{"prompt":"Jedziesz na zwolnieniu „1000 punktów”. Co dodatkowo musi być w dokumencie?","options":["Nic dodatkowego","Całkowita ilość dla kategorii transportowej i wartość obliczona (punkty)","Numer zaświadczenia ADR"],"correct":"Całkowita ilość dla kategorii transportowej i wartość obliczona (punkty)"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-dokument-1136-punkty@adr-2025"},{"id":"s-dokument-odczyt","block":4,"topic":"Praca z dokumentem","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.4.1","source":"kompendium","page":12,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Nawet nie znając języka dokumentu, kierowca odczyta właściwości towaru po numerze nalepki i grupie pakowania. UN 1580 CHLOROPIKRYNA 6.1 GP I: 6.1 = trujący, GP I = silnie (największe zagrożenie).","q":{"scenario":{"prompt":"W dokumencie: UN 1580 CHLOROPIKRYNA 6.1 GP I. Co to mówi bez znajomości języka?","options":["Materiał zapalny, małe zagrożenie","Materiał trujący, silnie — I grupa pakowania","Gaz duszący"],"correct":"Materiał trujący, silnie — I grupa pakowania"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-dokument-odczyt@adr-2025"},{"id":"s-dokument-odpad-zapis","block":4,"topic":"Praca z dokumentem","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.4.1.1.3","source":"kompendium","page":12,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Słowo ODPAD umieszcza się PO numerze UN, przed nazwa: UN 1230 odpad metanol 3 (6.1) II, (D/E).","q":{"scenario":{"prompt":"Który zapis odpadu w dokumencie jest prawidłowy?","options":["odpad UN 1230 metanol 3 (6.1) II, (D/E)","UN
