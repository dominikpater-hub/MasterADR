1230 odpad metanol 3 (6.1) II, (D/E)","UN 1230 metanol odpad 3 (6.1) II, (D/E)"],"correct":"UN 1230 odpad metanol 3 (6.1) II, (D/E)"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-dokument-odpad-zapis@adr-2025"},{"id":"s-dokument-prozny","block":4,"topic":"Praca z dokumentem","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.4.1.1.6","source":"kompendium","page":12,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Zapis dla próżnych opakowań powinien zawierać nazwę opakowania oraz numery nalepek znajdujących się na opakowaniu, np. \"próżny DPPL, 8\".","q":{"scenario":{"prompt":"Wieziesz próżny, nieoczyszczony DPPL po kwasie (nalepka 8). Jak zapisać w dokumencie?","options":["DPPL pusty","próżny DPPL, 8","UN 0000 puste opakowanie"],"correct":"próżny DPPL, 8"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-dokument-prozny@adr-2025"},{"id":"s-gasic-czy-nie","block":5,"topic":"Reakcja po wypadku","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.4.3.4","source":"kompendium","page":27,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","scenario"],"why":"Kierowca gasi TYLKO mały lub początkowy pożar obejmujący opony, hamulce lub przedział silnika — i tylko jeśli to bezpieczne. Pożaru przedziału ładunkowego NIE gasi. Nie gasimy ładunku.","q":{"match":{"prompt":"Gasić czy nie?","pairs":{"Początkowy pożar opony":"gasić jeśli bezpiecznie","Pożar przedziału ładunkowego":"NIE gasić","Pożar silnika w fazie początkowej":"gasić jeśli bezpiecznie"}},"scenario":{"prompt":"Pali się naczepa z ładunkiem ADR. Masz 2 gaśnice po 6 kg. Co robisz?","options":["Próbuje gasić — mam 12 kg","Oddalam się i wzywam straż — nie gasimy ładunku","Otwieram naczepe żeby sprawdzić"],"correct":"Oddalam się i wzywam straż — nie gasimy ładunku"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-gasic-czy-nie@adr-2025"},{"id":"s-gasnica-technika","block":5,"topic":"Reakcja po wypadku","kind":"skill","scope":"podstawowy","adrRef":"praktyka gaszenia","source":"kompendium","page":27,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario","match"],"why":"Strumień proszku kierujemy w źródło płomieni, stojąc od strony nawietrznej. Gaśnica 6 kg wystarcza na ok. 10 sekund, 2 kg na ok. 6 sekund. Zasięg około 4 m. Masz jedna próbę — celuj w źródło, nie w płomień.","q":{"scenario":{"prompt":"Gasisz początkowy pożar opony gaśnica 6 kg. Ile masz czasu?","options":["Około 30 sekund","Około 10 sekund","Około 2 minut"],"correct":"Około 10 sekund"},"match":{"prompt":"Parametry gaśnic:","pairs":{"Gaśnica 6 kg":"ok. 10 s","Gaśnica 2 kg":"ok. 6 s","Zasięg strumienia":"ok. 4 m"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-gasnica-technika@adr-2025"},{"id":"s-gasnice-1136","block":4,"topic":"Dobór gaśnic","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1.3.6 / 8.1.4","source":"kompendium","page":16,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Pojazd na wyłączeniu 1.1.3.6 musi mieć 1 gaśnice 2 kg typu ABC. Wyłączenie zwalnia z pełnego wyposażenia, ale NIE z gaśnicy.","q":{"scenario":{"prompt":"Jedziesz na zwolnieniu „1000 punktów” zestawem 20 t. Ile gaśnic?","options":["Dwie, łącznie 12 kg jak przy pełnym ADR","Jedna 2 kg ABC","Żadna — wyłączenie zwalnia"],"correct":"Jedna 2 kg ABC"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-gasnice-1136@adr-2025"},{"id":"s-gasnice-3t","block":4,"topic":"Dobór gaśnic","kind":"skill","scope":"podstawowy","adrRef":"ADR 8.1.4","source":"kompendium","page":16,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Bus 3 t = do 3,5 t. Wymagane: 2 gaśnice, łączna pojemność 4 kg — czyli 2 kg do silnika/kabiny + 2 kg dodatkowa.","q":{"scenario":{"prompt":"Bus 3 t z towarem ADR. Jakie gaśnice?","options":["Jedna 4 kg","Dwie gaśnice, łącznie 4 kg (2 kg + 2 kg)","Dwie po 6 kg"],"correct":"Dwie gaśnice, łącznie 4 kg (2 kg + 2 kg)"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-gasnice-3t@adr-2025"},{"id":"s-gasnice-40t","block":4,"topic":"Dobór gaśnic","kind":"skill","scope":"podstawowy","adrRef":"ADR 8.1.4","source":"kompendium","page":16,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario","fill"],"why":"Zestaw 40 t = powyżej 7,5 t. Wymagane: minimum 2 gaśnice, łączna pojemność 12 kg, w tym co najmniej jedna 2 kg do silnika/kabiny i co najmniej jedna dodatkowa 6 kg. Typ ABC.","q":{"scenario":{"prompt":"Zestaw 40 t. Masz jedna gaśnice 12 kg. Czy spełniasz wymóg?","options":["Tak, pojemność się zgadza","Nie — muszą być minimum 2 gaśnice","Tak, jeśli ma aktualny przegląd"],"correct":"Nie — muszą być minimum 2 gaśnice"},"fill":{"prompt":"Zestaw 40 t: minimalna łączna pojemność gaśnic to ___ kg.","correct":"12","hint":"liczba"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-gasnice-40t@adr-2025"},{"id":"s-gasnice-s3-6-2","block":4,"topic":"Dobór gaśnic","kind":"skill","scope":"podstawowy","adrRef":"ADR przepis S3","source":"kompendium","page":16,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Przepis S3: dla klasy 6.2 (zakaźne) niezależnie od DMC pojazdu wystarczy gaśnica 2 kg typu ABC, a latarka może być dowolnej konstrukcji. To wyjątek od tabeli mas.","q":{"scenario":{"prompt":"Zestaw 24 t z odpadami medycznymi (klasa 6.2). Ile gaśnicy wg przepisu S3?","options":["12 kg jak dla każdego zestawu powyżej 7,5 t","Wystarczy 2 kg ABC — wyjątek S3","8 kg"],"correct":"Wystarczy 2 kg ABC — wyjątek S3"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-gasnice-s3-6-2@adr-2025"},{"id":"s-gdzie-sprawdzic","block":1,"topic":"Podstawy prawne","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1 / zrodla","source":"kompendium","page":1,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","scenario"],"why":"Kierowca nie musi pamiętać wszystkiego — musi wiedzieć, gdzie sprawdzić. Wykaz krajów ADR, dodatkowe wymagania krajowe i wykaz tuneli: masteradr.pl/kraje. Tabela A, instrukcje pisemne i formularz multimodalny do pobrania: doradca-adr.com/dokumenty-do-pobrania. Wątpliwości w firmie rozstrzyga doradca DGSA.","q":{"match":{"prompt":"Gdzie sprawdzasz? Dopasuj źródło:","pairs":{"Wymagania krajowe i wykaz tuneli":"masteradr.pl/kraje","Tabela A i instrukcje pisemne":"doradca-adr.com/dokumenty-do-pobrania","Watpliwosc w firmie":"doradca DGSA"}},"scenario":{"prompt":"Jedziesz do Austrii pierwszy raz. Skąd sprawdzisz dodatkowe wymagania tego kraju?","options":["Z instrukcji pisemnej","Z wykazu krajów ADR (masteradr.pl/kraje)","Z tablicy pomarańczowej"],"correct":"Z wykazu krajów ADR (masteradr.pl/kraje)"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-gdzie-sprawdzic@adr-2025"},{"id":"s-grupa-pakowania-ktore-klasy","block":2,"topic":"Klasyfikacja","kind":"skill","scope":"podstawowy","adrRef":"ADR 2.1.1.3","source":"kompendium","page":2,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Grup pakowania NIE MAJĄ klasy 1, 2, 5.2, 6.2, 7 oraz przedmioty. Jeśli w dokumencie przy klasie 2 widzisz grupę pakowania — to błąd. Grupa pakowania określa natężenie zagrożenia dominującego: I duże, II średnie, III małe.","q":{"scenario":{"prompt":"W dokumencie: UN 1978 PROPAN 2.1 GP II. Co jest nie tak?","options":["Nic, zapis prawidłowy","Klasa 2 nie ma grup pakowania — GP II nie powinno tam być","Propan to klasa 3"],"correct":"Klasa 2 nie ma grup pakowania — GP II nie powinno tam być"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-grupa-pakowania-ktore-klasy@adr-2025"},{"id":"s-grupa-pakowania-natezenie","block":2,"topic":"Klasyfikacja","kind":"skill","scope":"podstawowy","adrRef":"ADR 2.1.1.3","source":"kompendium","page":2,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","scenario"],"why":"Grupa pakowania = natężenie zagrożenia dominującego. I = duże, II = średnie, III = małe. Benzyna UN 1203 = II. Olej napędowy UN 1202 = III. Im niższa cyfra rzymska, tym groźniejszy towar.","q":{"match":{"prompt":"Dopasuj grupę pakowania do natężenia zagrożenia:","pairs":{"I":"duże zagrożenie","II":"średnie zagrożenie","III":"małe zagrożenie"}},"scenario":{"prompt":"Dwa towary: jeden GP I, drugi GP III. Który jest groźniejszy?","options":["GP III","GP I — I oznacza duże zagrożenie","Takie same"],"correct":"GP I — I oznacza duże zagrożenie"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-grupa-pakowania-natezenie@adr-2025"},{"id":"s-ino-uzupelnienie","block":2,"topic":"Klasyfikacja","kind":"skill","scope":"podstawowy","adrRef":"ADR 3.1.2.8","source":"kompendium","page":2,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"I.N.O. = inaczej nie określony. Wymaga uzupełnienia o nazwy techniczne składników w nawiasie, np. UN 1964 WĘGLOWODORY GAZOWE, MIESZANINA SPRĘŻONA I.N.O (zawiera wodór i argon) 2.1 (B/D). Bez tego zapis jest niekompletny.","q":{"scenario":{"prompt":"W dokumencie: UN 1964 WĘGLOWODORY GAZOWE, MIESZANINA SPRĘŻONA I.N.O. 2.1. Czego brakuje?","options":["Niczego, zapis pełny","Nazw technicznych składników w nawiasie","Numeru nalepki"],"correct":"Nazw technicznych składników w nawiasie"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-ino-uzupelnienie@adr-2025"},{"id":"s-jtr-paliwo-zestaw","block":1,"topic":"Jednostka i sposoby przewozu","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1.3.3 / 1.2.1","source":"kompendium","page":9,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Limit 1500 l dotyczy CAŁEJ jednostki transportowej, nie każdego pojazdu osobno. Ciągnik 1000 l + naczepa 400 l = 1400 l na jednostkę — mieści się. Ale uwaga: na przyczepie limit to dodatkowo max 500 l.","q":{"scenario":{"prompt":"Ciągnik ma zbiorniki 1000 l, naczepa dodatkowy zbiornik 400 l. Razem 1400 l. Czy mieści się w wyłączeniu paliwowym (paliwo w zbiornikach pojazdu do jego napędu)?","options":["Nie — każdy pojazd ma limit 1500 l osobno, więc jest problem","Tak — 1400 l na cała jednostkę, poniżej 1500 l","Nie — przekroczony limit"],"correct":"Tak — 1400 l na cała jednostkę, poniżej 1500 l"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-jtr-paliwo-zestaw@adr-2025"},{"id":"s-jtr-wyposazenie-liczba","block":1,"topic":"Jednostka i sposoby przewozu","kind":"skill","scope":"podstawowy","adrRef":"ADR 8.1.5 / 1.2.1","source":"kompendium","page":16,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario","match"],"why":"Pułapka: klin pod koła liczy się NA KAŻDY POJAZD (ciągnik + naczepa = 2 kliny), ale stojące znaki ostrzegawcze liczy się NA JEDNOSTKĘ TRANSPORTOWĄ (zestaw = 2 znaki, nie 4). Ciągnik z naczepa to jedna jednostka, ale dwa pojazdy.","q":{"scenario":{"prompt":"Ciągnik siodłowy z naczepa. Ile klinów i ile stojących znaków ostrzegawczych?","options":["1 klin, 2 znaki","2 kliny (każdy pojazd), 2 znaki (jednostka)","2 kliny, 4 znaki"],"correct":"2 kliny (każdy pojazd), 2 znaki (jednostka)"},"match":{"prompt":"Zestaw: ciągnik + naczepa. Ile sztuk?","pairs":{"Klin pod koła":"2 — na każdy pojazd","Stojące znaki ostrzegawcze":"2 — na jednostkę","Płyn do płukania oczu":"1 — na pojazd"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-jtr-wyposazenie-liczba@adr-2025"},{"id":"s-kanistry-przekroczenie","block":1,"topic":"Wyłączenia w praktyce","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1.3.3","source":"kompendium","page":9,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Limit paliwa w zbiornikach dodatkowych (kanistrach) to 60 l. Przekroczenie tego limitu oznacza, ze wyłączenie 1.1.3.3 nie przysługuje dla nadwyżki — trzeba stosować przepisy ADR.","q":{"scenario":{"prompt":"Wieziesz 100 l paliwa w kanistrach. Czy to się mieści w wyłączeniu paliwowym?","options":["Tak, do 1500 l","Nie — limit dla kanistrów to 60 l","Tak, jeśli kanistry są atestowane"],"correct":"Nie — limit dla kanistrów to 60 l"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-kanistry-przekroczenie@adr-2025"},{"id":"s-klasa9-co-tam","block":2,"topic":"Klasy zagrożeń","kind":"skill","scope":"podstawowy","adrRef":"ADR 2.2.9","source":"kompendium","page":4,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","scenario"],"why":"Klasa 9 to \"różne\" — wpadają tu towary bez wspólnego mianownika: azbest, materiały w podwyższonej temperaturze (stałe >240 st. C, ciekłe >100 st. C), akumulatory litowe, przedmioty ratownicze, materiały zagrażające środowisku wodnemu (UN 3077/3082).","q":{"match":{"prompt":"Które towary należą do klasy 9?","pairs":{"Azbest":"klasa 9","Baterie litowe":"klasa 9","Asfalt 150 st. C":"klasa 9 (podwyższona temperatura)"}},"scenario":{"prompt":"Wieziesz asfalt o temperaturze 150 st. C. Czy to towar niebezpieczny?","options":["Nie, to zwykly asfalt","Tak — klasa 9, materiał ciekły powyżej 100 st. C","Tak, klasa 3"],"correct":"Tak — klasa 9, materiał ciekły powyżej 100 st. C"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-klasa9-co-tam@adr-2025"},{"id":"s-kod-klasyfikacyjny","block":2,"topic":"Klasyfikacja","kind":"skill","scope":"podstawowy","adrRef":"ADR 2.1.1.2","source":"kompendium","page":2,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","scenario"],"why":"Zagrożenie dodatkowe określane jest kodem literowym: F = palne, T = trujące. Kod klasyfikacyjny mówi więcej niż sama klasa — np. gaz z kodem TF to gaz trujący i palny jednocześnie. To druga nalepka w dokumencie przewozowym.","q":{"match":{"prompt":"Dopasuj kod literowy do zagrożenia:","pairs":{"F":"palne","T":"trujące"}},"scenario":{"prompt":"Gaz o kodzie klasyfikacyjnym TF. Jakie ma zagrożenia?","options":["Tylko trujący","Trujący i palny jednocześnie","Tylko palny"],"correct":"Trujący i palny jednocześnie"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-kod-klasyfikacyjny@adr-2025"},{"id":"s-kod-opakowania-y","block":2,"topic":"Odczyt opakowania","kind":"skill","scope":"podstawowy","adrRef":"ADR 6.1.2","source":"kompendium","page":8,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Litera na drugim miejscu kodu opakowania: X = dla I, II i III grupy pakowania; Y = dla II i III; Z = tylko dla III. Opakowanie Y nie nadaje się do towaru I grupy pakowania.","q":{"scenario":{"prompt":"Opakowanie z kodem 1A2/Y. Chcesz zapakować towar I grupy pakowania. Możesz?","options":["Tak, Y pasuje do wszystkich","Nie — Y jest tylko dla II i III grupy","Tak, jeśli towar jest ciekły"],"correct":"Nie — Y jest tylko dla II i III grupy"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-kod-opakowania-y@adr-2025"},{"id":"s-kto-klasyfikuje-nie-ty","block":2,"topic":"Klasyfikacja","kind":"skill","scope":"podstawowy","adrRef":"ADR czesc 2","source":"kompendium","page":2,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Za klasyfikację odpowiada PRODUCENT, NADAWCA i IPO (dla klasy 7 — PAA). Kierowca NIE klasyfikuje towaru. Jeśli masz wątpliwości co do klasyfikacji, nie zgadujesz — pytasz nadawcę albo doradcę DGSA.","q":{"scenario":{"prompt":"Nadawca dal Ci towar bez nalepki. Mówi, ze \"to chyba klasa 3\". Co robisz?","options":["Naklejam nalepkę 3 — brzmi sensownie","Nie klasyfikuje towaru — to obowiązek nadawcy, żądam prawidłowej klasyfikacji","Wioze bez nalepki"],"correct":"Nie klasyfikuje towaru — to obowiązek nadawcy, żądam prawidłowej klasyfikacji"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-kto-klasyfikuje-nie-ty@adr-2025"},{"id":"s-ktora-edycja","block":1,"topic":"Podstawy prawne","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.6","source":"kompendium","page":1,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"ADR nowelizowany jest co 2 lata, nowe przepisy wchodzą 1 stycznia roku NIEPARZYSTEGO. Edycje: 2021, 2023, 2025, 2027... Wiedza sprzed dwóch lat może być już nieaktualna — dlatego każde szkolenie i materiał trzeba sprawdzić pod kątem edycji.","q":{"scenario":{"prompt":"Masz materiał szkoleniowy oznaczony \"ADR 2023\". Jest rok 2026. Co to znaczy?","options":["Materiał jest aktualny, ADR się nie zmienia","Weszła już edycja 2025 — materiał może być miejscami nieaktualny","Materiał wygasł i jest bezużyteczny"],"correct":"Weszła już edycja 2025 — materiał może być miejscami nieaktualny"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-ktora-edycja@adr-2025"},{"id":"s-ladowanie-3-8","block":4,"topic":"Decyzja o załadunku","kind":"skill","scope":"podstawowy","adrRef":"ADR 7.5.2.1","source":"kompendium","page":25,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"W ADR większość klas można ładować razem przy prawidłowym opakowaniu (inaczej niż w transporcie morskim IMDG). Zakazy 7.5.2.1 dotyczą w uproszczeniu klasy 1 oraz 4.1+1 i 5.2+1 o właściwościach wybuchowych.","q":{"scenario":{"prompt":"Chcesz załadować razem kanistry z benzyna (3) i kwasem (8). Wolno?","options":["Nie, różne klasy nigdy razem","Tak — ładowanie razem tych klas jest dozwolone","Tylko w osobnych kontenerach"],"correct":"Tak — ładowanie razem tych klas jest dozwolone"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-ladowanie-3-8@adr-2025"},{"id":"s-ladowanie-klasa1","block":4,"topic":"Decyzja o załadunku","kind":"skill","scope":"podstawowy","adrRef":"ADR 7.5.2.1","source":"kompendium","page":25,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Zakazy ładowania razem koncentrują się na klasie 1 (materiały wybuchowe). Wyjątkiem jest podklasa 1.4S, która ma najłagodniejszy reżim. Szczegóły w tabeli 7.5.2.1.","q":{"scenario":{"prompt":"Która grupa towarów ma najwięcej zakazów ładowania razem?","options":["Klasa 9","Klasa 1 — materiały wybuchowe","Klasa 3"],"correct":"Klasa 1 — materiały wybuchowe"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-ladowanie-klasa1@adr-2025"},{"id":"s-luzem-czy-wolno","block":1,"topic":"Jednostka i sposoby przewozu","kind":"skill","scope":"podstawowy","adrRef":"ADR kol. 10/17 Tabeli A","source":"kompendium","page":6,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Przewóz luzem NIE jest dozwolony domyślnie. Wolno tylko wtedy, gdy w tabeli A w kolumnie 10 lub 17 wskazany jest przepis szczególny BK1, BK2, BK3, VC1, VC2 lub VC3. Przepisy BK wskazują specjalny rodzaj kontenera. Przykład: UN 3257 (materiał o podwyższonej temperaturze ciekły) może być luzem na podstawie VC3.","q":{"scenario":{"prompt":"Chcesz przewieźć materiał stały luzem. Gdzie sprawdzasz, czy wolno?","options":["W instrukcji pisemnej","W tabeli A, kolumna 10 lub 17 — musi być BK lub VC","Na tablicy pomarańczowej"],"correct":"W tabeli A, kolumna 10 lub 17 — musi być BK lub VC"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-luzem-czy-wolno@adr-2025"},{"id":"s-multimodal-przepisy","block":1,"topic":"Podstawy prawne","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1.4.2.1 / IMDG","source":"kompendium","page":1,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario","match"],"why":"Poza ADR (droga) obowiązują: RID (kolej), ADN (śródlądowy), IMDG (morski), ICAO TI (lotniczy). Przy przewozie multimodalnym przesyłki mogą być oznakowane wg kodeksu morskiego lub lotniczego — wtedy w dokumencie zapis \"Przewóz zgodny z 1.1.4.2.1\". Przed przewozem morskim wymagany jest certyfikat pakowania kontenera.","q":{"scenario":{"prompt":"Wieziesz kontener do portu, dalej płynie promem. Jakie przepisy obowiązują na morzu?","options":["Dalej ADR","IMDG — kodeks morski","ICAO TI"],"correct":"IMDG — kodeks morski"},"match":{"prompt":"Dopasuj umowę do gałęzi transportu:","pairs":{"ADR":"drogowy","RID":"kolejowy","IMDG":"morski","ICAO TI":"lotniczy"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-multimodal-przepisy@adr-2025"},{"id":"s-odstepstwa-umowy","block":1,"topic":"Podstawy prawne","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.5","source":"kompendium","page":1,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Kraje mogą wprowadzać dodatkowe wymagania (np. przejazd tunelami, okresowe zakazy ruchu) oraz umowy specjalne dopuszczające odstępstwa od przepisów. Odstępstwa nie mogą trwać dłużej niż 5 lat. Wykaz na masteradr.pl/kraje.","q":{"scenario":{"prompt":"Umowa specjalna dopuszczająca odstępstwo od ADR może obowiązywać maksymalnie:","options":["1 rok","5 lat","Bezterminowo do odwołania"],"correct":"5 lat"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-odstepstwa-umowy@adr-2025"},{"id":"s-okres-przejsciowy","block":1,"topic":"Podstawy prawne","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.6","source":"kompendium","page":1,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Nowe przepisy wchodzą 1 stycznia roku nieparzystego, ale do końca czerwca obowiązuje okres przejściowy — można stosować \"stara\" LUB \"nowa\" wersje przepisów. Od 1 lipca obowiązuje już tylko nowa.","q":{"scenario":{"prompt":"Marzec roku nieparzystego. Twoje instrukcje pisemne są wg poprzedniej edycji ADR. Kontrola. Czy to naruszenie?","options":["Tak, od stycznia obowiązuje nowa edycja","Nie — do końca czerwca trwa okres przejściowy, wolno stosować stara wersje","Tak, ale kara jest symboliczna"],"correct":"Nie — do końca czerwca trwa okres przejściowy, wolno stosować stara wersje"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-okres-przejsciowy@adr-2025"},{"id":"s-oznakowanie-decyzja","block":4,"topic":"Oznakowanie pojazdu w praktyce","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.3","source":"kompendium","page":21,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","scenario"],"why":"Sposób oznakowania zależy od sposobu przewozu. Sztuki przesyłki: tablice gładkie (bez numerów) przód i tył, BEZ nalepek na pojeździe. Luzem lub cysterna: tablice z numerami przód i tył + nalepki z trzech stron (oba boki i tył). Kontener-cysterna: nalepki z 4 stron.","q":{"match":{"prompt":"Dopasuj sposób przewozu do oznakowania:","pairs":{"Sztuki przesyłki":"tablice gładkie przód i tył, bez nalepek","Luzem lub cysterna":"tablice z numerami + nalepki z 3 stron","Kontener-cysterna":"nalepki z 4 stron"}},"scenario":{"prompt":"Wieziesz butle gazowe i DPPL (sztuki przesyłki). Jak oznakować pojazd?","options":["Tablice z numerami i nalepki z boków","Tablice gładkie bez numerów, przód i tył, bez nalepek","Bez oznakowania"],"correct":"Tablice gładkie bez numerów, przód i tył, bez nalepek"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-oznakowanie-decyzja@adr-2025"},{"id":"s-paliwo-limity","block":1,"topic":"Wyłączenia w praktyce","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1.3.3","source":"kompendium","page":9,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario","match"],"why":"Wyłączenie 1.1.3.3 dla paliwa w zbiornikach pojazdu: do 1500 l na jednostkę transportową, nie więcej niż 500 l na przyczepie, w kanistrach nie więcej niż 60 l.","q":{"scenario":{"prompt":"Ciągnik 800 l + naczepa 400 l + 2 kanistry po 20 l = 1240 l. Czy mieści się w wyłączeniu paliwowym (paliwo w zbiornikach pojazdu)?","options":["Nie, przekroczone 1000 l","Tak — 1240 l poniżej 1500 l, kanistry 40 l poniżej 60 l","Tylko bez kanistrów"],"correct":"Tak — 1240 l poniżej 1500 l, kanistry 40 l poniżej 60 l"},"match":{"prompt":"Dopasuj limit paliwa (wyłączenie paliwowe):","pairs":{"Jednostka transportową":"1500 l","Przyczepa":"500 l","Kanistry":"60 l"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-paliwo-limity@adr-2025"},{"id":"s-podklasa-4","block":2,"topic":"Klasy zagrożeń","kind":"skill","scope":"podstawowy","adrRef":"ADR 2.2.41-43","source":"kompendium","page":3,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","scenario"],"why":"Klasa 4: 4.1 zapalne stałe i samoreaktywne, 4.2 podatne na samozapalenie (piroforyczne, fosfor biały, rozdrobnione metale), 4.3 wydzielają z wodą gazy palne. Skutek praktyczny: 4.3 MUSZĄ być w pojazdach zamkniętych, a uwolniony materiał trzyma się w stanie suchym pod przykryciem.","q":{"match":{"prompt":"Dopasuj podklasę klasy 4:","pairs":{"4.1":"zapalne stałe, samoreaktywne","4.2":"samozapalne (piroforyczne)","4.3":"z wodą wydzielają gazy palne"}},"scenario":{"prompt":"Wieziesz materiał klasy 4.3. Zaczyna padać deszcz, plandeka przecieka. Problem?","options":["Nie, woda nie szkodzi","Tak — 4.3 z wodą wydziela gazy palne, musi być pojazd zamknięty","Tylko przy dużej ilości"],"correct":"Tak — 4.3 z wodą wydziela gazy palne, musi być pojazd zamknięty"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-podklasa-4@adr-2025"},{"id":"s-podklasa-5","block":2,"topic":"Klasy zagrożeń","kind":"skill","scope":"podstawowy","adrRef":"ADR 2.2.51-52","source":"kompendium","page":4,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Klasa 5.1 (utleniające) same nie muszą się palić, ale WZMAGAJĄ palenie. Nie wolno ich mieszać z materiałami zapalnymi — np. trocinami. W kontakcie mogą gwałtownie reagować, wybuchać, powodować pożar. 5.2 to nadtlenki organiczne (typy A-F), niektóre wybuchowe.","q":{"scenario":{"prompt":"Materiał utleniający (5.1) rozsypał się na trociny w naczepie. Zagrożenie?","options":["Żadne, 5.1 sam się nie pali","Poważne — utleniacz z materiałem palnym może gwałtownie reagować i zapalić się","Tylko przy ogrzaniu powyżej 100 st. C"],"correct":"Poważne — utleniacz z materiałem palnym może gwałtownie reagować i zapalić się"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-podklasa-5@adr-2025"},{"id":"s-podklasa-6-pulapka","block":2,"topic":"Klasy zagrożeń","kind":"skill","scope":"podstawowy","adrRef":"ADR 2.2.61-62","source":"kompendium","page":4,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario","match"],"why":"Klasa 6.1 = trujące (zatrucie przez połknięcie, wdychanie, skórę). Klasa 6.2 = zakaźne (odpady medyczne, wirusy, bakterie, priony). PUŁAPKA: NIE występują materiały jednocześnie zakaźne I trujące — takie połączenie nie istnieje w ADR.","q":{"scenario":{"prompt":"Czy może istnieć materiał jednocześnie zakaźny (6.2) i trujący (6.1)?","options":["Tak, często występuje","Nie — takie połączenie nie występuje w ADR","Tylko w odpadach medycznych"],"correct":"Nie — takie połączenie nie występuje w ADR"},"match":{"prompt":"Dopasuj podklasę klasy 6:","pairs":{"6.1":"trujące","6.2":"zakaźne (odpady medyczne, wirusy)"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-podklasa-6-pulapka@adr-2025"},{"id":"s-podklasa-gazu","block":2,"topic":"Klasy zagrożeń","kind":"skill","scope":"podstawowy","adrRef":"ADR 2.2.2","source":"kompendium","page":3,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","scenario"],"why":"Klasa 2: 2.1 gazy palne (propan), 2.2 gazy niepalne i nietrujące — MOGĄ BYĆ DUSZĄCE (azot, argon), 2.3 gazy trujące (chlor). Pułapka: 2.2 nie jest \"bezpieczny\" — dusi, wypierając tlen. Dlatego przy gazach unika się zagłębień terenu.","q":{"match":{"prompt":"Dopasuj gaz do podklasy:","pairs":{"Propan":"2.1 palny","Azot":"2.2 niepalny, duszący","Chlor":"2.3 trujący"}},"scenario":{"prompt":"Wyciek azotu (2.2) w zagłębieniu terenu. Czy to groźne?","options":["Nie, azot jest niepalny i nietrujący","Tak — dusi, wypierając tlen; unikać zagłębień","Tylko przy otwartym ogniu"],"correct":"Tak — dusi, wypierając tlen; unikać zagłębień"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-podklasa-gazu@adr-2025"},{"id":"s-pozycja-grupowa","block":2,"topic":"Klasyfikacja","kind":"skill","scope":"podstawowy","adrRef":"ADR 3.1.2","source":"kompendium","page":2,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario","match"],"why":"Numer UN może być przypisany do JEDNEJ substancji (UN 1090 ACETON) albo do POZYCJI GRUPOWEJ — kilku towarów o podobnych właściwościach (UN 1263 FARBA). Przy pozycji grupowej pod jednym numerem UN kryją się różne produkty.","q":{"scenario":{"prompt":"UN 1263 FARBA. Czy to jedna konkretna substancją?","options":["Tak, jedna farba","Nie — to pozycja grupowa, wiele produktów o podobnych właściwościach","To numer zagrożenia"],"correct":"Nie — to pozycja grupowa, wiele produktów o podobnych właściwościach"},"match":{"prompt":"Dopasuj typ pozycji:","pairs":{"UN 1090 ACETON":"jedna substancja","UN 1263 FARBA":"pozycja grupowa"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-pozycja-grupowa@adr-2025"},{"id":"s-prozne-nalepki","block":1,"topic":"Wyłączenia w praktyce","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.1.3","source":"kompendium","page":11,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Próżne, nieoczyszczone opakowania pozostają oznakowane tak jak w stanie ładownym. Nie usuwa się nalepek ostrzegawczych ani numerów UN. Zdejmuję się je dopiero po całkowitym oczyszczeniu (robi to rozładowca).","q":{"scenario":{"prompt":"Rozładowałeś DPPL po farbie, nieoczyszczony. Co robisz z nalepka klasy 3?","options":["Usuwam — jest pusty","Zostawiam — nieoczyszczone oznakowane jak ładowne","Zaklejam tasma"],"correct":"Zostawiam — nieoczyszczone oznakowane jak ładowne"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-prozne-nalepki@adr-2025"},{"id":"s-przypisz-klase","block":2,"topic":"Klasyfikacja","kind":"skill","scope":"podstawowy","adrRef":"ADR czesc 2","source":"kompendium","page":3,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","scenario"],"why":"Rozpoznanie klasy po towarze to podstawa. Benzyna i olej napędowy = klasa 3 (ciecze zapalne). Propan/butan = klasa 2 (gazy). Kwas siarkowy = klasa 8 (żrące). Baterie litowe = klasa 9. Azotan amonu = klasa 5.1 (utleniający).","q":{"match":{"prompt":"Dopasuj towar do klasy:","pairs":{"Benzyna":"klasa 3","Propan w butli":"klasa 2","Kwas siarkowy":"klasa 8","Baterie litowe":"klasa 9"}},"scenario":{"prompt":"Wieziesz azotan amonu, który podtrzymuje spalanie. Która klasa?","options":["Klasa 3 — bo palny","Klasa 5.1 — utleniający","Klasa 9"],"correct":"Klasa 5.1 — utleniający"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-przypisz-klase@adr-2025"},{"id":"s-sposob-przewozu-rozpoznanie","block":1,"topic":"Jednostka i sposoby przewozu","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.2.1 / 5.3","source":"kompendium","page":6,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","scenario"],"why":"Rozpoznanie sposobu przewozu decyduje o oznakowaniu pojazdu. Sztuki przesyłki to opakowania: kanistry, bębny, butle, DPPL, worki, BIG-BAGi, wiązki. Luzem to NIEOPAKOWANE materiały stałe, np. zużyte akumulatory. Cysterna to zbiornik z wyposażeniem.","q":{"match":{"prompt":"Dopasuj ładunek do sposobu przewozu:","pairs":{"BIG-BAGi z granulatem":"sztuki przesyłki","Zużyte akumulatory nieopakowane":"luzem","Paliwo w zbiorniku":"cysterna","Butle gazowe na palecie":"sztuki przesyłki"}},"scenario":{"prompt":"Wieziesz BIG-BAGi. To sztuki przesyłki czy luzem?","options":["Luzem — materiał sypki","Sztuki przesyłki — BIG-BAG to opakowanie","Zależy od masy"],"correct":"Sztuki przesyłki — BIG-BAG to opakowanie"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-sposob-przewozu-rozpoznanie@adr-2025"},{"id":"s-swiadectwo-kiedy","block":4,"topic":"Praca z dokumentem","kind":"skill","scope":"podstawowy","adrRef":"ADR 9.1.3","source":"kompendium","page":15,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Świadectwo dopuszczenia (\"czerwony pasek\") wymagane jest dla pojazdów EX/II i EX/III (klasa 1), FL i AT (cysterny) oraz MEMU. Pojazdy przewożące sztuki przesyłki (poza wybuchowymi) i luzem NIE muszą go mieć — np. butle z gazem, DPPL, kanistry.","q":{"scenario":{"prompt":"Wieziesz butle z gazem i kanistry na skrzyni. Czy pojazd potrzebuje świadectwa dopuszczenia?","options":["Tak, zawsze przy ADR","Nie — sztuki przesyłki poza klasa 1 nie wymagaja świadectwa","Tak, powyżej 3,5 t"],"correct":"Nie — sztuki przesyłki poza klasa 1 nie wymagaja świadectwa"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-swiadectwo-kiedy@adr-2025"},{"id":"s-tablica-268-1017","block":2,"topic":"Odczyt tablicy","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.3.2.3","source":"kompendium","page":18,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Numer 268 = gaz trujący żrący. Cyfra 2 = emisja gazu, 6 = działanie trujące, 8 = działanie żrące. UN 1017 = chlor. Wymagana maska ucieczkowa (nalepka 2.3).","q":{"scenario":{"prompt":"Tablica 268 / 1017 (chlor). Jakie wyposażenie dodatkowe jest wymagane?","options":["Łopata i pojemnik","Maska ucieczkowa dla każdego członka załogi","Tylko gaśnica 2 kg"],"correct":"Maska ucieczkowa dla każdego członka załogi"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-tablica-268-1017@adr-2025"},{"id":"s-tablica-33-1203","block":2,"topic":"Odczyt tablicy","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.3.2.3","source":"kompendium","page":17,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Górny numer 33: cyfra 3 = zapalność cieczy, podwojenie = nasilenie, czyli materiał łatwo zapalny ciekły o temperaturze zapłonu poniżej 23 st. C. Dolny 1203 = benzyna silnikowa.","q":{"scenario":{"prompt":"Cysterna z tablica 33 / 1203. Co wieziesz i jakie jest główne zagrożenie?","options":["Olej napędowy, zagrożenie środowiska","Benzynę, materiał łatwo zapalny (zapłon poniżej 23 st. C)","Chlor, gaz trujący"],"correct":"Benzynę, materiał łatwo zapalny (zapłon poniżej 23 st. C)"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-tablica-33-1203@adr-2025"},{"id":"s-tablica-90-3082","block":2,"topic":"Odczyt tablicy","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.3.2.3","source":"kompendium","page":20,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Numer 90 = materiał zagrażający środowisku, różne materiały niebezpieczne. UN 3082 = materiał zagrażający środowisku wodnemu, ciekły, i.n.o. (klasa 9).","q":{"scenario":{"prompt":"Cysterna z tablica 90 / 3082. Wyciek do rowu. Co jest głównym problemem?","options":["Pożar","Skażenie środowiska wodnego","Wybuch"],"correct":"Skażenie środowiska wodnego"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-tablica-90-3082@adr-2025"},{"id":"s-tablica-sklad-cyfr","block":2,"topic":"Odczyt tablicy","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.3.2.3","source":"kompendium","page":18,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match"],"why":"Numer rozpoznawczy składa się z cyfr o stalym znaczeniu: 2 emisja gazu, 3 zapalność cieczy, 4 zapalność ciał stałych, 5 utleniające, 6 trujące/zakaźne, 7 promieniotwórcze, 8 żrące, 9 gwałtowna reakcja. Składając je czytasz zagrożenie bez tabeli.","q":{"match":{"prompt":"Rozłóż numer na zagrożenia:","pairs":{"26":"gaz trujący","80":"materiał żrący","336":"łatwo zapalny ciekły trujący","539":"nadtlenek organiczny zapalny"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-tablica-sklad-cyfr@adr-2025"},{"id":"s-tablica-x-woda","block":2,"topic":"Odczyt tablicy","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.3.2.3","source":"kompendium","page":17,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Litera X przed numerem = materiał reaguje niebezpiecznie z wodą. Woda może być użyta tylko za zgoda specjalistów. To informacja ratująca życie przy gaszeniu.","q":{"scenario":{"prompt":"Tablica X423. Pali się ładunek. Straż pyta czy można lać wodę. Twoja odpowiedź:","options":["Tak, woda gasi wszystko","NIE bez zgody specjalistów — X oznacza niebezpieczna reakcje z wodą","Tylko mało wody"],"correct":"NIE bez zgody specjalistów — X oznacza niebezpieczna reakcje z wodą"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-tablica-x-woda@adr-2025"},{"id":"s-tablica-zero","block":2,"topic":"Odczyt tablicy","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.3.2.3","source":"kompendium","page":17,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Zero na drugiej pozycji oznacza brak zagrożenia dodatkowego i brak nasilenia. Towar zwykle należy do II lub III grupy pakowania. Numer 30 = materiał zapalny ciekły (23-60 st. C).","q":{"scenario":{"prompt":"Tablica 30 / 1202. Co mówi Ci zero na drugiej pozycji?","options":["Materiał jest wybuchowy","Brak zagrożenia dodatkowego, zwykle II lub III grupa pakowania","Reaguje z woda"],"correct":"Brak zagrożenia dodatkowego, zwykle II lub III grupa pakowania"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-tablica-zero@adr-2025"},{"id":"s-temp-kontrolowana-kiedy","block":2,"topic":"Klasy zagrożeń","kind":"skill","scope":"podstawowy","adrRef":"ADR 7.1.7","source":"kompendium","page":4,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Temperatury kontrolowanej mogą wymagać klasy 4.1 (samoreaktywne) i 5.2 (nadtlenki organiczne) — reakcja egzotermiczna. Wtedy: termometr z 2 czujnikami, sprawdzanie co 4-6 h, rejestracja, procedura na wypadek utraty kontroli temperatury. Zapis w dokumencie: TEMPERATURA KONTROLOWANA / TEMPERATURA AWARYJNA.","q":{"scenario":{"prompt":"Wieziesz nadtlenek organiczny w temperaturze kontrolowanej. Co ile sprawdzasz temperaturę?","options":["Co godzinę","Co 4-6 h, z rejestracja","Raz na początku trasy"],"correct":"Co 4-6 h, z rejestracja"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-temp-kontrolowana-kiedy@adr-2025"},{"id":"s-tunel-b","block":4,"topic":"Decyzja o tunelu","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.9.5","source":"kompendium","page":23,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Kod (B) = zakaz w tunelach B, C, D i E. Przejechać można tylko tunelem kategorii A (nieoznakowany lub ze znakiem D-37). To najbardziej restrykcyjny kod dla przewozu.","q":{"scenario":{"prompt":"Kod tunelowy (B). Przez które tunele możesz przejechać?","options":["Wszystkie","Tylko A (nieoznakowany lub D-37)","A, B i C"],"correct":"Tylko A (nieoznakowany lub D-37)"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-tunel-b@adr-2025"},{"id":"s-tunel-de-cysterna","block":4,"topic":"Decyzja o tunelu","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.9.5","source":"kompendium","page":23,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Kod (D/E) czytamy: D dotyczy cysterny i luzem, E dotyczy sztuk przesyłki. Cysterna z kodem D nie może wjechać do tunelu D ani E. Do C, B i A może.","q":{"scenario":{"prompt":"Dokument: kod tunelowy (D/E). Wieziesz w CYSTERNIE. Tunel kategorii D — wjeżdżasz?","options":["Tak","Nie — dla cysterny obowiązuje D, zakaz w tunelu D i E","Tylko z eskorta"],"correct":"Nie — dla cysterny obowiązuje D, zakaz w tunelu D i E"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-tunel-de-cysterna@adr-2025"},{"id":"s-tunel-de-sztuki","block":4,"topic":"Decyzja o tunelu","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.9.5","source":"kompendium","page":23,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Kod (D/E): przy przewozie w sztukach przesyłki obowiązuje E — zakaz tylko w tunelu kategorii E. Do D, C, B i A wolno.","q":{"scenario":{"prompt":"Ten sam kod (D/E), ale wieziesz w SZTUKACH Przesyłki. Tunel kategorii D — wjeżdżasz?","options":["Nie","Tak — dla sztuk obowiązuje E, zakaz dopiero w tunelu E","Tylko noca"],"correct":"Tak — dla sztuk obowiązuje E, zakaz dopiero w tunelu E"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-tunel-de-sztuki@adr-2025"},{"id":"s-tunel-gdzie-kod","block":4,"topic":"Decyzja o tunelu","kind":"skill","scope":"podstawowy","adrRef":"ADR kol. 15","source":"kompendium","page":23,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Kod tunelowy towaru znajdziesz w dokumencie przewozowym (w nawiasie na końcu zapisu) oraz w tabeli A w kolumnie 15. Kategorie tunelu na drodze odczytasz z tabliczki pod znakiem B-13a.","q":{"scenario":{"prompt":"Skąd wiesz, jaki kod tunelowy ma Twój towar?","options":["Z tablicy pomarańczowej","Z dokumentu przewozowego (nawias) lub tabeli A kolumna 15","Z instrukcji pisemnej"],"correct":"Z dokumentu przewozowego (nawias) lub tabeli A kolumna 15"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-tunel-gdzie-kod@adr-2025"},{"id":"s-tunel-lq","block":4,"topic":"Decyzja o tunelu","kind":"skill","scope":"podstawowy","adrRef":"ADR 3.4 / 1.9.5","source":"kompendium","page":10,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Jednostka powyżej 12 t DMC przewożąca powyżej 8 t brutto towarów w ilościach ograniczonych (LQ) musi być oznakowana znakiem LQ i NIE MOŻE wjeżdżać do tunelu kategorii E.","q":{"scenario":{"prompt":"Ciężarówka 24 t DMC, 10 t brutto towarów LQ. Tunel kategorii E — wjeżdżasz?","options":["Tak, LQ jest zwolnione","Nie — LQ powyżej 8 t brutto ma zakaz tunelu E","Tak, jeśli nie ma tablic"],"correct":"Nie — LQ powyżej 8 t brutto ma zakaz tunelu E"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-tunel-lq@adr-2025"},{"id":"s-tunel-minus","block":4,"topic":"Decyzja o tunelu","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.9.5 / kol. 15","source":"kompendium","page":23,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Kod \"(-)\" w kolumnie 15 tabeli A oznacza brak ograniczeń tunelowych — wolno wjechać do każdego tunelu, łącznie z E. Dotyczy m.in. UN 2814, 2900, 2919, 3166, 3171, 3331, 3359, 3373, 3549.","q":{"scenario":{"prompt":"Kod tunelowy \"(-)\". Tunel kategorii E — wjeżdżasz?","options":["Nie, E to zawsze zakaz","Tak — kod (-) oznacza brak ograniczeń","Tylko jeśli masz eskorte"],"correct":"Tak — kod (-) oznacza brak ograniczeń"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-tunel-minus@adr-2025"},{"id":"s-un-3077-3082","block":3,"topic":"Materiały zagrażające środowisku","kind":"skill","scope":"podstawowy","adrRef":"ADR 3.2.1","source":"kompendium","page":4,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario","match"],"why":"Materiał zagrażający środowisku: UN 3077 gdy STAŁY, UN 3082 gdy CIEKŁY. Oba należą do klasy 9. Numer rozpoznawczy zagrożenia dla nich to 90.","q":{"scenario":{"prompt":"Wieziesz ciekły materiał zagrażający środowisku. Który numer UN?","options":["UN 3077","UN 3082","UN 1203"],"correct":"UN 3082"},"match":{"prompt":"Dopasuj stan skupienia do numeru UN:","pairs":{"STAŁY":"UN 3077","CIEKŁY":"UN 3082"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-un-3077-3082@adr-2025"},{"id":"s-uprawnienia-cysterna","block":1,"topic":"Zakres uprawnień","kind":"skill","scope":"podstawowy","adrRef":"ADR 8.2.1","source":"kompendium","page":13,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario","match"],"why":"ADR podstawowy obejmuje cysterny stałe i odejmowalne do 1000 l oraz kontenery-cysterny do 3000 l. Powyżej tych progów wymagany jest kurs specjalistyczny cysterny (od 1 m3 = 1000 l).","q":{"scenario":{"prompt":"Masz tylko ADR podstawowy. Kontener-cysterna 2500 l z olejem napędowym — możesz?","options":["Nie, każda cysterna wymaga kursu","Tak — kontenery-cysterny do 3000 l są w zakresie podstawowym","Tylko do 1000 l"],"correct":"Tak — kontenery-cysterny do 3000 l są w zakresie podstawowym"},"match":{"prompt":"Zakres ADR podstawowego:","pairs":{"Cysterna stala/odejmowalna":"do 1000 l","Kontener-cysterna":"do 3000 l"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-uprawnienia-cysterna@adr-2025"},{"id":"s-uprawnienia-klasy","block":1,"topic":"Zakres uprawnień","kind":"skill","scope":"podstawowy","adrRef":"ADR 8.2.1","source":"kompendium","page":13,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"ADR podstawowy pozwala przewozić wszystkie klasy POZA 1 (wybuchowe) i 7 (promieniotwórcze), w sztukach przesyłki oraz luzem. Klasa 1 i 7 wymagaja osobnych kursów specjalistycznych.","q":{"scenario":{"prompt":"Masz ADR podstawowy. Których klas NIE wolno Ci wieźć?","options":["Klasy 3 i 8","Klasy 1 i 7","Klasy 6.1 i 6.2"],"correct":"Klasy 1 i 7"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-uprawnienia-klasy@adr-2025"},{"id":"s-wiatr-opary","block":5,"topic":"Reakcja po wypadku","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.4.3.4","source":"kompendium","page":2,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Należy unikać wdychania oparów, dymu, pyłu i pary poprzez pozostawanie po stronie NAWIETRZNEJ — czyli tam, skąd wieje wiatr. Wiatr wieje od Ciebie w stronę zdarzenia, nie odwrotnie.","q":{"scenario":{"prompt":"Wyciek z cysterny, wiatr wieje z zachodu. Gdzie się ustawiasz?","options":["Na wschód od wycieku (z wiatrem)","Na zachód od wycieku (strona nawietrzną)","Bez znaczenia"],"correct":"Na zachód od wycieku (strona nawietrzną)"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-wiatr-opary@adr-2025"},{"id":"s-wypadek-sekwencja","block":5,"topic":"Reakcja po wypadku","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.4.3.4","source":"kompendium","page":2,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["order"],"why":"Sekwencja z instrukcji pisemnej: najpierw zabezpiecz pojazd (zahamuj, wyłącz silnik, odłącz akumulator), potem załóż kamizelkę i ustaw znaki, powiadom służby, zapewnij ratownikom dostęp do dokumentów. Oddał się po stronie nawietrznej.","q":{"order":{"prompt":"Ulóz kolejność działań po wypadku:","items":["Powiadom służby ratownicze","Zahamuj, wyłącz silnik, odłącz akumulator","Załóż kamizelkę, ustaw znaki ostrzegawcze","Zapewnij ratownikom dostęp do dokumentów"],"correct":["Zahamuj, wyłącz silnik, odłącz akumulator","Załóż kamizelkę, ustaw znaki ostrzegawcze","Powiadom służby ratownicze","Zapewnij ratownikom dostęp do dokumentów"]}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-wypadek-sekwencja@adr-2025"},{"id":"s-wyposazenie-ilosci","block":4,"topic":"Dobór wyposażenia","kind":"skill","scope":"podstawowy","adrRef":"ADR 8.1.5","source":"kompendium","page":16,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","scenario"],"why":"Na każdego członka załogi: kamizelka, latarka, rękawice, ochrona oczu, maska ucieczkowa (gdy wymagana). Po 1 sztuce w pojeździe niezależnie od załogi: płyn do płukania oczu, łopata, osłona kanalizacji, pojemnik. Klin — dla każdego pojazdu. Znaki stojące — 2 na jednostkę.","q":{"match":{"prompt":"Załoga 2 osoby — ile sztuk?","pairs":{"Kamizelka":"2 (na każdego)","Maska ucieczkowa":"2 (na każdego)","Płyn do płukania oczu":"1 (na pojazd)","Łopata":"1 (na pojazd)"}},"scenario":{"prompt":"Załoga 2 osoby, przewóz klasy 3. Ile łopat musisz mieć?","options":["Dwie — po jednej na osobę","Jedna — niezależnie od liczby załogi","Żadnej"],"correct":"Jedna — niezależnie od liczby załogi"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-wyposazenie-ilosci@adr-2025"},{"id":"s-wyposazenie-klasa2-3","block":4,"topic":"Dobór wyposażenia","kind":"skill","scope":"podstawowy","adrRef":"ADR 8.1.5.3","source":"kompendium","page":16,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario","match"],"why":"Nalepka 2.3 (gazy trujące) wymaga maski ucieczkowej dla każdego członka załogi. Jednocześnie płyn do płukania oczu NIE jest wymagany przy nalepkach 1, 1.4, 1.5, 1.6, 2.1, 2.2, 2.3. Łopata też nie — 2.3 nie jest na liście 3/4.1/4.3/8/9.","q":{"scenario":{"prompt":"Wieziesz chlor (nalepka 2.3), załoga 2 osoby. Czego potrzebujesz?","options":["2 maski ucieczkowe, bez płynu do oczu i łopaty","1 maska, płyn do oczu, łopata","Tylko łopata"],"correct":"2 maski ucieczkowe, bez płynu do oczu i łopaty"},"match":{"prompt":"Nalepka 2.3 — co wymagane, co nie:","pairs":{"Maska ucieczkowa":"wymagana","Płyn do płukania oczu":"niewymagany","Łopata":"niewymagana"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-wyposazenie-klasa2-3@adr-2025"},{"id":"s-wyposazenie-klasa3","block":4,"topic":"Dobór wyposażenia","kind":"skill","scope":"podstawowy","adrRef":"ADR 8.1.5","source":"kompendium","page":16,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Nalepka 3 należy do grupy 3, 4.1, 4.3, 8, 9 — wymagana łopata, osłona otworów kanalizacyjnych i pojemnik do zbierania pozostałości (po 1 sztuce). Płyn do płukania oczu też wymagany (nie jest na liście wyłączeń 1/2.x).","q":{"scenario":{"prompt":"Wieziesz benzynę (nalepka 3). Jakie wyposażenie dodatkowe poza standardem?","options":["Maska ucieczkowa","Łopata, osłona kanalizacji, pojemnik","Nic dodatkowego"],"correct":"Łopata, osłona kanalizacji, pojemnik"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-wyposazenie-klasa3@adr-2025"},{"id":"s-x-opakowanie-vs-tablica","block":2,"topic":"Odczyt opakowania","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.3.2.3 / 6.1.2","source":"kompendium","page":17,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Pułapka egzaminacyjna: litera X ma DWA różne znaczenia. Na tablicy pomarańczowej (przed numerem zagrożenia) = niebezpieczna reakcja z wodą. W kodzie opakowania = mocne opakowanie do I, II i III grupy pakowania. To nie ma ze soba związku.","q":{"scenario":{"prompt":"Litera X w kodzie opakowania oznacza:","options":["Niebezpieczna reakcje z wodą","Mocne opakowanie do I, II i III grupy pakowania","Materiał wybuchowy"],"correct":"Mocne opakowanie do I, II i III grupy pakowania"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-x-opakowanie-vs-tablica@adr-2025"},{"id":"s-zgloszenie-sluzbom","block":5,"topic":"Reakcja po wypadku","kind":"skill","scope":"podstawowy","adrRef":"procedury krajowe","source":"kompendium","page":27,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["order","scenario"],"why":"Kolejność informacji dla służb: miejsce zdarzenia, rodzaj zdarzenia, skutki, liczba ofiar, rozmiar (ile pojazdów/osób), numery UN, sposób przewozu (luzem/cysterna), ilość towaru, czy nastąpiło uwolnienie. Numer UN odczytasz z tablicy lub dokumentu.","q":{"order":{"prompt":"Ulóz kolejność informacji przekazywanych służbom:","items":["Numery UN i ilość towaru","Miejsce zdarzenia","Rodzaj zdarzenia i skutki","Liczba ofiar"],"correct":["Miejsce zdarzenia","Rodzaj zdarzenia i skutki","Liczba ofiar","Numery UN i ilość towaru"]},"scenario":{"prompt":"Skąd bierzesz numer UN do zgłoszenia, jeśli dokument spłonął?","options":["Z pamięci","Z tablicy pomarańczowej na pojeździe","Dzwonie do przewoźnika"],"correct":"Z tablicy pomarańczowej na pojeździe"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-zgloszenie-sluzbom@adr-2025"},{"id":"s-znak-srodowisko-prog","block":3,"topic":"Materiały zagrażające środowisku","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.2.1.8.1","source":"kompendium","page":4,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Znak materiału zagrażającego środowisku (ryba i uschnięte drzewo) umieszcza się na opakowaniach WIĘKSZYCH niż 5 kg lub 5 litrów. Poniżej tego progu znak nie jest wymagany.","q":{"scenario":{"prompt":"Kanister 3 l z materiałem zagrażającym środowisku. Czy potrzebny znak ryba/drzewo?","options":["Tak, zawsze","Nie — znak od opakowań powyżej 5 kg lub 5 l","Tylko przy transporcie międzynarodowym"],"correct":"Nie — znak od opakowań powyżej 5 kg lub 5 l"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-znak-srodowisko-prog@adr-2025"},{"id":"s-znak-temperatura-prog","block":3,"topic":"Materiały zagrażające środowisku","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.2.1.8.1","source":"kompendium","page":4,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","scenario"],"why":"Znak podwyższonej temperatury (czerwony trójkąt z termometrem) dotyczy materiałów stałych powyżej 240 st. C i ciekłych powyżej 100 st. C. Zagrożenie poparzeniem — unikać kontaktu z gorącymi częściami jednostki i z uwolnionym materiałem.","q":{"match":{"prompt":"Dopasuj próg podwyższonej temperatury:","pairs":{"Materiał stały":"powyżej 240 st. C","Materiał ciekły":"powyżej 100 st. C"}},"scenario":{"prompt":"Ciekły materiał o temperaturze 120 st. C. Czy wymaga znaku podwyższonej temperatury?","options":["Nie, próg to 240 st. C","Tak — dla ciekłych próg to 100 st. C","Tylko w cysternie"],"correct":"Tak — dla ciekłych próg to 100 st. C"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-znak-temperatura-prog@adr-2025"},{"id":"s-zrodla-zaplonu-decyzja","block":5,"topic":"Reakcja po wypadku","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.4.3.4","source":"kompendium","page":2,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Po wypadku należy unikać źródeł zapłonu: nie palić, nie używać e-papierosów, NIE WŁĄCZAĆ żadnych urządzeń elektrycznych. Telefon jako latarka to urządzenie elektryczne — użyj latarki z wyposażenia ADR (jest przystosowana).","q":{"scenario":{"prompt":"Noc, wyciek benzyny, chcesz oświetlić miejsce. Czego używasz?","options":["Telefonu — ma najlepsza latarkę","Latarki z wyposażenia ADR","Zapalniczki"],"correct":"Latarki z wyposażenia ADR"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"s-zrodla-zaplonu-decyzja@adr-2025"},{"id":"x-baterie-sodowe-2025","block":2,"topic":"Zmiany ADR 2025","kind":"fact","scope":"podstawowy","adrRef":"ADR 2025 UN 3551/3552","source":"research","page":null,"edition":"ADR 2025","status":"ext-2025","verifiedBy":"domo","formats":["mcq"],"why":"ROZSZERZENIE (poza kompendium): ADR 2025 wprowadza baterie sodowo-jonowe — UN 3551 (z elektrolitem organicznym) i UN 3552 (zapakowane z urządzeniem lub w urządzeniu). Kod klasyfikacyjny M4 obejmuje teraz baterie litowe i sodowo-jonowe. DO WERYFIKACJI.","q":{"mcq":{"prompt":"Baterie sodowo-jonowe z elektrolitem organicznym (ADR 2025) mają numer:","options":["UN 3480","UN 3551","UN 3090"],"correct":"UN 3551"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"x-baterie-sodowe-2025"},{"id":"x-dokument-kabina-2025","block":4,"topic":"Zmiany ADR 2025","kind":"fact","scope":"podstawowy","adrRef":"ADR 5.4.1 (zmiana 2025)","source":"research","page":null,"edition":"ADR 2025","status":"ext-2025","verifiedBy":"domo","formats":["mcq"],"why":"ROZSZERZENIE (poza kompendium): według źródeł dot. ADR 2025 od 1 lipca 2025 dokumenty przewozowe muszą znajdować się w kabinie kierowcy. Kompendium ADR 2023 tego nie zawiera. DO WERYFIKACJI.","q":{"mcq":{"prompt":"Gdzie od lipca 2025 musi znajdować się dokument przewozowy?","options":["W biurze przewoźnika","W kabinie kierowcy","U nadawcy"],"correct":"W kabinie kierowcy"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"x-dokument-kabina-2025"},{"id":"x-kamizelka-eniso20471-2025","block":4,"topic":"Zmiany ADR 2025","kind":"fact","scope":"podstawowy","adrRef":"ADR 2025, 8.1.5 + EN ISO 20471:2023","source":"key-amendments-2025","page":null,"edition":"ADR 2025","status":"rozszerzenie","verifiedBy":"domo","formats":["mcq"],"why":"ROZSZERZENIE (poza kompendium): ADR 2025 doprecyzowuje, ze kamizelka ostrzegawcza w wyposażeniu pojazdu ma spełniać normę EN ISO 20471:2023 (lepsza widoczność w słabym świetle). DO WERYFIKACJI DGSA.","q":{"mcq":{"prompt":"Jaka normę ma spełniać kamizelka ostrzegawcza wg ADR 2025?","options":["EN ISO 20471:2023","EN 471:1994 (stara)","Dowolna kamizelka odblaskowa"],"correct":"EN ISO 20471:2023"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"x-kamizelka-eniso20471-2025"},{"id":"x-lq-szkolenie-2025","block":1,"topic":"Zmiany ADR 2025","kind":"fact","scope":"podstawowy","adrRef":"ADR 8.2.3 (doprecyzowanie 2025)","source":"research","page":null,"edition":"ADR 2025","status":"ext-2025","verifiedBy":"domo","formats":["mcq"],"why":"ROZSZERZENIE (poza kompendium): według źródeł dot. ADR 2025 doprecyzowano wymóg szkolenia załogi przewożącej towary w ilościach ograniczonych (LQ). DO WERYFIKACJI — kompendium ADR 2023 tego nie precyzuje.","q":{"mcq":{"prompt":"Czy załoga przewożąca towary LQ wymaga udokumentowanego szkolenia (ADR 2025)?","options":["Nie, LQ jest całkowicie zwolnione","Tak, wymóg doprecyzowany w ADR 2025","Tylko powyżej 8 t"],"correct":"Tak, wymóg doprecyzowany w ADR 2025"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"x-lq-szkolenie-2025"},{"id":"x-pojazdy-baterie-2025","block":2,"topic":"Zmiany ADR 2025","kind":"fact","scope":"podstawowy","adrRef":"ADR 2025 UN 3556-3558","source":"research","page":null,"edition":"ADR 2025","status":"ext-2025","verifiedBy":"domo","formats":["match"],"why":"ROZSZERZENIE (poza kompendium): ADR 2025 wprowadza numery UN 3556 (pojazd napędzany bateria litowo-jonowa), UN 3557 (litowo-metalowa), UN 3558 (sodowo-jonowa). Stosuje się nową instrukcję pakowania P912. DO WERYFIKACJI.","q":{"match":{"prompt":"Dopasuj numer UN do rodzaju pojazdu (ADR 2025):","pairs":{"UN 3556":"pojazd z bateria litowo-jonowa","UN 3557":"pojazd z bateria litowo-metalowa","UN 3558":"pojazd z bateria sodowo-jonowa"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"x-pojazdy-baterie-2025"},{"id":"x-segregacja-klasa1-uproszczenie-2025","block":4,"topic":"Zmiany ADR 2025","kind":"fact","scope":"specjalistyczny","adrRef":"ADR 2025, 7.5.2.2","source":"key-amendments-2025","page":null,"edition":"ADR 2025","status":"rozszerzenie","verifiedBy":"domo","formats":["mcq"],"why":"ROZSZERZENIE (poza kompendium): ADR 2025 upraszcza matryce mieszanego ładowania, szczególnie dla klasy 1 (materiały wybuchowe). Zakres specjalistyczny. DO WERYFIKACJI DGSA.","q":{"mcq":{"prompt":"Co ADR 2025 zmienił w zasadach mieszanego ładowania?","options":["Uprościł matryce, szczególnie dla klasy 1","Zniósł wszystkie ograniczenia segregacji","Wprowadził zakaz mieszanego ładowania"],"correct":"Uprościł matryce, szczególnie dla klasy 1"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"x-segregacja-klasa1-uproszczenie-2025"},{"id":"x-sp677-baterie-uszkodzone-2025","block":1,"topic":"Zmiany ADR 2025","kind":"fact","scope":"podstawowy","adrRef":"ADR 2025, SP 677 (3.3)","source":"specialist-training","page":null,"edition":"ADR 2025","status":"rozszerzenie","verifiedBy":"domo","formats":["mcq"],"why":"ROZSZERZENIE (poza kompendium): ADR 2025 wprowadza przepis szczególny SP 677 dla baterii litowych i sodowo-jonowych uszkodzonych w sposób krytyczny. Takie baterie przewozi się jako kategoria transportową 0 — nigdy nie podlegają wyłączeniu 1.1.3.6. DO WERYFIKACJI DGSA.","q":{"mcq":{"prompt":"Do jakiej kategorii transportowej ADR 2025 przypisuje krytycznie uszkodzone baterie (SP 677)?","options":["Kategoria 0 (nigdy nie zwolniona)","Kategoria 2","Kategoria 4 (bez ograniczeń)"],"correct":"Kategoria 0 (nigdy nie zwolniona)"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"x-sp677-baterie-uszkodzone-2025"}];function Yr(l){return l.formats||[]}function Ad(l){const m=uo.filter(k=>k.block===l),u=[];for(const k of m)u.includes(k.topic)||u.push(k.topic);return u.map(k=>{const D=m.filter(M=>M.topic===k),E=D.filter(M=>M.kind==="skill"),N=D.filter(M=>M.kind==="fact"),B=D.filter(M=>M.kind==="ref"),b=[],H=Math.max(E.length,N.length);for(let M=0;M<H;M++)E[M]&&b.push(E[M]),N[M]&&b.push(N[M]);return{name:k,items:[...b,...B],total:D.length}})}const $t=[{id:"tachograf",title:"Tachograf",icon:"🕐",facts:[{id:"tacho:symbole",formats:["mcq","match"],why:"Cztery podstawowe symbole aktywności są ustawowe i identyczne w całej UE.",q:{mcq:{prompt:"Który symbol oznacza prowadzenie pojazdu?",options:["Kierownica","Łóżko","Skrzyżowane młotki","Kwadrat"],correct:"Kierownica"},match:{prompt:"Dopasuj symbol do aktywności.",pairs:{Kierownica:"jazda",Łóżko:"odpoczynek","Skrzyżowane młotki":"inna praca","Kwadrat (przekreślony)":"dyspozycyjność"}}},ref:"Rozp. 165/2014"},{id:"tacho:karta-56",formats:["mcq","fill"],why:"Kierowca okazuje na kontroli bieżący dzień + poprzednie 56 dni (od 31.12.2024; wcześniej 28).",q:{mcq:{prompt:"Za ile ostatnich dni musisz wykazać aktywność na kontroli?",options:["7 dni","28 dni","56 dni","365 dni"],correct:"56 dni"},fill:{prompt:"Kierowca musi okazać aktywność za bieżący dzień i poprzednie ___ dni.",correct:"56"}},ref:"Rozp. 165/2014 art. 36 · Pakiet Mobilności"},{id:"tacho:zakres-2026",formats:["mcq","scenario"],why:"Od 1 lipca 2026 tachograf obejmuje też pojazdy >2,5 t w transporcie międzynarodowym i kabotażu.",q:{mcq:{prompt:"Od kiedy tachograf obejmuje pojazdy >2,5 t w transporcie międzynarodowym?",options:["Od 2023","Od 1 lipca 2026","Od 2028","Nigdy"],correct:"Od 1 lipca 2026"},scenario:{prompt:"Prowadzisz busa 3 t w przewozie międzynarodowym po 1.07.2026. Potrzebujesz tachografu?",options:["Tak, wymagany","Nie, tylko >3,5 t","Tylko w N </script><script>/* Franek sync — bufor lokalny + wysylka na serwer.
   Zapis lokalny jest zrodlem prawdy: dziala offline (kierowca w trasie),
   a serwer dostaje kopie gdy tylko jest siec. */
(function () {
  var K = "masteradr.feedback.v1";
  var EP = "/api/feedback";
  var BUILD = "v4-2026-07-24";
  var syncing = false;

  function read() {
    try { var r = localStorage.getItem(K); return r ? JSON.parse(r) : []; }
    catch (e) { return []; }
  }
  function write(a) {
    try { localStorage.setItem(K, JSON.stringify(a)); } catch (e) {}
  }
  function cid(it) {
    return (it.factId || "x") + ":" + (it.ts || 0);
  }

  // Dodaje wpis do bufora i probuje wyslac.
  function add(entry) {
    var arr = read();
    entry.cid = cid(entry);
    entry.build = BUILD;
    entry.sent = false;
    arr.push(entry);
    write(arr);
    sync();
  }

  // Wysyla wszystko, co jeszcze nie poszlo. Bezpieczne przy wielokrotnym wywolaniu.
  function sync() {
    if (syncing || !navigator.onLine) return;
    var arr = read();
    var pending = arr.filter(function (x) { return !x.sent; });
    if (!pending.length) return;

    syncing = true;
    var batch = pending.slice(0, 50);

    fetch(EP, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        items: batch.map(function (x) {
          return {
            cid: x.cid, factId: x.factId, topic: x.topic,
            cat: x.cat, msg: x.msg, ts: x.ts, build: x.build
          };
        })
      })
    })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (j && j.ok && j.accepted) {
          var ok = {};
          j.accepted.forEach(function (c) { ok[c] = 1; });
          var cur = read();
          cur.forEach(function (x) { if (ok[x.cid]) x.sent = true; });
          write(cur);
        }
      })
      .catch(function () { /* brak sieci — zostaje w buforze, sprobujemy pozniej */ })
      .then(function () {
        syncing = false;
        var still = read().filter(function (x) { return !x.sent; });
        if (still.length && batch.length === 50) sync(); // kolejna partia
      });
  }

  window.__franek = { add: add, sync: sync };

  window.addEventListener("online", sync);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) sync();
  });
  setTimeout(sync, 3000); // dosle to, co zebrano zanim byl backend
})();
</script>
</body>
</html>
