rników transportowych.","q":{"mcq":{"prompt":"Osoba fizyczna może przewieźć w małych fabrycznych opakowaniach paliwo do:","options":["60 l","240 l","1000 l"],"correct":"240 l"},"scenario":{"prompt":"Przewóz w celu ratowania życia. Czy podlega ADR?","options":["Tak, pełne ADR","Nie, zwolnienie dla akcji ratowniczej","Tylko dokument przewozowy"],"correct":"Nie, zwolnienie dla akcji ratowniczej"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-1131@adr-2025"},{"id":"b1-1132-gazy","block":1,"topic":"Wyłączenia w praktyce","kind":"fact","scope":"podstawowy","adrRef":"ADR 1.1.3.2","source":"kompendium","page":9,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","match"],"why":"Zwolnienia dla gazów 1.1.3.2: gazy w zbiornikach pojazdu do napędu; gazy w zbiornikach przewożonych pojazdów — wartość energetyczna max 54 000 MJ. Łączna objętość: 1080 kg dla LNG i CNG, 2250 l dla LPG. Także gazy w wyposażeniu (gaśnice, napompowane koła), w żywności, w sprzęcie sportowym.","q":{"mcq":{"prompt":"Maksymalna wartość energetyczna paliwa w zbiornikach przewożonych pojazdów (wyłączenie dla gazów):","options":["24 000 MJ","54 000 MJ","108 000 MJ"],"correct":"54 000 MJ"},"match":{"prompt":"Dopasuj limit łączny dla gazów (wyłączenie dla gazów):","pairs":{"LNG i CNG":"1080 kg","LPG":"2250 l"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-1132-gazy@adr-2025"},{"id":"b1-1133-paliwo","block":1,"topic":"Wyłączenia w praktyce","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1.3.3","source":"kompendium","page":9,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","fill","match"],"why":"Zwolnienie 1.1.3.3 — paliwo w zbiornikach pojazdu służące do jego napędu lub pracy wyposażenia: do 1500 l na jednostkę transportową, nie więcej niż 500 l na przyczepie. W zbiornikach dodatkowych (kanistrach) nie więcej niż 60 l.","q":{"mcq":{"prompt":"Limit paliwa w zbiornikach pojazdu (do jego napędu) na jednostkę transportową:","options":["500 l","1000 l","1500 l"],"correct":"1500 l"},"fill":{"prompt":"W zbiornikach dodatkowych (kanistrach) nie więcej niż ___ litrów.","correct":"60","hint":"liczba"},"match":{"prompt":"Dopasuj limit paliwa w zbiornikach pojazdu (wyłączenie paliwowe):","pairs":{"Jednostka transportową":"1500 l","Przyczepa":"500 l","Kanistry":"60 l"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-1133-paliwo@adr-2025"},{"id":"b1-1136-gasnica","block":1,"topic":"Wyliczenie 1000 punktów","kind":"fact","scope":"podstawowy","adrRef":"ADR 1.1.3.6 / 8.1.4","source":"kompendium","page":16,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario","mcq"],"why":"Pojazd przewożący towary niebezpieczne na zwolnieniu 1.1.3.6 musi być wyposażony w 1 gaśnice 2 kg typu ABC.","q":{"scenario":{"prompt":"Przewóz na zwolnieniu „1000 punktów”. Ile gaśnic i jakiej wielkości?","options":["Żadnej","1 gaśnica 2 kg typu ABC","2 gaśnice po 6 kg"],"correct":"1 gaśnica 2 kg typu ABC"},"mcq":{"prompt":"Gaśnica przy zwolnieniu „1000 punktów” musi być typu:","options":["A","ABC","CO2"],"correct":"ABC"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-1136-gasnica@adr-2025"},{"id":"b1-1136","block":1,"topic":"Wyliczenie 1000 punktów","kind":"fact","scope":"podstawowy","adrRef":"ADR 1.1.3.6","source":"kompendium","page":10,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","fill"],"why":"Zwolnienie 1.1.3.6 (tzw. 1000 pkt) — pod uwagę bierze się ilość towaru na jednostce transportowej. WYMAGANE: opakowania certyfikowane i oznakowane, gaśnica 2 kg ABC z data przeglądu, prawidłowy dokument przewozowy, szkolenie stanowiskowe. NIE MUSISZ: oznakowywać pojazdu tablicami, mieć zaświadczenia ADR, instrukcji pisemnej, wyposażenia (skrzynki ADR), stosować się do znaków drogowych ADR, wyznaczać DGSA, przestrzegać zakazu przewozu pasażerów.","q":{"mcq":{"prompt":"Przy zwolnieniu „1000 punktów” (liczysz ilość × mnożnik kategorii) kierowca NIE musi:","options":["Mieć gaśnicy","Mieć zaświadczenia ADR i tablic pomarańczowych","Prawidłowo zapakować towaru"],"correct":"Mieć zaświadczenia ADR i tablic pomarańczowych"},"fill":{"prompt":"Suma punktów (ilość × mnożnik kategorii) nie może przekroczyć ___ na jednostkę transportową.","correct":"1000","hint":"liczba"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-1136@adr-2025"},{"id":"b1-def","block":1,"topic":"Podstawy prawne","kind":"ref","scope":"podstawowy","adrRef":"ADR 1.1","source":"kompendium","page":1,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Umowa ADR powstała w 1957 r. w Genewie. Składa się z 2 załączników A i B. Nowelizowana co 2 lata.","q":{"mcq":{"prompt":"Co ile lat nowelizowana jest umowa ADR?","options":["Co roku","Co 2 lata","Co 5 lat"],"correct":"Co 2 lata"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-def@adr-2025"},{"id":"b1-dgsa","block":1,"topic":"Podstawy prawne","kind":"fact","scope":"podstawowy","adrRef":"ADR 1.8.3","source":"kompendium","page":1,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"DGSA to doradca ds. bezpieczeństwa. Powinna go wyznaczyć każda firma pakująca, ładująca, transportująca lub rozładowująca towary niebezpieczne. Kara za niewyznaczenie: 5000 PLN.","q":{"mcq":{"prompt":"Kara za niewyznaczenie doradcy DGSA w firmie wynosi:","options":["1000 PLN","5000 PLN","10000 PLN"],"correct":"5000 PLN"},"scenario":{"prompt":"Firma tylko załadowuje towary niebezpieczne, nie przewozi. Czy musi wyznaczyć DGSA?","options":["Nie, tylko przewoźnicy","Tak, załadowca również","Tylko przy klasie 1"],"correct":"Tak, załadowca również"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-dgsa@adr-2025"},{"id":"b1-droga-uprawnienia","block":1,"topic":"Zakres uprawnień","kind":"fact","scope":"podstawowy","adrRef":"ADR 8.2 / ustawa PL","source":"kompendium","page":13,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["order","scenario"],"why":"Droga do uprawnień ADR: 1) kurs w akredytowanym ośrodku (podstawowy, a dla cystern/klasy 1/klasy 7 dodatkowo specjalistyczny), 2) egzamin państwowy przed Urzędem Marszałkowskim, 3) zaświadczenie ADR wydawane przez marszałka, 4) ważność 5 lat. Uprawnień nie zdobywa się z aplikacji — ta apka przygotowuje Cię do egzaminu.","q":{"order":{"prompt":"Ułóż kolejność drogi do uprawnień ADR:","items":["Egzamin państwowy przed Urzędem Marszałkowskim","Kurs w akredytowanym ośrodku","Zaświadczenie ADR od marszałka","Ważność 5 lat"],"correct":["Kurs w akredytowanym ośrodku","Egzamin państwowy przed Urzędem Marszałkowskim","Zaświadczenie ADR od marszałka","Ważność 5 lat"]},"scenario":{"prompt":"Chcesz wozić paliwo w cysternie. Jaki kurs Cię obowiązuje?","options":["Tylko podstawowy","Podstawowy + specjalistyczny cysterny","Żaden — wystarczy egzamin"],"correct":"Podstawowy + specjalistyczny cysterny"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-droga-uprawnienia@adr-2025"},{"id":"b1-egzamin-prog","block":1,"topic":"Zakres uprawnień","kind":"fact","scope":"podstawowy","adrRef":"ADR 8.2.2 / ustawa PL","source":"kompendium","page":13,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","fill"],"why":"Egzamin państwowy to test jednokrotnego wyboru nadzorowany przez Urząd Marszałkowski. Próg zaliczenia to co najmniej dwie trzecie poprawnych odpowiedzi. Kurs podstawowy: 30 pytań (próg 20). Kurs cysterny: 18 pytań.","q":{"mcq":{"prompt":"Ile poprawnych odpowiedzi trzeba na egzaminie ADR podstawowym (30 pytań)?","options":["15","20","25"],"correct":"20"},"fill":{"prompt":"Próg zaliczenia egzaminu ADR to co najmniej ___ trzecie poprawnych odpowiedzi.","correct":"dwie","hint":"ułamek słownie"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-egzamin-prog@adr-2025"},{"id":"b1-eq","block":1,"topic":"Wyłączenia w praktyce","kind":"fact","scope":"podstawowy","adrRef":"ADR 3.5","source":"kompendium","page":9,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","fill","scenario"],"why":"Ilości wyłączone (EQ), przepis 3.5: materiały w opakowaniach wewnętrznych nie mogą być większe niż 1 kg (1000 g) lub 1 litr (1000 ml). Opakowanie NIE musi być certyfikowane, brak nalepek ostrzegawczych. Wymaga szkolenia stanowiskowego, NIE kursu ADR. W dokumencie zapis \"Towary niebezpieczne w ilościach wyłączonych\" oraz liczba sztuk przesyłek.","q":{"mcq":{"prompt":"Limit opakowania wewnętrznego przy ilościach wyłączonych (EQ):","options":["1 kg lub 1 litr","5 kg lub 5 litrów","30 kg lub 30 litrów"],"correct":"1 kg lub 1 litr"},"fill":{"prompt":"Przy EQ opakowanie ___ musi być certyfikowane (NIE / MUSI).","correct":"nie","hint":"nie albo musi"},"scenario":{"prompt":"Wieziesz towar w ilościach wyłączonych. Czy potrzebujesz kursu ADR?","options":["Tak","Nie, wystarczy szkolenie stanowiskowe","Tylko przy klasie 8"],"correct":"Nie, wystarczy szkolenie stanowiskowe"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-eq@adr-2025"},{"id":"b1-inne-galezie","block":1,"topic":"Podstawy prawne","kind":"fact","scope":"podstawowy","adrRef":"RID / ADN / IMDG / ICAO TI","source":"kompendium","page":1,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match"],"why":"Poza ADR (drogowy) istnieją: RID — kolejowy, ADN — śródlądowy, IMDG — morski, ICAO TI — lotniczy.","q":{"match":{"prompt":"Dopasuj umowę do gałęzi transportu:","pairs":{"RID":"kolejowy","ADN":"śródlądowy","IMDG":"morski","ICAO TI":"lotniczy"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-inne-galezie@adr-2025"},{"id":"b1-jtr","block":1,"topic":"Jednostka i sposoby przewozu","kind":"fact","scope":"podstawowy","adrRef":"ADR 1.2.1","source":"kompendium","page":1,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Jednostka transportową to pojazd silnikowy z przyczepa lub bez, albo ciągnik z naczepa. Ciągnik + naczepa = JEDNA jednostka, choc to dwa pojazdy. Ważne przy liczeniu wyposażenia i wyłączeń.","q":{"mcq":{"prompt":"Ciągnik siodłowy z naczepa stanowi:","options":["Dwie jednostki transportowe","Jedna jednostkę transportową","Zależy od ładunku"],"correct":"Jedna jednostkę transportową"},"scenario":{"prompt":"Zestaw 40 t. Wyposażenie ADR liczysz na:","options":["Każdy pojazd osobno","Cała jednostkę transportową","Tylko ciągnik"],"correct":"Cała jednostkę transportową"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-jtr@adr-2025"},{"id":"b1-kat0","block":1,"topic":"Wyliczenie 1000 punktów","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1.3.6.3","source":"kompendium","page":11,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Dla towarów kategorii transportowej 0 KAŻDA ilość oznacza pełny ADR — limit wynosi 0, nie ma mnożnika. Dotyczy to także próżnych opakowań po towarach kategorii 0.","q":{"mcq":{"prompt":"Towary kategorii transportowej 0 przewozi się:","options":["Bez ograniczeń","Zawsze na pełnym ADR, każda ilość","Do 20 kg na wyłączeniu"],"correct":"Zawsze na pełnym ADR, każda ilość"},"scenario":{"prompt":"Próżne, nieoczyszczone opakowanie po towarze kategorii 0. Jaki reżim?","options":["Zwolnienie „1000 punktów”","Pełny ADR","Kategoria 4, bez ograniczeń"],"correct":"Pełny ADR"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-kat0@adr-2025"},{"id":"b1-kat1-wyjatek","block":1,"topic":"Wyliczenie 1000 punktów","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1.3.6.3","source":"kompendium","page":11,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"W kategorii transportowej 1 występuje wyjątek: dla UN 0081, 0082, 0084, 0241, 0331, 0332, 0482, 1005 i 1017 maksymalna ilość całkowita na jednostkę transportową wynosi 50 kg, a mnożnik to x20 (zamiast standardowych 20 i x50).","q":{"mcq":{"prompt":"Dla UN 1005 i UN 1017 (kategoria 1) maksymalna ilość na jednostkę wynosi:","options":["20 kg","50 kg","333 kg"],"correct":"50 kg"},"scenario":{"prompt":"Przewozisz UN 1017 (chlor). Jaki mnożnik stosujesz przy liczeniu punktów?","options":["x50 (standard kąt. 1)","x20 (wyjątek)","x3"],"correct":"x20 (wyjątek)"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-kat1-wyjatek@adr-2025"},{"id":"b1-kat4","block":1,"topic":"Wyliczenie 1000 punktów","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1.3.6.3","source":"kompendium","page":11,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Kategoria transportową 4 — każda ilość \"na wyłączeniu\", mnożnik 0, bez ograniczeń. Należą tu: próżne opakowania po towarach niebezpiecznych (z wyłączeniem tych z kategorii 0), materiały wybuchowe 1.4S oraz WSZYSTKIE butle po gazach. Butle po gazach może przewozić kierowca bez zaświadczenia ADR.","q":{"mcq":{"prompt":"Wszystkie butle po gazach należą do kategorii transportowej:","options":["1","2","4"],"correct":"4"},"scenario":{"prompt":"Wieziesz puste butle po gazach. Czy potrzebujesz zaświadczenia ADR?","options":["Tak, zawsze","Nie — kategoria 4, bez ograniczeń","Tylko powyżej 10 butli"],"correct":"Nie — kategoria 4, bez ograniczeń"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-kat4@adr-2025"},{"id":"b1-kategorie-transportowe","block":1,"topic":"Wyliczenie 1000 punktów","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1.3.6.3 / kol. 15","source":"kompendium","page":11,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","mcq"],"why":"Jest 5 kategorii transportowych (0-1-2-3-4). Kategorie transportowe to NIE klasy ani grupy pakowania. Limity na jednostkę transportową: kąt. 0 = 0 (zawsze pełny ADR), kąt. 1 = 20 (mnożnik x50), kąt. 2 = 333 (x3), kąt. 3 = 1000 (x1), kąt. 4 = bez ograniczeń (mnożnik 0). Kategorie sprawdza się w kolumnie 15 tabeli A.","q":{"match":{"prompt":"Dopasuj kategorię transportową do limitu ilości:","pairs":{"Kategoria 1":"20","Kategoria 2":"333","Kategoria 3":"1000","Kategoria 4":"bez ograniczeń"}},"mcq":{"prompt":"Kategorię transportową dla danego numeru UN sprawdzisz w tabeli A w kolumnie:","options":["kolumnie 1","kolumnie 15","kolumnie 20"],"correct":"kolumnie 15"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-kategorie-transportowe@adr-2025"},{"id":"b1-kurs-cysterny-prog","block":1,"topic":"Zakres uprawnień","kind":"fact","scope":"podstawowy","adrRef":"ADR 8.2.1","source":"kompendium","page":13,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Kurs specjalistyczny ADR cysterny jest wymagany dla cystern powyżej 1 m3 (1000 l). Pozwala przewozić wszystkie klasy poza 1 i 7 w cysternach.","q":{"mcq":{"prompt":"Od jakiej pojemności cysterny wymagany jest kurs specjalistyczny?","options":["Powyżej 500 l","Powyżej 1 m3 (1000 l)","Powyżej 3 m3"],"correct":"Powyżej 1 m3 (1000 l)"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-kurs-cysterny-prog@adr-2025"},{"id":"b1-lq-oznakowanie-pojazdu","block":1,"topic":"Wyłączenia w praktyce","kind":"skill","scope":"podstawowy","adrRef":"ADR 3.4.13","source":"kompendium","page":10,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Jednostki transportowe powyżej 12 t DMC przewożące powyżej 8 t brutto towarów LQ muszą być oznakowane znakiem LQ z przodu i tyłu pojazdu (250 x 250 mm). Nadawca musi poinformować przewoźnika o całkowitej ilości LQ. Oznakowanie zamienne z tablicami pomarańczowymi.","q":{"mcq":{"prompt":"Kiedy pojazd z towarami LQ musi być oznakowany z przodu i tyłu?","options":["Zawsze","Powyżej 12 t DMC i powyżej 8 t brutto ładunku LQ","Nigdy"],"correct":"Powyżej 12 t DMC i powyżej 8 t brutto ładunku LQ"},"scenario":{"prompt":"Ciężarówka 24 t DMC, 10 t brutto towarów LQ. Oznakowanie?","options":["Bez oznakowania","Znak LQ z przodu i tyłu","Tablice pomarańczowe z numerami"],"correct":"Znak LQ z przodu i tyłu"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-lq-oznakowanie-pojazdu@adr-2025"},{"id":"b1-lq-tunel-e","block":1,"topic":"Wyłączenia w praktyce","kind":"fact","scope":"podstawowy","adrRef":"ADR 1.9.5 / 3.4","source":"kompendium","page":10,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Jednostki transportowe oznakowane znakiem LQ (powyżej 8 t brutto) NIE MOGĄ wjeżdżać do tunelu kategorii E.","q":{"mcq":{"prompt":"Pojazd oznakowany znakiem LQ powyżej 8 t brutto nie może wjechać do tunelu kategorii:","options":["B","D","E"],"correct":"E"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-lq-tunel-e@adr-2025"},{"id":"b1-lq","block":1,"topic":"Wyłączenia w praktyce","kind":"fact","scope":"podstawowy","adrRef":"ADR 3.4","source":"kompendium","page":10,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","match"],"why":"Ilości ograniczone (LQ), przepis 3.4: opakowania kombinowane max 5 kg/l wewnętrzne i 30 kg/l opakowanie. Można przewozić do ładowności auta. Oznakowanie: kwadrat obrócony o 45 stopni z czarno-białymi trójkątami.","q":{"mcq":{"prompt":"Limity opakowań przy ilościach ograniczonych (LQ):","options":["1 kg/l wewnętrzne","max 5 kg/l wewnętrzne i 30 kg/l opakowanie","10 kg/l i 50 kg/l"],"correct":"max 5 kg/l wewnętrzne i 30 kg/l opakowanie"},"match":{"prompt":"Dopasuj limit LQ:","pairs":{"Opakowanie wewnętrzne":"5 kg/l","Opakowanie zewnętrzne":"30 kg/l"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-lq@adr-2025"},{"id":"b1-luzem-przepisy","block":1,"topic":"Jednostka i sposoby przewozu","kind":"fact","scope":"podstawowy","adrRef":"ADR kol. 10/17 Tabeli A","source":"kompendium","page":6,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Przewóz luzem = materiał sypki bez opakowania, wprost do skrzyni/kontenera. Wolno go wieźć TYLKO wtedy, gdy tabela A na to pozwala — w kolumnie 10 lub 17 musi widnieć kod BK albo VC. BK (Bulk Container) = dozwolony określony typ kontenera do przewozu luzem. VC (Vehicle/Container) = warunki, w jakich wolno wieźć luzem danym pojazdem lub kontenerem. Dla kontrastu: kody P (np. P200, P900) to instrukcje PAKOWANIA — dotyczą przewozu w sztukach przesyłki, nie luzem. Kody S (np. S1, S2) to przepisy dot. bezpieczeństwa przewozu. Jeśli w kolumnach luzem NIE ma BK ani VC — przewóz luzem jest zakazany.","q":{"mcq":{"prompt":"Przewóz luzem jest dozwolony, gdy w tabeli A (kol. 10 lub 17) wskazano przepis:","options":["P200 lub P900 (to instrukcje pakowania)","BK1, BK2, BK3, VC1, VC2 lub VC3","S1 lub S2 (to przepisy bezpieczeństwa)"],"correct":"BK1, BK2, BK3, VC1, VC2 lub VC3"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-luzem-przepisy@adr-2025"},{"id":"b1-mnozniki","block":1,"topic":"Wyliczenie 1000 punktów","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.1.3.6.4","source":"kompendium","page":11,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match"],"why":"Mnożniki kategorii transportowych: kąt. 1 = x50, kąt. 2 = x3, kąt. 3 = x1, kąt. 4 = 0. Suma iloczynów nie może przekroczyć 1000.","q":{"match":{"prompt":"Dopasuj kategorię do mnożnika:","pairs":{"Kategoria 1":"x50","Kategoria 2":"x3","Kategoria 3":"x1","Kategoria 4":"0"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-mnozniki@adr-2025"},{"id":"b1-nadawca","block":1,"topic":"Uczestnicy przewozu","kind":"fact","scope":"podstawowy","adrRef":"ADR 1.4.2.1","source":"kompendium","page":28,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Nadawca: upewnia się że towary są sklasyfikowane i dopuszczone do przewozu, zaopatruje przewoźnika w dokumenty przewozowe, używa wyłącznie dopuszczonych opakowań/DPPL/cystern ze znakami ADR, odpowiada za oznakowanie kontenerów. Nadawca działa PRZED przewozem i na papierze (klasyfikacja, dokumenty) — nie mylić z załadowca, który fizycznie układa towar na pojeździe.","q":{"mcq":{"prompt":"Kto odpowiada za oznakowanie kontenerów?","options":["Kierowca","Nadawca","Odbiorca"],"correct":"Nadawca"},"scenario":{"prompt":"Kto ma sklasyfikować towar i wystawić dokument przewozowy — zanim towar w ogóle trafi na pojazd?","options":["Załadowca","Nadawca","Przewoźnik"],"correct":"Nadawca"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-nadawca@adr-2025"},{"id":"b1-odbiorca","block":1,"topic":"Uczestnicy przewozu","kind":"fact","scope":"podstawowy","adrRef":"ADR 1.4.2.3","source":"kompendium","page":28,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Odbiorca: nie opóźnia przyjęcia towarów bez konieczności, sprawdza po rozładunku spełnienie wymagań ADR. Kontener może zwrócić przewoźnikowi dopiero po usunięciu naruszenia. Haczyk: odbiorca PRZYJMUJE towar — fizyczne zdejmowanie, czyszczenie i odkażanie po rozładunku to obowiązek rozładowcy, nie odbiorcy (choc często to ta sama firma).","q":{"mcq":{"prompt":"Odbiorca stwierdził naruszenie przepisów ADR w kontenerze. Może go zwrócić przewoźnikowi:","options":["Natychmiast","Dopiero po usunięciu naruszenia","Nigdy"],"correct":"Dopiero po usunięciu naruszenia"},"scenario":{"prompt":"Po rozładunku kontener trzeba oczyścić i odkazić oraz zdjąć nalepki. Czyj to obowiązek?","options":["Odbiorcy","Rozładowcy","Przewoźnika"],"correct":"Rozładowcy"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-odbiorca@adr-2025"},{"id":"b1-odstepstwa","block":1,"topic":"Podstawy prawne","kind":"fact","scope":"podstawowy","adrRef":"ADR 1.5","source":"kompendium","page":1,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Strony umowy mogą wprowadzać umowy specjalne dopuszczające odstępstwa od przepisów. Odstępstwa nie mogą być dłuższe niż 5 lat.","q":{"mcq":{"prompt":"Umowy specjalne (odstępstwa od ADR) mogą obowiązywać maksymalnie:","options":["1 rok","5 lat","bezterminowo"],"correct":"5 lat"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-odstepstwa@adr-2025"},{"id":"b1-prozne-oznakowanie","block":1,"topic":"Wyliczenie 1000 punktów","kind":"fact","scope":"podstawowy","adrRef":"ADR 5.1.3","source":"kompendium","page":11,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Próżne, NIEOCZYSZCZONE opakowania pozostają oznakowane tak jak w stanie ładownym. NIE usuwamy nalepek ostrzegawczych ani numerów UN.","q":{"mcq":{"prompt":"Próżne, nieoczyszczone opakowanie po towarze niebezpiecznym:","options":["Zdejmujemy nalepki","Pozostaje oznakowane jak w stanie ładownym","Oznaczamy napisem PUSTE"],"correct":"Pozostaje oznakowane jak w stanie ładownym"},"scenario":{"prompt":"Rozładowałeś DPPL po farbie. Opakowanie nieoczyszczone. Co z nalepka klasy 3?","options":["Usuwam ją","Zostaje — nieoczyszczone = jak ładowne","Zamieniam na nalepkę 9"],"correct":"Zostaje — nieoczyszczone = jak ładowne"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-prozne-oznakowanie@adr-2025"},{"id":"b1-przepisy-szczegolne","block":1,"topic":"Wyłączenia w praktyce","kind":"ref","scope":"podstawowy","adrRef":"ADR 3.3","source":"kompendium","page":9,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","mcq"],"why":"Zwolnienia z przepisów szczególnych: 598 — akumulatory, 168 — przewóz azbestu, 188 — akumulatory litowe zawarte w urządzeniach (nie podlega ADR).","q":{"match":{"prompt":"Dopasuj przepis szczególny do towaru:","pairs":{"168":"azbest","188":"akumulatory litowe w urządzeniach","598":"akumulatory"}},"mcq":{"prompt":"Akumulatory litowe zawarte w urządzeniu obejmuje przepis szczególny:","options":["168","188","598"],"correct":"188"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-przepisy-szczegolne@adr-2025"},{"id":"b1-przewoznik","block":1,"topic":"Uczestnicy przewozu","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.4.2.2","source":"kompendium","page":28,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Przewoźnik: upewnia się WZROKOWO czy pojazd i ładunek nie mają oczywistych wad, wycieków, nieszczelności, braków w wyposażeniu; sprawdza czy pojazd nie jest nadmiernie załadowany; sprawdza nalepki, znaki i tablice; sprawdza wyposażenie.","q":{"mcq":{"prompt":"Kontrola wzrokowa pojazdu i ładunku przed jazdą to obowiązek:","options":["Nadawcy","Przewoźnika","Rozładowcy"],"correct":"Przewoźnika"},"scenario":{"prompt":"Zauważyłeś wyciek z DPPL przed wyjazdem. Czyj to obowiązek reagować?","options":["Odbiorcy","Przewoźnika (kontrola wzrokowa)","Nikogo, to problem nadawcy"],"correct":"Przewoźnika (kontrola wzrokowa)"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-przewoznik@adr-2025"},{"id":"b1-rodzaje-przewozu","block":1,"topic":"Jednostka i sposoby przewozu","kind":"fact","scope":"podstawowy","adrRef":"ADR 1.2.1","source":"kompendium","page":6,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match"],"why":"Trzy sposoby przewozu: w sztukach przesyłki (opakowania), luzem (nieopakowane materiały stałe), w cysternie.","q":{"match":{"prompt":"Dopasuj sposób przewozu do przykładu:","pairs":{"W sztukach":"kanistry, butle, DPPL","Luzem":"zużyte akumulatory nieopakowane","W cysternie":"paliwo w zbiorniku"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-rodzaje-przewozu@adr-2025"},{"id":"b1-role-rozroznianie","block":1,"topic":"Uczestnicy przewozu","kind":"skill","scope":"podstawowy","adrRef":"ADR 1.4","source":"kompendium","page":28,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario","match"],"why":"Najczęstsza pomyłka to mylenie ROL, które brzmią podobnie. Klucz po czasowniku: nadawca KLASYFIKUJE i daje dokumenty (działa PRZED przewozem, na papierze). Przewoźnik OGLĄDA wzrokowo pojazd tuż przed jazdą. Załadowca UKŁADA sztuki na pojeździe i pilnuje segregacji. Napełniający LEJE do cystern. Rozładowca CZYŚCI po rozładunku. Odbiorca PRZYJMUJE (nie opóźnia). Zapamiętaj: klasyfikuje=nadawca, ogląda=przewoźnik, układa=załadowca, leje=napełniający, czyści=rozładowca, przyjmuje=odbiorca.","q":{"scenario":{"prompt":"Cysterna ma zostać napełniona olejem napędowym. Kto odpowiada za to, by nie przepełnić i by cysterna była dopuszczona do tego towaru?","options":["Załadowca","Napełniający","Nadawca"],"correct":"Napełniający"},"match":{"prompt":"Dopasuj role po jej kluczowym czasowniku:","pairs":{"Klasyfikuje i daje dokumenty":"nadawca","OGLĄDA pojazd przed jazdą":"przewoźnik","UKŁADA sztuki, pilnuje segregacji":"załadowca","Napełnia cysternę":"napełniający","CZYŚCI po rozładunku":"rozładowca"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-role-rozroznianie@adr-2025"},{"id":"b1-rozladowca","block":1,"topic":"Uczestnicy przewozu","kind":"fact","scope":"podstawowy","adrRef":"ADR 1.4.3.7","source":"kompendium","page":28,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Rozładowca: sprawdza czy rozładowano właściwe towary (porównanie dokumentu ze sztuka przesyłki), sprawdza uszkodzenia, po rozładunku usuwa pozostałości z zewnętrznej powierzchni, zamyka zawory, zapewnia oczyszczenie i odkażenie. Z całkowicie oczyszczonego kontenera ZDEJMUJE nalepki i tablice.","q":{"mcq":{"prompt":"Kto zdejmuje nalepki i tablice z całkowicie oczyszczonego kontenera?","options":["Nadawca","Rozładowca","Przewoźnik"],"correct":"Rozładowca"},"scenario":{"prompt":"Kontener został rozładowany, oczyszczony i odkażony. Co z nalepkami?","options":["Zostają na kontenerze","Należy je usunąć","Zaklejamy tasma"],"correct":"Należy je usunąć"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-rozladowca@adr-2025"},{"id":"b1-szkolenie","block":1,"topic":"Zakres uprawnień","kind":"fact","scope":"podstawowy","adrRef":"ADR 1.3 / 8.2","source":"kompendium","page":8,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Korzystając ze wszystkich wyłączeń kierowca NIE musi posiadać zaświadczenia ADR. Powinien przejść na koszt pracodawcy szkolenie stanowiskowe (wg 1.3), inne niż kurs ADR.","q":{"mcq":{"prompt":"Kierowca przewożący towary na wyłączeniu:","options":["Musi mieć zaświadczenie ADR","Wystarczy szkolenie stanowiskowe na koszt pracodawcy","Nie potrzebuje żadnego szkolenia"],"correct":"Wystarczy szkolenie stanowiskowe na koszt pracodawcy"},"scenario":{"prompt":"Wieziesz towar w ilościach wyłączonych (EQ). Czy potrzebujesz kursu ADR?","options":["Tak, pełnego kursu","Nie, wystarczy szkolenie stanowiskowe","Tylko przy klasie 3"],"correct":"Nie, wystarczy szkolenie stanowiskowe"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-szkolenie@adr-2025"},{"id":"b1-uczestnicy","block":1,"topic":"Uczestnicy przewozu","kind":"fact","scope":"podstawowy","adrRef":"ADR 1.4","source":"kompendium","page":28,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","scenario"],"why":"Sześciu uczestników przewozu i ich JEDEN kluczowy obowiązek: nadawca (klasyfikuje i dopuszcza do przewozu, daje dokumenty), przewoźnik (sprawdza wzrokowo pojazd i ładunek przed jazdą), załadowca (układa sztuki na pojeździe, pilnuje segregacji), napełniający (napełnia cysterny), rozładowca (sprawdza i czyści po rozładunku), odbiorca (nie opóźnia przyjęcia). Uczysz się po czasowniku — każda rola ma inny.","q":{"match":{"prompt":"Dopasuj uczestnika do głównego obowiązku:","pairs":{"Nadawca":"klasyfikuje i dopuszcza do przewozu","Przewoźnik":"wzrokowa kontrola pojazdu przed jazdą","Załadowca":"układa sztuki i pilnuje segregacji","Napełniający":"napełnia cysterny","Rozładowca":"sprawdza i czyści po rozładunku","Odbiorca":"nie opóźnia przyjęcia towaru"}},"scenario":{"prompt":"Firma pakuje kanistry, układa je na pojeździe i pilnuje, by nie załadować razem klas, których nie wolno. W jakiej roli występuje przy tych czynnościach?","options":["Nadawcy","Załadowcy","Przewoźnika"],"correct":"Załadowcy"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-uczestnicy@adr-2025"},{"id":"b1-ustawa-pl","block":1,"topic":"Podstawy prawne","kind":"ref","scope":"podstawowy","adrRef":"Dz.U. 2011 nr 227 poz. 1367","source":"kompendium","page":1,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"W Polsce obowiązuje Ustawa o przewozie towarów niebezpiecznych z 19.08.2011 (Dz.U. 2011 nr 227 poz. 1367).","q":{"mcq":{"prompt":"Polska ustawa regulująca przewóz towarów niebezpiecznych pochodzi z roku:","options":["2005","2011","2019"],"correct":"2011"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-ustawa-pl@adr-2025"},{"id":"b1-wartosc-energetyczna","block":1,"topic":"Wyłączenia w praktyce","kind":"ref","scope":"podstawowy","adrRef":"ADR 1.1.3.2 uwaga 1","source":"kompendium","page":9,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match"],"why":"Wartości energetyczne paliw: olej napędowy 36 MJ/l, benzyna silnikowa 32 MJ/l, gaz ziemny/biogaz 35 MJ/Nm3, LPG 24 MJ/l, etanol 21 MJ/l, olej napędowy bio 33 MJ/l, paliwo emulsyjne 32 MJ/l, wodór 11 MJ/Nm3.","q":{"match":{"prompt":"Dopasuj paliwo do wartości energetycznej:","pairs":{"Olej napędowy":"36 MJ/l","Benzyna silnikowa":"32 MJ/l","LPG":"24 MJ/l","Wodór":"11 MJ/Nm3"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-wartosc-energetyczna@adr-2025"},{"id":"b1-waznosc","block":1,"topic":"Zakres uprawnień","kind":"fact","scope":"podstawowy","adrRef":"ADR 8.2.2.8","source":"kompendium","page":13,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","fill"],"why":"Zaświadczenie o przeszkoleniu kierowcy wydaje się na okres 5 lat. W ostatnim roku ważności można je przedłużyć na kolejny okres.","q":{"mcq":{"prompt":"Zaświadczenie ADR wydaje się na okres:","options":["3 lata","5 lat","10 lat"],"correct":"5 lat"},"fill":{"prompt":"Zaświadczenie ADR można przedłużyć w ___ roku jego ważności.","correct":"ostatnim","hint":"którym"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-waznosc@adr-2025"},{"id":"b1-wejscie-przepisow","block":1,"topic":"Podstawy prawne","kind":"fact","scope":"podstawowy","adrRef":"ADR 1.6","source":"kompendium","page":1,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","fill"],"why":"Nowe przepisy ADR wchodzą zawsze 1 stycznia w roku nieparzystym. Do końca czerwca obowiązuje okres przejściowy — można używać starej lub nowej wersji.","q":{"mcq":{"prompt":"Kiedy wchodzą w życie nowe przepisy ADR?","options":["1 stycznia roku parzystego","1 stycznia roku nieparzystego","1 lipca każdego roku"],"correct":"1 stycznia roku nieparzystego"},"fill":{"prompt":"Okres przejściowy pozwalający używać starej wersji przepisów trwa do końca ___ (miesiąc).","correct":"czerwca","hint":"miesiąc, dopełniacz"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-wejscie-przepisow@adr-2025"},{"id":"b1-zakres-podstawowy","block":1,"topic":"Zakres uprawnień","kind":"skill","scope":"podstawowy","adrRef":"ADR 8.2.1","source":"kompendium","page":13,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"ADR podstawowy pozwala przewozić wszystkie klasy poza 1 i 7 w sztukach przesyłki oraz luzem, a także w cysternach stałych i odejmowalnych do 1000 l i kontenerach-cysternach do 3000 l. Taki przewóz NIE wymaga świadectwa dopuszczenia pojazdu (\"czerwonego paska\").","q":{"mcq":{"prompt":"ADR podstawowy pozwala przewozić w cysternach stałych o pojemności do:","options":["500 l","1000 l","3000 l"],"correct":"1000 l"},"scenario":{"prompt":"Masz ADR podstawowy. Kontener-cysterna 2500 l z olejem napędowym — możesz?","options":["Nie, potrzeba kursu cysterny","Tak, kontenery-cysterny do 3000 l są w zakresie podstawowym","Tylko z eskorta"],"correct":"Tak, kontenery-cysterny do 3000 l są w zakresie podstawowym"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-zakres-podstawowy@adr-2025"},{"id":"b1-zaladowca","block":1,"topic":"Uczestnicy przewozu","kind":"fact","scope":"podstawowy","adrRef":"ADR 1.4.3.1","source":"kompendium","page":28,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Załadowca to ten, kto UMIESZCZA zapakowany towar (sztuki przesyłki, kontenery) NA pojazd — nie mylić z napełniającym (ten napełnia cysterny) ani z pakującym (ten wkłada towar do opakowań). Załadowca: przekazuje do przewozu tylko towar dopuszczony, sprawdza czy opakowania nie są uszkodzone, przestrzega zakazów ładowania razem (segregacja) i zasad mocowania. Haczyk: załadowca patrzy na STAN opakowania i zgodność załadunku, a nie klasyfikuje towaru (to nadawca).","q":{"mcq":{"prompt":"Kto odpowiada za przestrzeganie zakazów ładowania razem (segregacji) przy załadunku sztuk przesyłki?","options":["Nadawca","Załadowca","Odbiorca"],"correct":"Załadowca"},"scenario":{"prompt":"Widzisz uszkodzone opakowanie w chwili umieszczania go na pojeździe. Czyj to obowiązek nie przyjąć takiej sztuki do załadunku?","options":["Nadawcy","Załadowcy","Odbiorcy"],"correct":"Załadowcy"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-zaladowca@adr-2025"},{"id":"b1-zaswiadczenie-wydanie","block":1,"topic":"Zakres uprawnień","kind":"fact","scope":"podstawowy","adrRef":"ADR 8.2.2.8 / ustawa PL","source":"kompendium","page":13,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Po zdanym egzaminie marszałek wydaje zaświadczenie ADR (plastikowa karta) w ciągu 14 dni; w praktyce dociera pocztą w 1-3 tygodnie. Ważność 5 lat. Żeby przedłużyć, w ostatnim roku ważności robisz kurs doskonalący i ponownie zdajesz egzamin, zanim dokument wygaśnie.","q":{"mcq":{"prompt":"Kto wydaje zaświadczenie ADR po zdanym egzaminie?","options":["Akredytowany osrodek szkolenia","Marszałek województwa","Transportowy Dozór Techniczny"],"correct":"Marszałek województwa"},"scenario":{"prompt":"Twoje zaświadczenie ADR wygasa za 8 miesięcy. Co robisz, żeby zachować ciągłość?","options":["Czekam aż wygaśnie i robie kurs od nowa","W ostatnim roku ważności kurs doskonalący + egzamin, zanim wygaśnie","Nic — odnawia się samo"],"correct":"W ostatnim roku ważności kurs doskonalący + egzamin, zanim wygaśnie"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b1-zaswiadczenie-wydanie@adr-2025"},{"id":"b2-grupy-pakowania","block":2,"topic":"Klasyfikacja","kind":"fact","scope":"podstawowy","adrRef":"ADR 2.1.1.3","source":"kompendium","page":2,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","match"],"why":"Grupy pakowania określają natężenie zagrożenia dominującego: I — zagrożenie duże, II — średnie, III — małe. Grup pakowania NIE MAJĄ klasy 1, 2, 5.2, 6.2, 7 oraz przedmioty.","q":{"mcq":{"prompt":"Które klasy NIE mają grup pakowania?","options":["Tylko 2 i 7","1, 2, 5.2, 6.2, 7 oraz przedmioty","Tylko 1 i 7"],"correct":"1, 2, 5.2, 6.2, 7 oraz przedmioty"},"match":{"prompt":"Dopasuj grupę pakowania do natężenia zagrożenia:","pairs":{"I":"duże","II":"średnie","III":"małe"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-grupy-pakowania@adr-2025"},{"id":"b2-ino","block":2,"topic":"Klasyfikacja","kind":"fact","scope":"podstawowy","adrRef":"ADR 3.1.2.8","source":"kompendium","page":2,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Litery I.N.O. po nazwie oznaczają \"inaczej nie określony\". Wymaga się wtedy uzupełnienia o nazwy techniczne, np. UN 1964 WĘGLOWODORY GAZOWE, MIESZANINA SPRĘŻONA I.N.O (zawiera wodór i argon) 2.1 (B/D).","q":{"mcq":{"prompt":"Skrót I.N.O. po nazwie przewozowej oznacza:","options":["Inaczej nie określony","Instrukcja nadawcy obowiązkowa","Ilość nieograniczona"],"correct":"Inaczej nie określony"},"scenario":{"prompt":"W dokumencie widzisz UN 1964 ... I.N.O. Czego wymaga taki zapis?","options":["Nic dodatkowego","Uzupełnienia o nazwy techniczne składników","Zgody TDT"],"correct":"Uzupełnienia o nazwy techniczne składników"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-ino@adr-2025"},{"id":"b2-klasa3-temp","block":2,"topic":"Klasy zagrożeń","kind":"fact","scope":"podstawowy","adrRef":"ADR 2.2.3","source":"kompendium","page":3,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","fill"],"why":"Klasa 3 — materiały ciekłe zapalne o temperaturze zapłonu nie wyższej niż 60 stopni C, np. UN 1202, UN 1203. Uwaga: unikać zagłębień terenu.","q":{"mcq":{"prompt":"Temperatura zapłonu materiałów klasy 3 nie jest wyższa niż:","options":["23 st. C","60 st. C","100 st. C"],"correct":"60 st. C"},"fill":{"prompt":"Klasa 3 to materiały ciekłe zapalne o temperaturze zapłonu do ___ stopni C.","correct":"60","hint":"liczba"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-klasa3-temp@adr-2025"},{"id":"b2-klasa9-temp","block":2,"topic":"Klasy zagrożeń","kind":"fact","scope":"podstawowy","adrRef":"ADR 2.2.9","source":"kompendium","page":4,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","match"],"why":"Klasa 9 obejmuje m.in. azbest (wdychany w postaci drobnego pyłu), materiały w podwyższonej temperaturze — stałe powyżej 240 st. C, ciekłe powyżej 100 st. C, akumulatory litowe, przedmioty ratownicze, materiały zagrażające środowisku wodnemu.","q":{"mcq":{"prompt":"Materiał ciekły klasy 9 w podwyższonej temperaturze to powyżej:","options":["60 st. C","100 st. C","240 st. C"],"correct":"100 st. C"},"match":{"prompt":"Dopasuj stan skupienia do progu podwyższonej temperatury:","pairs":{"Stały":"powyżej 240 st. C","Ciekły":"powyżej 100 st. C"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-klasa9-temp@adr-2025"},{"id":"b2-klasyfikacja-kto","block":2,"topic":"Klasyfikacja","kind":"ref","scope":"podstawowy","adrRef":"ADR czesc 2","source":"kompendium","page":2,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","match"],"why":"Za klasyfikację odpowiada PRODUCENT, NADAWCA oraz Instytut Przemysłu Organicznego (IPO). Dla klasy 7 — Państwowa Agencja Atomistyki (PAA).","q":{"mcq":{"prompt":"Kto odpowiada za klasyfikację materiałów promieniotwórczych (klasa 7)?","options":["IPO","Państwowa Agencja Atomistyki","TDT"],"correct":"Państwowa Agencja Atomistyki"},"match":{"prompt":"Dopasuj odpowiedzialność za klasyfikację:","pairs":{"Klasy 1-9 (poza 7)":"producent, nadawca, IPO","Klasa 7":"Państwowa Agencja Atomistyki"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-klasyfikacja-kto@adr-2025"},{"id":"b2-kod-opakowania-xyz","block":2,"topic":"Odczyt opakowania","kind":"skill","scope":"podstawowy","adrRef":"ADR 6.1.2","source":"kompendium","page":8,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","mcq"],"why":"Litera na drugim miejscu kodu opakowania wskazuje, dla której grupy pakowania może być użyte: X — dla I, II, III GP; Y — dla II, III GP; Z — tylko dla III GP.","q":{"match":{"prompt":"Dopasuj literę kodu opakowania do grup pakowania:","pairs":{"X":"I, II, III GP","Y":"II, III GP","Z":"III GP"}},"mcq":{"prompt":"Opakowanie z litera Y może być użyte dla grup pakowania:","options":["Tylko I","II i III","Wszystkich"],"correct":"II i III"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-kod-opakowania-xyz@adr-2025"},{"id":"b2-nalepka-9a","block":2,"topic":"Klasy zagrożeń","kind":"ref","scope":"podstawowy","adrRef":"ADR 5.2.2.2","source":"kompendium","page":4,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Nalepka 9A jest stosowana dla numerów UN 3090, UN 3091, UN 3480, UN 3481 — ogniwa i akumulatory litowe.","q":{"mcq":{"prompt":"Nalepka 9A jest stosowana dla:","options":["Azbestu","Ogniw i akumulatorów litowych (UN 3090, 3091, 3480, 3481)","Suchego lodu"],"correct":"Ogniw i akumulatorów litowych (UN 3090, 3091, 3480, 3481)"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-nalepka-9a@adr-2025"},{"id":"b2-nalepka-wymiary","block":2,"topic":"Odczyt opakowania","kind":"ref","scope":"podstawowy","adrRef":"ADR 5.2.2.2","source":"kompendium","page":7,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Nalepka wskazująca zagrożenie na sztuce przesyłki ma rozmiar 100 mm x 100 mm. Może być więcej niż jedna — zagrożenie dominujące i dodatkowe.","q":{"mcq":{"prompt":"Rozmiar nalepki ostrzegawczej na sztuce przesyłki:","options":["100 x 100 mm","250 x 250 mm","300 x 400 mm"],"correct":"100 x 100 mm"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-nalepka-wymiary@adr-2025"},{"id":"b2-nie-podlega-adr","block":2,"topic":"Klasy zagrożeń","kind":"fact","scope":"podstawowy","adrRef":"ADR 3.3 SP 188","source":"kompendium","page":4,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","scenario"],"why":"Nie podlegają ADR: akumulatory i ogniwa litowe wg przepisu 188, pojazdy poddane fumigacji (zagrożenie uduszeniem), czynniki chłodzące np. UN 1845 suchy lód (zagrożenie uduszeniem).","q":{"match":{"prompt":"Dopasuj towar do jego statusu:","pairs":{"Akumulatory litowe wg przepisu 188":"nie podlega ADR","Suchy lód UN 1845":"nie podlega ADR","Jednostka poddana fumigacji":"nie podlega ADR"}},"scenario":{"prompt":"Wieziesz suchy lód (UN 1845) jako czynnik chłodzący. Jakie zagrożenie główne?","options":["Pożar","Uduszenie","Zatrucie"],"correct":"Uduszenie"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-nie-podlega-adr@adr-2025"},{"id":"b2-numer-cyfry","block":2,"topic":"Odczyt tablicy","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.3.2.3","source":"kompendium","page":18,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","mcq"],"why":"Cyfry numeru rozpoznawczego zagrożenia: 2 — emisja gazu spowodowana ciśnieniem lub reakcja chemiczna, 3 — zapalność materiałów ciekłych i gazów, 4 — zapalność materiałów stałych, 5 — działanie utleniające, 6 — działanie trujące lub ryzyko zakażenia, 7 — działanie promieniotwórcze, 8 — działanie żrące, 9 — ryzyko samorzutnej i gwałtownej reakcji.","q":{"match":{"prompt":"Dopasuj cyfrę numeru zagrożenia do znaczenia:","pairs":{"2":"emisja gazu","3":"zapalność cieczy","5":"działanie utleniające","8":"działanie żrące"}},"mcq":{"prompt":"Cyfra 9 w numerze rozpoznawczym zagrożenia oznacza:","options":["Działanie żrące","Ryzyko samorzutnej i gwałtownej reakcji","Emisje gazu"],"correct":"Ryzyko samorzutnej i gwałtownej reakcji"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-numer-cyfry@adr-2025"},{"id":"b2-numer-podwojenie","block":2,"topic":"Odczyt tablicy","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.3.2.3","source":"kompendium","page":17,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Powtórzenie cyfry wskazuje na nasilenie oznaczonego ta cyfra zagrożenia, np. 33 = materiał łatwo zapalny ciekły (temperatura zapłonu niższa niż 23 st. C).","q":{"mcq":{"prompt":"Powtórzenie cyfry w numerze rozpoznawczym oznacza:","options":["Dwa różne zagrożenia","Nasilenie zagrożenia","Brak zagrożenia dodatkowego"],"correct":"Nasilenie zagrożenia"},"scenario":{"prompt":"Tablica 33/1203. Co oznacza 33?","options":["Materiał zapalny o temp. zapłonu 23-60 st. C","Materiał łatwo zapalny ciekły, temp. zapłonu poniżej 23 st. C","Gaz palny"],"correct":"Materiał łatwo zapalny ciekły, temp. zapłonu poniżej 23 st. C"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-numer-podwojenie@adr-2025"},{"id":"b2-numer-x","block":2,"topic":"Odczyt tablicy","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.3.2.3","source":"kompendium","page":17,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Litera X przed numerem rozpoznawczym zagrożenia oznacza niebezpieczna reakcje z wodą. Woda może być stosowana jedynie za zgoda specjalistów. UWAGA: nie mylić z X w kodzie opakowania, który określa mocne opakowanie do I, II, III grupy pakowania.","q":{"mcq":{"prompt":"Litera X przed numerem rozpoznawczym zagrożenia oznacza:","options":["Materiał wybuchowy","Niebezpieczna reakcje z wodą","Mocne opakowanie"],"correct":"Niebezpieczna reakcje z wodą"},"scenario":{"prompt":"Na tablicy widzisz X423. Czy można gasić wodą?","options":["Tak, zawsze","Tylko za zgoda specjalistów","Woda jest zalecana"],"correct":"Tylko za zgoda specjalistów"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-numer-x@adr-2025"},{"id":"b2-numer-zero","block":2,"topic":"Odczyt tablicy","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.3.2.3","source":"kompendium","page":17,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Jeśli w numerze rozpoznawczym zagrożenia występuje 0 (zero), to zawsze na drugiej pozycji. Oznacza, ze NIE ma zwiększenia zagrożenia ani zagrożenia dodatkowego, a towar zwykle należy do II lub III grupy pakowania. Nie dotyczy gazów.","q":{"mcq":{"prompt":"Zero na drugim miejscu numeru rozpoznawczego oznacza:","options":["Nasilenie zagrożenia","Brak zwiększenia zagrożenia i zagrożenia dodatkowego","Reakcje z wodą"],"correct":"Brak zwiększenia zagrożenia i zagrożenia dodatkowego"},"scenario":{"prompt":"Numer 30 na tablicy. Do której grupy pakowania zwykle należy taki towar?","options":["I","II lub III","Nie ma grupy pakowania"],"correct":"II lub III"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-numer-zero@adr-2025"},{"id":"b2-numery-przyklady","block":2,"topic":"Odczyt tablicy","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.3.2.3","source":"kompendium","page":18,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","scenario"],"why":"Przykłady odczytu: 20 = gaz duszący lub niestwarzający zagrożenia dodatkowego, 23 = gaz palny, 26 = gaz trujący, 30 = materiał zapalny ciekły (23-60 st. C), 33 = materiał łatwo zapalny ciekły (poniżej 23 st. C), 80 = materiał żrący lub słabo żrący, 88 = materiał silnie żrący.","q":{"match":{"prompt":"Dopasuj numer rozpoznawczy do znaczenia:","pairs":{"20":"gaz duszący","23":"gaz palny","80":"materiał żrący","88":"materiał silnie żrący"}},"scenario":{"prompt":"Cysterna z tablica 33 / 1203 przewozi:","options":["Chlor","Benzynę","Azotan amonu"],"correct":"Benzynę"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-numery-przyklady@adr-2025"},{"id":"b2-numery-specjalne","block":2,"topic":"Odczyt tablicy","kind":"ref","scope":"podstawowy","adrRef":"ADR 5.3.2.3","source":"kompendium","page":17,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match"],"why":"Następujące zestawienia cyfr mają znaczenie specjalne: 22, 323, 333, 362, 382, 423, 44, 446, 462, 482, 539, 606, 623, 642, 823, 842, 90 i 99. Przykłady: 90 = materiał zagrażający środowisku, 99 = różne materiały niebezpieczne przewożone w podwyższonej temperaturze, 333 = materiał piroforyczny ciekły, 606 = materiał zakaźny.","q":{"match":{"prompt":"Dopasuj numer specjalny do znaczenia:","pairs":{"90":"zagrażający środowisku","99":"podwyższona temperatura","333":"piroforyczny ciekły","606":"materiał zakaźny"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-numery-specjalne@adr-2025"},{"id":"b2-opakowania-waznosc","block":2,"topic":"Odczyt opakowania","kind":"skill","scope":"podstawowy","adrRef":"ADR 4.1.1.15","source":"kompendium","page":7,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","fill"],"why":"W większości wypadków (DPPL, kanistry, bębny) opakowania mogą być używane przez 5 lat od daty produkcji. Po 2,5 roku powinno być przeprowadzone badanie. Data produkcji zapisana jako cyfry miesiąca i roku, np. 07 21 = lipiec 2021, używany do lipca 2026.","q":{"mcq":{"prompt":"Przez ile lat od daty produkcji można używać DPPL?","options":["2,5 roku","5 lat","10 lat"],"correct":"5 lat"},"fill":{"prompt":"Po ___ roku (liczba) od produkcji opakowania powinno być przeprowadzone badanie.","correct":"2,5","hint":"liczba z przecinkiem"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-opakowania-waznosc@adr-2025"},{"id":"b2-overpack","block":2,"topic":"Odczyt opakowania","kind":"fact","scope":"podstawowy","adrRef":"ADR 5.1.2","source":"kompendium","page":7,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Jeśli używamy opakowania zbiorczego (skrzyni, klatki, palety) i nalepki lub numery UN nie są widoczne na zewnątrz, należy je ponowić. Gdy w opakowaniu są 2 rodzaje towaru (np. klasy 3 i 8), na zewnątrz muszą być wszystkie wzory nalepek (3 i 8). Jeśli nalepka jest ta sama dla wszystkich opakowań, wystarczy na palecie 1 nalepka. Należy umieścić napis OPAKOWANIE ZBIORCZE — OVERPACK (język kraju nadania i angielski lub niemiecki lub francuski).","q":{"mcq":{"prompt":"Napis na opakowaniu zbiorczym to:","options":["ZBIORCZE","OPAKOWANIE ZBIORCZE - OVERPACK","PALETA ADR"],"correct":"OPAKOWANIE ZBIORCZE - OVERPACK"},"scenario":{"prompt":"Paleta z towarami klasy 3 i klasy 8, nalepki niewidoczne. Co na zewnątrz?","options":["Tylko nalepka 3","Wszystkie wzory nalepek: 3 i 8","Żadna"],"correct":"Wszystkie wzory nalepek: 3 i 8"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-overpack@adr-2025"},{"id":"b2-oznakowanie-sztuki","block":2,"topic":"Odczyt opakowania","kind":"fact","scope":"podstawowy","adrRef":"ADR 5.2","source":"kompendium","page":7,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","match"],"why":"Na każdej sztuce przesyłki musi znajdować się: numer UN przewożonego towaru, znak certyfikacji opakowania (symbol ONZ — litery \"un\" w kołku), nalepka wskazująca zagrożenie (100x100 mm), prawidłowa nazwa przewozowa (dla klas 1, 2, 7), strzałki kierunkowe nr 11 dla opakowań z naczyniami wewnętrznymi z materiałami ciekłymi.","q":{"mcq":{"prompt":"Prawidłowa nazwa przewozowa na sztuce przesyłki jest wymagana dla klas:","options":["Wszystkich","1, 2 i 7","Tylko 3 i 8"],"correct":"1, 2 i 7"},"match":{"prompt":"Dopasuj element oznakowania sztuki przesyłki:","pairs":{"Numer UN":"identyfikacja towaru","Symbol ONZ (un w kołku)":"certyfikacja opakowania","Strzalki kierunkowe nr 11":"naczynia wewnętrzne z cieczami"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-oznakowanie-sztuki@adr-2025"},{"id":"b2-pietrowanie","block":2,"topic":"Odczyt opakowania","kind":"fact","scope":"podstawowy","adrRef":"ADR 6.5.2.2.2","source":"kompendium","page":8,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Piętrowanie towarów niebezpiecznych jest dopuszczone, jeśli odpowiednie oznakowanie na opakowaniu wskazuje na taka możliwość (rys. 6.5.2.2.2.1 — DPPL przeznaczony do spietrzania, z podanym max obciążeniem w kg; rys. 6.5.2.2.2.2 — DPPL NIE przeznaczony do spietrzania).","q":{"mcq":{"prompt":"Czy można piętrować DPPL?","options":["Zawsze","Tylko jeśli oznakowanie na opakowaniu na to wskazuje","Nigdy"],"correct":"Tylko jeśli oznakowanie na opakowaniu na to wskazuje"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-pietrowanie@adr-2025"},{"id":"b2-podklasy2","block":2,"topic":"Klasy zagrożeń","kind":"fact","scope":"podstawowy","adrRef":"ADR 2.2.2","source":"kompendium","page":3,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match"],"why":"Klasa 2 (gazy): 2.1 gazy palne, 2.2 gazy niepalne i nietrujące (mogą być duszące), 2.3 gazy trujące. Zagrożenie dominujące: wysokie ciśnienie, emisja gazu, odmrożenia, wybuch przy ogrzaniu.","q":{"match":{"prompt":"Dopasuj podklasę gazu:","pairs":{"2.1":"gazy palne","2.2":"niepalne i nietrujące","2.3":"gazy trujące"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-podklasy2@adr-2025"},{"id":"b2-podklasy4","block":2,"topic":"Klasy zagrożeń","kind":"fact","scope":"podstawowy","adrRef":"ADR 2.2.41-43","source":"kompendium","page":3,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","mcq"],"why":"Klasa 4: 4.1 materiały zapalne stałe, samoreaktywne, polimeryzujące i wybuchowe odczulone stałe; 4.2 materiały podatne na samozapalenie (piroforyczne, tytan, rozdrobnione metale, fosfor biały); 4.3 materiały wytwarzające w zetknięciu z wodą gazy palne — muszą być przewożone w pojazdach zamkniętych.","q":{"match":{"prompt":"Dopasuj podklasę klasy 4:","pairs":{"4.1":"zapalne stałe, samoreaktywne","4.2":"podatne na samozapalenie","4.3":"wytwarzają z wodą gazy palne"}},"mcq":{"prompt":"Materiały klasy 4.3 muszą być przewożone:","options":["W pojazdach otwartych","W pojazdach zamkniętych","Tylko w cysternach"],"correct":"W pojazdach zamkniętych"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-podklasy4@adr-2025"},{"id":"b2-podklasy5","block":2,"topic":"Klasy zagrożeń","kind":"fact","scope":"podstawowy","adrRef":"ADR 2.2.51-52","source":"kompendium","page":4,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","mcq"],"why":"Klasa 5: 5.1 materiały utleniające — wzmagają palenie, same nie muszą się palić, nie mieszać z materiałami zapalnymi (np. trocinami); 5.2 nadtlenki organiczne typu A-F, niektóre mogą być wybuchowe.","q":{"match":{"prompt":"Dopasuj podklasę klasy 5:","pairs":{"5.1":"utleniające (wzmagają palenie)","5.2":"nadtlenki organiczne"}},"mcq":{"prompt":"Z czym NIE wolno mieszać materiałów utleniających (5.1)?","options":["Z wodą","Z materiałami zapalnymi, np. trocinami","Z piaskiem"],"correct":"Z materiałami zapalnymi, np. trocinami"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-podklasy5@adr-2025"},{"id":"b2-podklasy6","block":2,"topic":"Klasy zagrożeń","kind":"fact","scope":"podstawowy","adrRef":"ADR 2.2.61-62","source":"kompendium","page":4,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match","mcq"],"why":"Klasa 6: 6.1 materiały trujące — zagrożenie śmiertelnym zatruciem przez połknięcie, wdychanie lub przez skórę; 6.2 materiały zakaźne — odpady medyczne, kliniczne, szpitalne, wirusy, bakterie, priony. UWAGA: NIE występują jednocześnie zakaźne i trujące.","q":{"match":{"prompt":"Dopasuj podklasę klasy 6:","pairs":{"6.1":"trujące","6.2":"zakaźne"}},"mcq":{"prompt":"Czy może wystąpić materiał jednocześnie zakaźny i trujący?","options":["Tak, często","Nie — takie połączenie nie występuje","Tylko w klasie 9"],"correct":"Nie — takie połączenie nie występuje"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-podklasy6@adr-2025"},{"id":"b2-tablice-gladkie","block":2,"topic":"Odczyt tablicy","kind":"fact","scope":"podstawowy","adrRef":"ADR 5.3.2","source":"kompendium","page":17,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","fill"],"why":"Tablice odblaskowe pomarańczowe mają wymiary 300 x 400 mm (+/- 10%) z czarna ramka o szerokości 15 mm. Tablice powinny przetrwać w pożarze 15 minut. Dopuszcza się tablice 300 x 120 mm (obramowanie 10 mm) w pojazdach bez miejsca na standardowa, np. osobowych. Tablic gładkich używa się zwykle przy przewozie w sztukach przesyłki.","q":{"mcq":{"prompt":"Wymiary standardowej tablicy pomarańczowej to:","options":["250 x 250 mm","300 x 400 mm","400 x 400 mm"],"correct":"300 x 400 mm"},"fill":{"prompt":"Tablica pomarańczowa powinna przetrwać w pożarze ___ minut.","correct":"15","hint":"liczba"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-tablice-gladkie@adr-2025"},{"id":"b2-tablice-ramka","block":2,"topic":"Odczyt tablicy","kind":"ref","scope":"podstawowy","adrRef":"ADR 5.3.2.2.1","source":"kompendium","page":17,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match"],"why":"Tablica standardowa 300 x 400 mm ma czarna ramkę o szerokości 15 mm. Tablica mała 300 x 120 mm ma obramowanie 10 mm.","q":{"match":{"prompt":"Dopasuj rozmiar tablicy do szerokości ramki:","pairs":{"300 x 400 mm":"ramka 15 mm","300 x 120 mm":"ramka 10 mm"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-tablice-ramka@adr-2025"},{"id":"b2-temp-kontrolowana","block":2,"topic":"Klasy zagrożeń","kind":"fact","scope":"podstawowy","adrRef":"ADR 7.1.7","source":"kompendium","page":4,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Klasy 4.1 i 5.2 mogą wymagać temperatury kontrolowanej podczas przewozu (reakcja egzotermiczna). Wymagana jest możliwość sprawdzenia temperatury oraz procedura postępowania. Termometr z 2 czujnikami. Temperaturę sprawdza się co 4-6 h i rejestruje. Należy określić procedury na wypadek utraty możliwości utrzymania temperatury.","q":{"mcq":{"prompt":"Co ile godzin sprawdza się temperaturę przy przewozie w temperaturze kontrolowanej?","options":["Co 1-2 h","Co 4-6 h","Co 12 h"],"correct":"Co 4-6 h"},"scenario":{"prompt":"Przewozisz nadtlenek organiczny w temperaturze kontrolowanej. Ile czujników ma termometr?","options":["1","2","4"],"correct":"2"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-temp-kontrolowana@adr-2025"},{"id":"b2-un-pozycje","block":2,"topic":"Klasyfikacja","kind":"fact","scope":"podstawowy","adrRef":"ADR 3.1.2","source":"kompendium","page":2,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","match","scenario"],"why":"Numer UN (nazywany też numerem ONZ) to czterocyfrowy numer rozpoznawczy. Może być przypisany do JEDNEJ substancji, np. UN 1090 ACETON, albo do POZYCJI GRUPOWEJ — kilku towarów o podobnych właściwościach, np. UN 1263 FARBA.","q":{"mcq":{"prompt":"UN 1263 FARBA to przykład:","options":["Jednej substancji","Pozycji grupowej","Numeru zagrożenia"],"correct":"Pozycji grupowej"},"match":{"prompt":"Dopasuj numer UN do typu pozycji:","pairs":{"UN 1090 ACETON":"jedna substancja","UN 1263 FARBA":"pozycja grupowa"}},"scenario":{"prompt":"Numer UN nazywany jest również numerem:","options":["Kemlera","ONZ","rozpoznawczym zagrożenia"],"correct":"ONZ"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-un-pozycje@adr-2025"},{"id":"b2-zagrozenie-dodatkowe","block":2,"topic":"Klasyfikacja","kind":"fact","scope":"podstawowy","adrRef":"ADR 2.1.1.2","source":"kompendium","page":2,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","match"],"why":"Zagrożenie dodatkowe określane jest kodem literowym, np. F — palne, T — trujące. Jest to DRUGA nalepka w dokumencie przewozowym (kod klasyfikacyjny).","q":{"mcq":{"prompt":"Litera F w kodzie klasyfikacyjnym oznacza:","options":["Palne","Trujące","Żrące"],"correct":"Palne"},"match":{"prompt":"Dopasuj kod literowy do zagrożenia:","pairs":{"F":"palne","T":"trujące"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-zagrozenie-dodatkowe@adr-2025"},{"id":"b2-zagrozenie-dominujace","block":2,"topic":"Klasyfikacja","kind":"fact","scope":"podstawowy","adrRef":"ADR 2.1.3.10","source":"kompendium","page":2,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Zagrożenie dominujące przypisuje towar do jednej z 13 klas (licząc podklasy osobno) — jest to PIERWSZA nalepka. Nazwę klasy można znaleźć powyżej każdej z nalepek w instrukcji pisemnej. Klasa 2 (gazy) ma kilka nalepek.","q":{"mcq":{"prompt":"Zagrożenie dominujące określa:","options":["Druga nalepkę w dokumencie","Pierwsza nalepkę — przypisanie do klasy","Grupę pakowania"],"correct":"Pierwsza nalepkę — przypisanie do klasy"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b2-zagrozenie-dominujace@adr-2025"},{"id":"b3-numer-zagrozenia-90","block":3,"topic":"Materiały zagrażające środowisku","kind":"fact","scope":"podstawowy","adrRef":"ADR 5.3.2.3","source":"adr-2025","page":null,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","fill"],"why":"Numer rozpoznawczy zagrożenia (górny numer na tablicy pomarańczowej) dla materiałów zagrażających środowisku UN 3077 i UN 3082 to 90. Należy do znaczeń specjalnych.","q":{"mcq":{"prompt":"Jaki numer rozpoznawczy zagrożenia mają materiały zagrażające środowisku UN 3077 i UN 3082?","options":["90","99","X80"],"correct":"90"},"fill":{"prompt":"Numer rozpoznawczy zagrożenia dla materiału zagrażającego środowisku (UN 3077 / 3082) to ___.","correct":"90","hint":"dwie cyfry, znaczenie specjalne"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b3-numer-zagrozenia-90"},{"id":"b3-obowiazek-srodowisko","block":3,"topic":"Obowiązek ochrony środowiska","kind":"fact","scope":"podstawowy","adrRef":"ADR 1.4.1 / 7.5.1","source":"adr-2025","page":null,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Każdy uczestnik przewozu ma obowiązek podejmować środki zapobiegające szkodzie w środowisku podczas przewozu, załadunku i rozładunku. To ogólna zasada — niezależnie od tego, czy doszło do wycieku.","q":{"mcq":{"prompt":"Kiedy kierowca ma obowiązek chronić środowisko przed skażeniem towarem niebezpiecznym?","options":["Przez cały czas przewozu, załadunku i rozładunku","Tylko po wycieku","Tylko przy materialach klasy 9"],"correct":"Przez cały czas przewozu, załadunku i rozładunku"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b3-obowiazek-srodowisko"},{"id":"b3-odpady-dokument","block":3,"topic":"Odpady","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.4.1.1.3","source":"kompendium","page":12,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Słowo ODPAD powinno się znaleźć po numerze UN, np. UN 1230 odpad metanol 3 (6.1) II, (D/E).","q":{"mcq":{"prompt":"Gdzie w dokumencie przewozowym umieszcza się słowo ODPAD?","options":["Na końcu zapisu","Po numerze UN, przed nazwa","W osobnej rubryce"],"correct":"Po numerze UN, przed nazwa"},"scenario":{"prompt":"Prawidłowy zapis odpadu w dokumencie to:","options":["UN 1230 metanol odpad","UN 1230 odpad metanol 3 (6.1) II, (D/E)","odpad UN 1230 metanol"],"correct":"UN 1230 odpad metanol 3 (6.1) II, (D/E)"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b3-odpady-dokument@adr-2025"},{"id":"b3-odpady-klasyfikacja","block":3,"topic":"Odpady","kind":"fact","scope":"podstawowy","adrRef":"ADR 2.1.3 / 5.4.1.1.3","source":"adr-2025","page":null,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Odpad podlega ADR, jeśli spełnia kryteria którejś z klas zagrożenia. W dokumencie przed nazwę wpisuje się słowo ODPAD (np. UN 1230 ODPAD METANOL). Za klasyfikację odpowiada nadawca/producent, a NIE kierowca.","q":{"mcq":{"prompt":"Kiedy odpad podlega przepisom ADR?","options":["Gdy spełnia kryteria którejś z klas zagrożenia ADR","Zawsze — każdy odpad","Nigdy — odpady są wyłączone z ADR"],"correct":"Gdy spełnia kryteria którejś z klas zagrożenia ADR"},"scenario":{"prompt":"Kto odpowiada za sklasyfikowanie odpadu jako towaru niebezpiecznego ADR?","options":["Nadawca / producent odpadu","Kierowca podczas załadunku","Odbiorca po dostawie"],"correct":"Nadawca / producent odpadu"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b3-odpady-klasyfikacja"},{"id":"b3-odpady-tablica","block":3,"topic":"Odpady","kind":"fact","scope":"podstawowy","adrRef":"przepisy krajowe","source":"kompendium","page":21,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","match"],"why":"Oznakowanie pojazdów przewożących ODPADY w Polsce zawiera tylko jedna tablice ODPADY 30 x 40 cm z przodu pojazdu. NIE jest wymagane przy przewozie odpadów sklasyfikowanych jako ADR. W transporcie międzynarodowym odpadów sklasyfikowanych jako ADR używamy oznakowania ADR i \"A\" z przodu i z tyłu jednostki (Niemcy, Austria, Czechy).","q":{"mcq":{"prompt":"Tablica ODPADY w Polsce ma wymiary i umieszczenie:","options":["30 x 40 cm, z przodu pojazdu","40 x 30 cm, z tyłu","30 x 40 cm, z obu stron"],"correct":"30 x 40 cm, z przodu pojazdu"},"match":{"prompt":"Dopasuj oznakowanie odpadów:","pairs":{"Polska":"tablica ODPADY 30x40 z przodu","Niemcy, Austria, Czechy":"znak \"A\" z przodu i tyłu"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b3-odpady-tablica@adr-2025"},{"id":"b3-srodowisko-wyciek","block":3,"topic":"Obowiązek ochrony środowiska","kind":"fact","scope":"podstawowy","adrRef":"ADR 1.4.1","source":"kompendium","page":22,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario","mcq"],"why":"Przy wycieku materiału zagrażającego środowisku kierowca ma, o ile to bezpieczne, ograniczyć skażenie: zatrzymać wyciek u źródła, nie dopuścić do przedostania się substancji do kanalizacji, rowów, cieków wodnych. Nie spłukiwać wodą do studzienek — to roznosi skażenie.","q":{"scenario":{"prompt":"Z pojazdu wycieka substancja szkodliwa dla środowiska w pobliżu kratki kanalizacyjnej. Co robisz?","options":["Spłukuję wodą do kratki","Zabezpieczam kratkę i tamuję wyciek, o ile to bezpieczne","Czekam aż wsiąknie w ziemię"],"correct":"Zabezpieczam kratkę i tamuję wyciek, o ile to bezpieczne"},"mcq":{"prompt":"Czego NIE wolno robić przy wycieku substancji groźnej dla środowiska?","options":["Tamować wycieku u źródła","Spłukiwać jej wodą do kanalizacji","Zabezpieczać studzienek"],"correct":"Spłukiwać jej wodą do kanalizacji"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b3-srodowisko-wyciek"},{"id":"b3-srodowisko-znak-ryba","block":3,"topic":"Obowiązek ochrony środowiska","kind":"fact","scope":"podstawowy","adrRef":"ADR 5.2.1.8","source":"kompendium","page":22,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Materiały zagrażające środowisku wodnemu oznacza się znakiem: ryba i drzewo (martwa ryba i uschnięte drzewo) na białym tle. Znak ostrzega, że substancja jest niebezpieczna dla organizmów wodnych i środowiska — wymaga szczególnej ostrożności przy wycieku.","q":{"mcq":{"prompt":"Jaki symbol oznacza materiał zagrażający środowisku wodnemu?","options":["Płomień","Martwa ryba i uschnięte drzewo","Czaszka"],"correct":"Martwa ryba i uschnięte drzewo"},"scenario":{"prompt":"Na sztuce przesyłki widzisz znak z rybą i drzewem. O czym Cię ostrzega?","options":["Towar łatwopalny","Towar groźny dla środowiska wodnego","Towar radioaktywny"],"correct":"Towar groźny dla środowiska wodnego"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b3-srodowisko-znak-ryba"},{"id":"b3-un-srodowisko","block":3,"topic":"Materiały zagrażające środowisku","kind":"fact","scope":"podstawowy","adrRef":"ADR 3.2.1","source":"kompendium","page":4,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["match"],"why":"Materiał zagrażający środowisku: stan stały UN 3077, stan ciekły UN 3082. Należą do klasy 9.","q":{"match":{"prompt":"Dopasuj stan skupienia do numeru UN:","pairs":{"Stały":"UN 3077","Ciekły":"UN 3082"}}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b3-un-srodowisko@adr-2025"},{"id":"b3-wyciek-sekwencja","block":3,"topic":"Reakcja na wyciek","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.4.3.4","source":"kompendium","page":22,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["order","scenario"],"why":"Kolejność przy wycieku (o ile bezpieczne): 1) zatrzymać pojazd w bezpiecznym miejscu i wyłączyć silnik, 2) zabezpieczyć teren i ostrzec innych, 3) ograniczyć wyciek u źródła i nie dopuścić do kanalizacji, 4) powiadomić służby (112) podając dane z tablicy. Życie ludzkie ma pierwszeństwo przed ochroną mienia i środowiska.","q":{"order":{"prompt":"Ułóż kolejność reakcji na wyciek:","items":["Ograniczyć wyciek u źródła","Zatrzymać pojazd i wyłączyć silnik","Powiadomić służby (112)","Zabezpieczyć teren i ostrzec innych"],"correct":["Zatrzymać pojazd i wyłączyć silnik","Zabezpieczyć teren i ostrzec innych","Ograniczyć wyciek u źródła","Powiadomić służby (112)"]},"scenario":{"prompt":"Zauważasz wyciek w trasie. Co jest bezwzględnie ważniejsze niż ratowanie ładunku?","options":["Zdążyć na rozładunek","Bezpieczeństwo ludzi","Uniknięcie mandatu"],"correct":"Bezpieczeństwo ludzi"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b3-wyciek-sekwencja"},{"id":"b3-wyciek-srodowisko","block":3,"topic":"Reakcja na wyciek","kind":"skill","scope":"podstawowy","adrRef":"ADR 5.4.3.4","source":"kompendium","page":27,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["scenario"],"why":"Jeżeli jest to właściwe i bezpieczne, zapobiec przedostaniu się uwolnionych materiałów do środowiska wodnego lub kanalizacji oraz zebrać uwolnione materiały, używając wyposażenia przewożonego w jednostce transportowej (osłona otworów kanalizacyjnych, łopata, pojemnik).","q":{"scenario":{"prompt":"Wyciek płynu w pobliżu studzienki kanalizacyjnej. Pierwsza reakcja:","options":["Spłukać woda do kanalizacji","Użyć osłony otworów kanalizacyjnych i zebrać materiał","Zostawić do wyschnięcia"],"correct":"Użyć osłony otworów kanalizacyjnych i zebrać materiał"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b3-wyciek-srodowisko@adr-2025"},{"id":"b3-znak-srodowisko","block":3,"topic":"Materiały zagrażające środowisku","kind":"fact","scope":"podstawowy","adrRef":"ADR 5.2.1.8.1","source":"kompendium","page":4,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","fill"],"why":"Znak wymagany dla materiałów zagrażających środowisku (ryba i drzewo). Umieszcza się go na opakowaniach większych niż 5 kg lub 5 litrów. Zagrożenie w przypadku przedostania się do środowiska wodnego lub kanalizacji.","q":{"mcq":{"prompt":"Znak \"ryba i drzewo\" umieszcza się na opakowaniach większych niż:","options":["1 kg lub 1 litr","5 kg lub 5 litrów","30 kg lub 30 litrów"],"correct":"5 kg lub 5 litrów"},"fill":{"prompt":"Znak materiału zagrażającego środowisku przedstawia rybę i ___.","correct":"drzewo","hint":"roslina"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b3-znak-srodowisko@adr-2025"},{"id":"b3-znak-temperatura","block":3,"topic":"Materiały zagrażające środowisku","kind":"fact","scope":"podstawowy","adrRef":"ADR 5.2.1.8.1","source":"kompendium","page":4,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Znak dla towarów w podwyższonej temperaturze (czerwony trójkąt z termometrem): materiały stałe powyżej 240 st. C, ciekłe powyżej 100 st. C. Zagrożenie poparzeniem. Wskazówka: unikać kontaktu z gorącymi częściami jednostki transportowej i z uwolnionym materiałem.","q":{"mcq":{"prompt":"Znak z termometrem w czerwonym trójkącie oznacza:","options":["Materiał zagrażający środowisku","Materiał w podwyższonej temperaturze","Materiał promieniotworczy"],"correct":"Materiał w podwyższonej temperaturze"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b3-znak-temperatura@adr-2025"},{"id":"b4-austria-eskorta","block":4,"topic":"Decyzja o tunelu","kind":"ref","scope":"podstawowy","adrRef":"wymogi krajowe","source":"kompendium","page":24,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"W niektórych krajach wymaga się dodatkowych wymogów, np. w Austrii jednostka transportową powinna być wyposażona w lampę o świetle pomarańczowym. Jednostki, których oznakowanie na tablicy rozpoczyna się od cyfry 2 lub zawierające podwojne cyfry 3, 4, 5, 6, 8 lub poprzedzone litera X wymagaja eskorty podczas przejazdu przez tunele.","q":{"mcq":{"prompt":"W Austrii jednostka transportową z ADR powinna być wyposażona w:","options":["Lampę o świetle pomarańczowym","Radio CB","Kamerę cofania"],"correct":"Lampę o świetle pomarańczowym"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-austria-eskorta@adr-2025"},{"id":"b4-certyfikat-pakowania","block":4,"topic":"Praca z dokumentem","kind":"ref","scope":"podstawowy","adrRef":"ADR 5.4.2","source":"kompendium","page":14,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Certyfikat pakowania kontenera/pojazdu wymagany jest przed załadunkiem, który poprzedza przewóz MORSKI. Może być elementem dokumentu MULTIMODAL DANGEROUS GOODS FORM lub DGN.","q":{"mcq":{"prompt":"Certyfikat pakowania kontenera wymagany jest przed przewozem:","options":["Drogowym","Morskim","Kolejowym"],"correct":"Morskim"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-certyfikat-pakowania@adr-2025"},{"id":"b4-cv2-plomien","block":4,"topic":"Decyzja o załadunku","kind":"fact","scope":"podstawowy","adrRef":"ADR CV2 / 7.5.11","source":"kompendium","page":24,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","scenario"],"why":"Przed dokonaniem załadunku powierzchnia ładunkowa pojazdu lub kontenera powinna zostać dokładnie oczyszczona. Zabrania się używania otwartego płomienia wewnątrz pojazdu lub kontenera oraz w ich pobliżu, a także podczas załadunku i rozładunku (przepis szczególny CV2 — 7.5.11).","q":{"mcq":{"prompt":"Przed załadunkiem powierzchnia ładunkowa powinna być:","options":["Sucha","Dokładnie oczyszczona","Wyłożona folia"],"correct":"Dokładnie oczyszczona"},"scenario":{"prompt":"Załadunek towaru ADR. Czy można używać otwartego płomienia w pobliżu pojazdu?","options":["Tak, poza kabina","Nie — zakaz wg CV2","Tylko przy klasie 9"],"correct":"Nie — zakaz wg CV2"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-cv2-plomien@adr-2025"},{"id":"b4-cv28-zywnosc","block":4,"topic":"Decyzja o załadunku","kind":"skill","scope":"podstawowy","adrRef":"ADR 7.5.4 / CV28","source":"kompendium","page":24,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq","match","scenario"],"why":"Jeżeli w kolumnie 18 tabeli wskazany jest przepis szczególny CV28, towar należy oddzielić od żywności lub karmy dla zwierząt: (a) ciągłymi przegrodami o wysokości nie mniejszej niż sztuki przesyłek oznaczone nalepkami 6.1, 6.2, 9; (b) sztukami przesyłek, które NIE są zaopatrzone w nalepki 6.1, 6.2, 9; (c) wolna przestrzenią o szerokości nie mniej niż 0,8 m lub przez całkowite przykrycie (plandeka, pokrywa z tektury). Dotyczy UN 2212, 2315, 2590, 3151, 3152, 3245.","q":{"mcq":{"prompt":"Minimalna szerokość wolnej przestrzeni oddzielającej towar od żywności (CV28):","options":["0,5 m","0,8 m","1,2 m"],"correct":"0,8 m"},"match":{"prompt":"Dopasuj sposób oddzielenia od żywności wg CV28:","pairs":{"Ciągle przegrody":"wysokość nie mniejsza niż sztuki przesyłek","Wolna przestrzeń":"min. 0,8 m","Całkowite przykrycie":"plandeka lub pokrywa"}},"scenario":{"prompt":"Przewozisz UN 2212 (azbest) i artykuły spozywcze. Co robisz?","options":["Ładuje razem bez ograniczeń","Oddzielam wg CV28 — przegroda lub 0,8 m wolnej przestrzeni","Odmawiam przewozu"],"correct":"Oddzielam wg CV28 — przegroda lub 0,8 m wolnej przestrzeni"}},"_currency":"CURRENT","_trust":"T1","_editionRef":"adr-2025","_lifecycle":"PUBLISHED","_entryId":"b4-cv28-zywnosc@adr-2025"},{"id":"b4-cv3-cv15","block":4,"topic":"Decyzja o załadunku","kind":"ref","scope":"podstawowy","adrRef":"ADR CV3 / CV15","source":"kompendium","page":24,"edition":"ADR 2025","status":"core","verifiedBy":"domo","formats":["mcq"],"why":"Przepisy dotyczące manipulowania i układania wprowadzają ograniczenie masy ładunku na jednostkę transportową (na \"ot
